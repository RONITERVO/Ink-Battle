<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ebe3d5">
    <title>Age of War: Sketchbook Edition 1.0</title>
    <link rel="manifest" href="manifest.webmanifest">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Patrick+Hand&display=swap');

        /* CSS Variables - Dynamic Transition System */
        :root {
            --background: 39 35% 90%;
            --foreground: 25 15% 20%;
            --card: 39 40% 95%;
            --primary: 25 20% 25%;
            --secondary: 35 25% 85%;
            --accent: 18 60% 55%;
            --destructive: 0 65% 50%;
            --muted-foreground: 25 10% 45%;
            --pencil: 25 15% 25%;
            --pencil-light: 25 10% 55%;

            /* Difficulty Colors */
            --diff-normal: 25 15% 25%;
            --diff-hard: 200 45% 45%;
            --diff-harder: 30 80% 50%;
            --diff-impossible: 0 65% 50%;
        }

        /* Resets & Base Styles */
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
            font-family: 'Patrick Hand', 'Comic Sans MS', 'Segoe Print', cursive;
            overflow: hidden;
            touch-action: none;
            transition: background-color 2s ease, color 2s ease;
        }

        /* Visual Elements & Realism */
        .sketchbook-spine {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 40px;
            background: linear-gradient(to right, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0.05) 80%, transparent 100%);
            border-right: 2px dashed hsl(var(--pencil-light) / 0.4);
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
        }

        .ring-hole {
            width: 15px;
            height: 15px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.8), 1px 1px 1px rgba(255, 255, 255, 0.2);
        }

        .paper-texture {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
            box-shadow: inset 0 0 150px rgba(0, 0, 0, 0.1);
            transition: opacity 2s ease;
        }

        .coffee-stain {
            position: absolute;
            width: 200px;
            height: 200px;
            right: 5%;
            bottom: 10%;
            pointer-events: none;
            background: radial-gradient(circle, transparent 40%, rgba(139, 69, 19, 0.05) 50%, rgba(139, 69, 19, 0.15) 55%, transparent 60%);
            border-radius: 50%;
            filter: blur(2px);
            transform: scaleY(0.8) rotate(15deg);
            z-index: 0;
        }

        .notebook-lines {
            background-image: repeating-linear-gradient(transparent, transparent 31px,
                    hsl(var(--pencil-light) / 0.15) 31px, hsl(var(--pencil-light) / 0.15) 32px);
            background-position-y: 8px;
        }

        .sketchy-border {
            border: 2px solid hsl(var(--pencil));
            border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
            box-shadow: 3px 4px 0px hsl(var(--pencil) / 0.15);
            transition: border-color 2s ease, box-shadow 2s ease;
        }

        .sketchy-border-thin {
            border: 1.5px solid hsl(var(--pencil-light));
            border-radius: 15px 225px 15px 255px / 255px 15px 225px 15px;
            transition: border-color 2s ease;
        }

        .torn-paper {
            clip-path: polygon(0% 2%, 3% 0%, 7% 3%, 11% 1%, 15% 2%, 19% 0%, 23% 2%, 27% 1%, 31% 3%, 35% 0%, 39% 2%, 43% 1%, 47% 3%, 51% 0%, 55% 2%, 59% 1%, 63% 0%, 67% 3%, 71% 1%, 75% 2%, 79% 0%, 83% 3%, 87% 1%, 91% 2%, 95% 0%, 100% 2%, 100% 98%, 97% 100%, 93% 97%, 89% 100%, 85% 98%, 81% 100%, 77% 97%, 73% 100%, 69% 98%, 65% 100%, 61% 97%, 57% 100%, 53% 98%, 49% 100%, 45% 97%, 41% 100%, 37% 98%, 33% 100%, 29% 97%, 25% 100%, 21% 98%, 17% 100%, 13% 97%, 9% 100%, 5% 98%, 0% 100%);
            background-color: hsl(var(--card));
            transition: background-color 2s ease;
        }

        /* Typography & Animations */
        .font-sketch {
            font-family: 'Caveat', 'Comic Sans MS', 'Segoe Print', cursive;
        }

        .font-hand {
            font-family: 'Patrick Hand', 'Comic Sans MS', 'Segoe Print', cursive;
        }

        @keyframes subtleFloat {

            0%,
            100% {
                transform: translateY(0) rotate(-1deg);
            }

            50% {
                transform: translateY(-4px) rotate(1deg);
            }
        }

        @keyframes pulseAlert {

            0%,
            100% {
                transform: scale(1);
                filter: brightness(1);
            }

            50% {
                transform: scale(1.05);
                filter: brightness(1.2);
            }
        }

        @keyframes scribbleIn {
            0% {
                opacity: 0;
                transform: translateY(8px) rotate(-1deg);
            }

            100% {
                opacity: 1;
                transform: translateY(0) rotate(0deg);
            }
        }

        .title-float {
            animation: subtleFloat 4s ease-in-out infinite;
        }

        .pulse-alert {
            animation: pulseAlert 1.5s infinite;
            color: hsl(var(--accent));
        }

        /* Layout */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        #aspect-wrapper {
            position: relative;
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;
            background: transparent;
            overflow: hidden;
        }

        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            z-index: 2;
        }

        /* UI Panel structure */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1vw 1vw 1vw 45px;
            z-index: 10;
        }

        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            background: hsl(var(--card) / 0.95);
            height: 19%;
            pointer-events: auto;
            padding: 1vw;
            position: relative;
            backdrop-filter: blur(4px);
        }

        /* Stats Panel */
        #stats-panel {
            width: 22%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0.5vw;
            position: relative;
            margin-left: 2vw;
        }

        .stat-line {
            font-size: 2.3vmin;
            color: hsl(var(--foreground));
            line-height: 1.2;
            font-weight: bold;
        }

        .stat-val {
            font-family: 'Caveat', 'Comic Sans MS', 'Segoe Print', cursive;
            font-size: 3vmin;
            text-shadow: 1px 1px 0px rgba(0, 0, 0, 0.1);
        }

        .text-gold {
            color: #b8860b;
        }

        .text-xp {
            color: #4682b4;
        }

        /* Top Left Actions (Badge & Pause) */
        #top-left-actions {
            position: absolute;
            top: -10px;
            left: -10px;
            display: flex;
            flex-direction: column;
            gap: 0.5vw;
            z-index: 20;
            transform: rotate(-3deg);
        }

        #diff-badge {
            font-size: 1.8vmin;
            padding: 4px 12px;
            border-radius: 4px;
            font-weight: bold;
            color: white;
            box-shadow: 2px 3px 6px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        #btn-pause {
            background: hsl(var(--card));
            font-size: 1.8vmin;
            padding: 4px 12px;
            cursor: pointer;
            color: hsl(var(--foreground));
            box-shadow: 2px 3px 6px rgba(0, 0, 0, 0.25);
            transition: all 0.2s;
        }

        #btn-pause:hover {
            transform: scale(1.05);
        }

        /* Center Panel */
        #center-panel {
            width: 30%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        #age-title {
            font-size: 4vmin;
            color: hsl(var(--primary));
            text-transform: capitalize;
            font-weight: bold;
        }

        .center-btns {
            display: flex;
            gap: 1vw;
            width: 100%;
            height: 60%;
        }

        /* Action Panel */
        #action-panel {
            width: 45%;
            display: flex;
            flex-direction: column;
        }

        #tabs {
            display: flex;
            justify-content: flex-end;
            gap: 0.5vw;
            height: 30%;
        }

        .tab-btn {
            background: transparent;
            color: hsl(var(--muted-foreground));
            font-family: 'Caveat', 'Comic Sans MS', 'Segoe Print', cursive;
            font-size: 2.5vmin;
            border: none;
            cursor: pointer;
            padding: 0 1vw;
            font-weight: bold;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: auto;
        }

        .tab-btn.active {
            color: hsl(var(--foreground));
            border-bottom: 3px solid hsl(var(--accent));
            transform: translateY(-3px) scale(1.05);
        }

        .tab-btn:hover:not(.active) {
            color: hsl(var(--pencil));
            transform: translateY(-1px);
        }

        #build-menu {
            display: flex;
            gap: 1vw;
            height: 70%;
            justify-content: flex-end;
            align-items: center;
        }

        /* General Buttons */
        .btn {
            background: hsl(var(--secondary) / 0.5);
            color: hsl(var(--foreground));
            font-family: 'Patrick Hand', 'Comic Sans MS', 'Segoe Print', cursive;
            font-size: 2.1vmin;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex: 1;
            max-width: 11vw;
            height: 100%;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: auto;
            position: relative;
        }

        .btn:hover:not(:disabled) {
            background: hsl(var(--secondary));
            transform: scale(1.04) rotate(1.5deg);
            box-shadow: 2px 4px 8px rgba(0, 0, 0, 0.1);
        }

        .btn:active:not(:disabled) {
            transform: scale(0.96);
            box-shadow: 0px 1px 2px rgba(0, 0, 0, 0.1);
        }

        .btn:disabled {
            opacity: 0.4;
            filter: grayscale(1);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-cost {
            font-family: 'Caveat', 'Comic Sans MS', 'Segoe Print', cursive;
            font-weight: bold;
            font-size: 2.2vmin;
            margin-top: 2px;
        }

        .btn-evolve {
            background: hsl(var(--accent) / 0.15);
            border-color: hsl(var(--accent));
            color: hsl(var(--accent));
        }

        .btn-special {
            background: hsl(var(--destructive) / 0.1);
            border-color: hsl(var(--destructive));
            color: hsl(var(--destructive));
        }

        .upgrade-val {
            font-size: 1.6vmin;
            color: hsl(var(--muted-foreground));
            line-height: 1;
        }

        /* Tooltip System */
        #tooltip {
            position: absolute;
            pointer-events: none;
            z-index: 100;
            background: hsl(var(--card) / 0.95);
            backdrop-filter: blur(4px);
            padding: 1vw;
            max-width: 20vw;
            transform: translate(-50%, 10px);
            opacity: 0;
            transition: opacity 0.2s;
            box-shadow: 4px 6px 12px rgba(0, 0, 0, 0.15);
        }

        #tooltip.visible {
            opacity: 1;
        }

        .tt-title {
            font-size: 2.5vmin;
            font-weight: bold;
            font-family: 'Caveat', 'Comic Sans MS', 'Segoe Print', cursive;
            color: hsl(var(--primary));
            margin-bottom: 0.5vmin;
            border-bottom: 1px dashed hsl(var(--pencil-light));
            padding-bottom: 2px;
        }

        .tt-stat {
            font-size: 1.8vmin;
            color: hsl(var(--foreground));
            display: flex;
            justify-content: space-between;
            margin-bottom: 2px;
        }

        .tt-desc {
            font-size: 1.6vmin;
            color: hsl(var(--muted-foreground));
            margin-top: 1vmin;
            font-style: italic;
        }

        /* Commander HUD: base health, player prompt, and director response */
        #commander-hud {
            position: absolute;
            width: calc(100% - 40px);
            left: 40px;
            top: 21.5%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 0 2vw;
            gap: 2vw;
            pointer-events: none;
            z-index: 30;
        }

        .commander-col {
            width: clamp(12rem, 27vw, 25rem);
            display: flex;
            flex-direction: column;
            gap: 0.7vmin;
            position: relative;
            pointer-events: none;
        }

        .hp-wrapper {
            position: relative;
            width: 100%;
            height: 3.5vmin;
            background: hsl(var(--card));
            padding: 2px;
            box-shadow: 2px 3px 0px rgba(0, 0, 0, 0.1);
            pointer-events: none;
        }

        .hp-fill {
            height: 100%;
            background: repeating-linear-gradient(45deg, hsl(120, 50%, 60%), hsl(120, 50%, 60%) 10px, hsl(120, 50%, 50%) 10px, hsl(120, 50%, 50%) 20px);
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #enemy-hp-fill {
            background: repeating-linear-gradient(-45deg, hsl(0, 60%, 60%), hsl(0, 60%, 60%) 10px, hsl(0, 60%, 50%) 10px, hsl(0, 60%, 50%) 20px);
            float: right;
        }

        .hp-text {
            position: absolute;
            width: 100%;
            text-align: center;
            top: 0;
            font-size: 2.5vmin;
            font-family: 'Caveat', 'Comic Sans MS', 'Segoe Print', cursive;
            font-weight: bold;
            color: hsl(var(--foreground));
            text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.7);
        }

        .director-writing {
            position: relative;
            pointer-events: auto;
            color: hsl(var(--pencil));
            text-shadow: 0.5px 0.5px 0 hsl(var(--background) / 0.7);
        }

        .player-writing {
            min-height: 5.2vmin;
            padding: 0.2vmin 0.35vmin 0;
        }

        .ai-writing {
            min-height: 12.5vmin;
            padding: 0.2vmin 0.35vmin 0;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            text-align: right;
        }

        #director-form {
            display: block;
        }

        #player-last-line {
            min-height: 2.35vmin;
            color: hsl(var(--pencil) / 0.76);
            font-family: 'Caveat', 'Comic Sans MS', 'Segoe Print', cursive;
            font-size: 2.05vmin;
            font-weight: bold;
            line-height: 1.08;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
        }

        .player-last-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .director-input-row {
            display: flex;
            align-items: flex-end;
            gap: 0.25rem;
            border-bottom: 1.5px dashed hsl(var(--pencil-light) / 0.72);
        }

        #director-input {
            flex: 1;
            min-width: 0;
            border: none;
            background: transparent;
            outline: none;
            color: hsl(var(--pencil));
            font-family: 'Caveat', 'Comic Sans MS', 'Segoe Print', cursive;
            font-size: 2.45vmin;
            font-weight: bold;
            line-height: 1;
            padding: 0 0 0.15vmin;
        }

        #director-input:focus {
            color: hsl(var(--foreground));
        }

        #director-input::placeholder {
            color: hsl(var(--pencil-light) / 0.78);
            font-style: normal;
        }

        #director-form button {
            flex: 0 0 auto;
            width: 2.1rem;
            min-height: 2rem;
            border: none;
            background: transparent;
            color: hsl(var(--pencil));
            font-family: 'Caveat', 'Comic Sans MS', 'Segoe Print', cursive;
            font-size: 2.8vmin;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
            padding: 0;
            transform: rotate(-5deg);
            transition: transform 0.12s, color 0.12s;
        }

        #director-form button:hover {
            color: hsl(var(--accent));
            transform: scale(1.12) rotate(0deg);
        }

        #gemma-card {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.35rem;
            min-height: 1.35vmin;
            margin-top: 0.15vmin;
        }

        #gemma-status {
            min-width: 0;
            color: hsl(var(--muted-foreground) / 0.82);
            font-family: 'Patrick Hand', 'Comic Sans MS', 'Segoe Print', cursive;
            font-size: 1.25vmin;
            line-height: 1;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #gemma-card button {
            flex: 0 0 auto;
            border: none;
            background: transparent;
            color: hsl(var(--accent));
            font-family: 'Caveat', 'Comic Sans MS', 'Segoe Print', cursive;
            font-size: 1.65vmin;
            font-weight: bold;
            cursor: pointer;
            padding: 0;
            text-decoration: underline;
            text-decoration-thickness: 1px;
        }

        #gemma-card button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            text-decoration: none;
        }

        #director-memory {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
            justify-content: flex-end;
            min-height: 1.45vmin;
            margin-bottom: 0.2vmin;
        }

        .memory-chip {
            color: hsl(var(--muted-foreground) / 0.85);
            font-family: 'Caveat', 'Comic Sans MS', 'Segoe Print', cursive;
            font-size: 1.55vmin;
            font-weight: bold;
            line-height: 1;
            text-decoration: underline;
            text-decoration-color: hsl(var(--pencil-light) / 0.45);
            text-decoration-thickness: 1px;
        }

        #director-log {
            min-height: 5.6vmin;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: flex-start;
            overflow: hidden;
        }

        .director-msg {
            max-width: 100%;
            color: hsl(var(--pencil));
            font-family: 'Caveat', 'Comic Sans MS', 'Segoe Print', cursive;
            font-size: 2.35vmin;
            font-weight: bold;
            line-height: 1.08;
            word-break: break-word;
            user-select: text;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        #director-tool-log {
            min-height: 2.35vmin;
            max-height: 2.35vmin;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: flex-start;
            overflow: hidden;
            margin-top: 0.25vmin;
        }

        .director-tool-msg {
            max-width: 100%;
            color: hsl(var(--muted-foreground) / 0.86);
            font-family: 'Patrick Hand', 'Comic Sans MS', 'Segoe Print', cursive;
            font-size: 1.65vmin;
            line-height: 1.12;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            user-select: text;
        }

        .is-writing {
            clip-path: inset(0 100% 0 0);
            animation: pencilWrite 0.48s steps(18, end) forwards;
        }

        .ai-writing .is-writing {
            clip-path: inset(0 0 0 100%);
            animation-name: pencilWriteRight;
        }

        .is-erasing {
            animation: pencilErase 0.2s ease forwards;
        }

        @keyframes pencilWrite {
            0% {
                opacity: 0.2;
                clip-path: inset(0 100% 0 0);
                filter: blur(0.4px);
            }

            100% {
                opacity: 1;
                clip-path: inset(0 0 0 0);
                filter: blur(0);
            }
        }

        @keyframes pencilWriteRight {
            0% {
                opacity: 0.2;
                clip-path: inset(0 0 0 100%);
                filter: blur(0.4px);
            }

            100% {
                opacity: 1;
                clip-path: inset(0 0 0 0);
                filter: blur(0);
            }
        }

        @keyframes pencilErase {
            0% {
                opacity: 1;
                filter: blur(0);
                transform: translateY(0);
            }

            100% {
                opacity: 0;
                filter: blur(1px);
                transform: translateY(-0.2vmin);
            }
        }

        /* Game Over / Start Screens */
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: hsl(var(--background) / 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 50;
            text-align: center;
            backdrop-filter: blur(8px);
            transition: opacity 0.5s;
        }

        .overlay-content {
            width: 70%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4vw;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E"), hsl(var(--card));
        }

        .overlay-screen h1 {
            font-size: 10vmin;
            font-family: 'Caveat', 'Comic Sans MS', 'Segoe Print', cursive;
            color: hsl(var(--foreground));
            margin-bottom: 1vmin;
            text-shadow: 3px 3px 0px hsl(var(--pencil-light)/0.3);
        }

        .overlay-screen p {
            font-size: 3.5vmin;
            margin-bottom: 3vmin;

            cursor: pointer;
            font-family: 'Caveat', 'Comic Sans MS', 'Segoe Print', cursive;
            font-weight: bold;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

            transform: scale(1.05) rotate(-2deg);
            box-shadow: 4px 6px 0px hsl(var(--pencil)/0.2);
        }

        .diff-normal {
            background: hsl(var(--diff-normal));
        }

            background: hsl(var(--diff-hard));
        }

            background: hsl(var(--diff-harder));
        }

        .diff-impossible {
            background: hsl(var(--diff-impossible));
        }

        .medal-icon {
            position: absolute;
            top: -10px;
            right: -10px;
            font-size: 3vmin;
            filter: drop-shadow(2px 2px 1px rgba(0, 0, 0, 0.3));
            display: none;
        }

        .beaten .medal-icon {
            display: block;
            animation: subtleFloat 3s infinite;
        }

        .hidden {
            display: none !important;
        }

        .fade-out {
            opacity: 0;
            pointer-events: none;
        }

        /* Preloader */
        #preloader {
            position: absolute;
            z-index: 100;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            margin-top: 10px;
            font-family: 'Caveat', 'Comic Sans MS', 'Segoe Print', cursive;
            color: hsl(var(--accent));

        }

        #loading-bar-wrap {
            width: 40vw;
            height: 10px;
            background: hsl(var(--pencil-light)/0.3);
            margin-top: 2vmin;
            border-radius: 5px;
            overflow: hidden;
        }

        #loading-bar {
            height: 100%;
            width: 0%;
            background: hsl(var(--accent));
            transition: width 0.2s;
        }

        #pause-overlay {
            z-index: 60;
        }

        @media (max-width: 900px),
        (max-height: 520px) {

            }
        }

        @media (max-height: 460px) {
            #director-memory {

            }
        }

                ['normal', 'hard', 'harder', 'impossible'].forEach(d => {

            key: 'aow_sketch_director_memory_v1',

                try {
                    let stored = localStorage.getItem(this.key);
                    if (stored) {
                        let parsed = JSON.parse(stored);
                        this.data.notes = Array.isArray(parsed.notes) ? parsed.notes.slice(-8) : [];
                        this.data.agreements = Object.assign({}, this.data.agreements, parsed.agreements || {});
                    }
                } catch (e) { console.warn("Director memory blocked"); }
            },
            save() {
                try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) { }
            },
            setAgreement(key, value) {
                this.data.agreements[key] = value;
                this.save();
            },
            setPressure(value) {
                this.data.agreements.pressure = value;
                this.save();
            },
            addNote(note) {
                let clean = String(note || '').trim().slice(0, 90);
                if (!clean) return;
                this.data.notes = this.data.notes.filter(n => n.toLowerCase() !== clean.toLowerCase());
                this.data.notes.push(clean);
                this.data.notes = this.data.notes.slice(-8);
                this.save();
            },

                    notes: [],
                    agreements: { noSpecials: false, noTurrets: false, meleeOnly: false, pressure: 'balanced' }
                };

                if (a.noSpecials) tags.push('no specials');
                if (a.noTurrets) tags.push('no turrets');

        // --- PROCEDURAL WATERCOLOR ENGINE (RESTORED TO ITERATION 1) ---
        const WatercolorEngine = {
            canvases: [],
            generateAll() {
                return new Promise(resolve => {
                    let index = 0;
                    const bar = document.getElementById('loading-bar');

                    const step = () => {
                        if (index < AGES.length) {
                            this.canvases.push(this.renderWash(index));
                            if (bar) bar.style.width = `${((index + 1) / AGES.length) * 100}%`;
                            index++;
                            requestAnimationFrame(step);
                        } else {
                            resolve();
                        }
                    };
                    step();
                });
            },
            renderWash(ageIndex) {
                const wc = document.createElement('canvas');
                wc.width = CANVAS_WIDTH; wc.height = CANVAS_HEIGHT;

                // Exact Iteration 1 implementation (No alpha:false, source-over blending)
                const xctx = wc.getContext('2d');
                xctx.globalCompositeOperation = 'source-over';

                const theme = AGES[ageIndex].theme;
                let hslBg = `hsl(${theme.bg})`;
                let hslAcc = `hsl(${theme.accent})`;

                for (let i = 0; i < 45; i++) {
                    let isCorner = Math.random() > 0.3;
                    let cx = isCorner ? (Math.random() > 0.5 ? Math.random() * 400 : CANVAS_WIDTH - Math.random() * 400) : Math.random() * CANVAS_WIDTH;
                    let cy = isCorner ? (Math.random() > 0.5 ? Math.random() * 300 : CANVAS_HEIGHT - Math.random() * 300) : Math.random() * CANVAS_HEIGHT;
                    let radius = 100 + Math.random() * 250;

                    this.drawWatercolorBlob(xctx, cx, cy, radius, hslBg, 0.08);
                    if (Math.random() < 0.25) {
                        this.drawWatercolorBlob(xctx, cx, cy, radius * 0.6, hslAcc, 0.04);
                    }
                }

                for (let i = 0; i < 15; i++) {
                    this.drawWatercolorBlob(xctx, Math.random() * CANVAS_WIDTH, GROUND_Y - 100 + Math.random() * 200, 200 + Math.random() * 400, hslBg, 0.04);
                }
                return wc;
            },
            drawWatercolorBlob(ctx, x, y, r, color, alpha) {
                ctx.save();
                ctx.fillStyle = color;
                ctx.globalAlpha = alpha;

                ctx.beginPath();
                const points = 14;
                for (let i = 0; i <= points; i++) {
                    let angle = (i / points) * Math.PI * 2;
                    let radiusVariation = r + (Math.random() - 0.5) * r * 0.4;
                    let px = x + Math.cos(angle) * radiusVariation;
                    let py = y + Math.sin(angle) * radiusVariation;

                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.bezierCurveTo(x + Math.cos(angle - 0.2) * radiusVariation, y + Math.sin(angle - 0.2) * radiusVariation, px, py, px, py);
                }
                ctx.fill();
                ctx.lineWidth = 1.5 + Math.random() * 2;
                ctx.strokeStyle = color;
                ctx.globalAlpha = alpha * 1.5;
                ctx.stroke();
                ctx.restore();
            }
        };

            pushTurn(entry) {

                    if (old.role === 'player') this.queueEvent(`Earlier player message: ${old.text}`, false);
                    else if (old.role === 'model') {

                this.data.openLoops = this.data.openLoops.filter(loop => !String(loop).startsWith('Answer player:'));

                this.save();
                NativeGemma.log('memory.compact.native_ready', { jobId, summaryChars: this.data.summary.length, doNotRepeat: this.data.doNotRepeat.length });
            },
            nativeError(jobId, message) {
                if (this.data && this.data.pendingJobId === jobId) {
                    this.data.pendingJobId = '';
                    this.save();
                }
                NativeGemma.log('memory.compact.native_error', { jobId, message: String(message || '') });
            },
            removeAvoidPhrases(text) {
                let result = this.cleanLine(text, 700);
                this.data.doNotRepeat.forEach(phrase => {
                    let clean = this.cleanLine(phrase, 80);
                    if (clean.length < 8) return;
                    result = result.split(clean).join('[previous line]');
                });
                return this.cleanLine(result, 700);
            },
            shouldRewriteSay(text) {
                let clean = this.cleanLine(text, 180);
                if (!clean) return false;
                let lower = clean.toLowerCase();
                if (lower.includes("let's see") || lower.includes('break this stalemate') || lower.includes('little stone age')) return true;
                return this.data.doNotRepeat.some(line => {
                    let avoid = this.cleanLine(line, 80).toLowerCase();
                    return avoid.length >= 8 && (lower === avoid || lower.includes(avoid));
                });
            },
            rewriteSay(turn, outcome) {
                let openLoop = this.data.openLoops.find(loop => String(loop).startsWith('Answer player:'));
                if (openLoop) return this.cleanLine(`I hear you. ${openLoop.replace('Answer player:', '').trim()} is on my page while I keep the lane moving.`, 150);
                let snapshot = AIDirector.snapshot();
                let variants = [
                    'I am changing the line now; the old plan is too easy to read.',
                    'Your army count is the problem, so I am spending to contest the lane.',
                    'That push is getting room. I need pressure that actually matters.',
                    'The board is not decided yet; I am shifting the next buy.'
                ];
                if (snapshot.enemyHpRatio < 0.3) variants.unshift('My base is under real pressure; this turn is about survival.');
                else if (snapshot.threatCount >= 3) variants.unshift('Your front line is too close, so I am answering the lane.');
                else if (globalTime > 120) variants.unshift(`This ${AGES[gameState.enemy.age].name} fight is dragging; I am changing tempo.`);
                let idx = (this.data.turnCount || 0) % variants.length;
                return variants[idx];
            }
        };

        // --- LOCAL GEMMA BRIDGE ---
        const NativeGemma = {
            available: false,
            status: { state: 'browser', modelName: 'Local fallback', progress: 0, totalRamGb: 0 },
            pending: {},
            lastRequestAt: -999,
            init() {
                this.available = !!window.LocalGemmaAndroid;
                this.refresh();
                if (this.available) setInterval(() => this.refresh(), 4000);
            },
            refresh() {
                if (!this.available) {
                    this.updateStatus({ state: 'unavailable', modelName: 'Android Gemma', progress: 0 });
                    return;
                }
                try {
                    this.updateStatus(JSON.parse(window.LocalGemmaAndroid.getStatus()));
                } catch (e) {
                    this.updateStatus({ state: 'error', modelName: 'Android Gemma', message: 'Bridge unavailable' });
                }
            },
            log(event, details = {}) {
                if (!this.available || !window.LocalGemmaAndroid || typeof window.LocalGemmaAndroid.logDirectorEvent !== 'function') return;
                try {
                    window.LocalGemmaAndroid.logDirectorEvent(String(event || 'event'), JSON.stringify(details || {}));
                } catch (e) { }
            },
            updateStatus(next) {
                this.status = Object.assign({}, this.status, next || {});
                let label = '';
                let action = 'Get';
                let disabled = false;
                let visible = false;
                let state = this.status.state || 'unknown';
                let ram = this.status.totalRamGb ? ` (${this.status.totalRamGb}GB)` : '';

                if (state === 'ready') {
                    label = '';
                    disabled = true;
                } else if (state === 'loading') {
                    label = 'Gemma loading';
                    action = '';
                    disabled = true;
                    visible = true;
                } else if (state === 'downloading') {
                    let pct = Math.max(0, Math.min(100, Math.floor(this.status.progress || 0)));
                    label = `Gemma download ${pct}%`;
                    action = '';
                    disabled = true;
                    visible = true;
                } else if (state === 'installed') {
                    label = 'Gemma is stored';
                    action = 'load';
                    visible = true;
                } else if (state === 'unavailable') {
                    label = '';
                    disabled = true;
                } else if (state === 'error') {
                    label = this.status.message || 'Gemma retry needed';
                    action = 'retry';
                    visible = true;
                } else {
                    label = `offline Gemma${ram}`;
                    action = 'get';
                    visible = this.available;
                }

                let card = document.getElementById('gemma-card');
                let statusEl = document.getElementById('gemma-status');
                let button = document.getElementById('btn-gemma-install');
                if (card) card.classList.toggle('hidden', !visible);
                if (statusEl) statusEl.innerText = label;
                if (button) {
                    button.innerText = action;
                    button.disabled = disabled;
                    button.classList.toggle('hidden', !action);
                }
            },
            install() {
                if (!this.available) {
                    DirectorPanel.addSystem('Packaged Android build needed for local Gemma.');
                    return;
                }
                let model = this.status.modelName || 'Gemma 4 E2B';
                let size = this.status.recommendedSizeGb || 2.58;
                let ok = confirm(`${model} will download about ${size} GB to this device and then run offline. Continue?`);
                if (!ok) return;
                try {
                    let response = JSON.parse(window.LocalGemmaAndroid.requestInstall('auto'));
                    this.updateStatus(response);
                    DirectorPanel.addSystem('Gemma download started. Local fallback stays active.');
                } catch (e) {
                    DirectorPanel.addSystem('Android could not start the Gemma download.');
                }
            },
            requestTurn(reason, extraMessage = '') {
                if (!this.available || !gameState.running || gameState.paused) return false;
                if (!['ready', 'installed'].includes(this.status.state)) return false;
                if (this.status.state === 'installed') {
                    try { window.LocalGemmaAndroid.loadModel(); } catch (e) { }
                    this.updateStatus(Object.assign({}, this.status, { state: 'loading' }));
                    return false;
                }
                let minGap = reason === 'player_chat' ? 4 : 18;
                if (this.status.busy || globalTime - this.lastRequestAt < minGap) return false;

                let snapshot = AIDirector.snapshot();
                let enemyAgeData = AGES[gameState.enemy.age];
                let agreements = DirectorMemory.data.agreements || {};
                let nextUpgradeCosts = {};
                ['dmg', 'hp', 'econ'].forEach(type => {
                    let level = Math.max(0, Math.min(9, gameState.enemy.upgrades[type] || 0));
                    nextUpgradeCosts[type] = gameState.enemy.upgrades[type] >= 10 ? null : UPGRADE_COSTS[level];
                });
                let enemyGold = Math.floor(gameState.enemy.gold);
                let affordableUnits = enemyAgeData.units
                    .map((unit, idx) => ({ typeIndex: idx, name: unit.name, type: unit.type, cost: unit.cost }))
                    .filter(unit => enemyGold >= unit.cost && !(agreements.meleeOnly && unit.type === 'ranged'));
                let affordableUpgrades = ['dmg', 'hp', 'econ'].filter(type => gameState.enemy.upgrades[type] < 10 && enemyGold >= nextUpgradeCosts[type]);
                let openTurretSlots = gameState.enemy.turrets.filter((slot, idx) => slot === null && idx < gameState.enemy.unlockedSlots).length;
                let affordableTurrets = (!agreements.noTurrets && openTurretSlots > 0)
                    ? enemyAgeData.turrets.map((turret, idx) => ({ typeIndex: idx, cost: turret.cost })).filter(turret => enemyGold >= turret.cost)
                    : [];
                let affordableTools = [];
                if (affordableUnits.length) affordableTools.push('spawn_unit');
                if (affordableUpgrades.length) affordableTools.push('buy_upgrade');
                if (affordableTurrets.length || (!agreements.noTurrets && gameState.enemy.unlockedSlots < 4 && enemyGold >= gameState.enemy.unlockedSlots * 500)) affordableTools.push('build_turret');
                if (!agreements.noSpecials && gameState.enemy.specialTimer <= 0 && !gameState.specialActive) affordableTools.push('use_special');
                affordableTools.push('none');
                let requestId = `g${Date.now()}_${Math.floor(Math.random() * 10000)}`;
                let payload = {
                    version: RELEASE_VERSION,
                    reason,
                    extraMessage,
                    turnInstruction: reason === 'player_chat'
                        ? 'Answer extraMessage directly in say before choosing an action. Keep it in character and do not ignore the player.'
                        : 'Comment on the current battle state without repeating recent lines.',
                    difficulty: currentDifficulty,
                    memory: DirectorMemory.data,
                    gemmaMemory: GemmaMemory.buildContext(snapshot, reason),
                    snapshot: {
                        time: Math.round(globalTime),
                        player: {
                            age: AGES[gameState.player.age].name,
                            hpRatio: Number(snapshot.playerHpRatio.toFixed(2)),
                            gold: Math.floor(gameState.player.gold),
                            xp: Math.floor(gameState.player.xp),
                            units: snapshot.playerUnits
                        },
                        enemy: {
                            age: AGES[gameState.enemy.age].name,
                            hpRatio: Number(snapshot.enemyHpRatio.toFixed(2)),
                            gold: Math.floor(gameState.enemy.gold),
                            xp: Math.floor(gameState.enemy.xp),
                            units: snapshot.enemyUnits
                        },
                        lane: {
                            threatCount: snapshot.threatCount,
                            heavyThreat: snapshot.heavyThreat,
                            closestThreatDist: Math.floor(snapshot.closestThreatDist),
                            pressure: snapshot.pressure
                        }
                    },
                    enemyChoices: {
                        unitOptions: enemyAgeData.units.map((unit, idx) => ({
                            typeIndex: idx,
                            name: unit.name,
                            type: unit.type,
                            cost: unit.cost
                        })),
                        turretCosts: enemyAgeData.turrets.map(turret => turret.cost),
                        upgradeLevels: Object.assign({}, gameState.enemy.upgrades),
                        nextUpgradeCosts,
                        affordableUnits,
                        affordableUpgrades,
                        affordableTurrets,
                        affordableTools,
                        openTurretSlots,
                        canBuyTurretSlot: gameState.enemy.unlockedSlots < 4,
                        specialReady: gameState.enemy.specialTimer <= 0 && !gameState.specialActive
                    },
                    constraints: {
                        oneActionOnly: true,
                        jsonOnly: true,
                        validTools: ['spawn_unit', 'buy_upgrade', 'build_turret', 'use_special', 'none'],
                        chooseOnlyAffordableTools: affordableTools,
                        validTypeIndexes: [0, 1, 2],
                        validUpgrades: ['dmg', 'hp', 'econ'],
                        noSpecials: !!agreements.noSpecials,
                        noTurrets: !!agreements.noTurrets,
                        meleeOnly: !!agreements.meleeOnly,
                        pressurePlan: agreements.pressure || 'balanced',
                        mercyAllowsBaseDefense: snapshot.enemyHpRatio < 0.5 || snapshot.threatCount > 0,
                        avoidRepeatedOpeners: true
                    },
                    schema: {
                        say: 'short in-character message',
                        pressure: 'rush|balanced|mercy|null',
                        action: {
                            tool: 'spawn_unit|buy_upgrade|build_turret|use_special|none',
                            typeIndex: '0,1,2 for unit or turret',
                            upgrade: 'dmg|hp|econ',
                            reason: 'short reason'
                        }
                    }
                };
                let payloadJson = JSON.stringify(payload);

                this.pending[requestId] = payload;
                this.lastRequestAt = globalTime;
                this.status.busy = true;
                this.updateStatus(this.status);
                this.log('request.pre_send', {
                    requestId,
                    reason,
                    gameTime: Math.round(globalTime),
                    payloadChars: payloadJson.length,
                    difficulty: currentDifficulty,
                    memorySummaryChars: GemmaMemory.data ? GemmaMemory.data.summary.length : 0
                });
                try {
                    window.LocalGemmaAndroid.generateDirectorTurn(requestId, payloadJson);
                    return true;
                } catch (e) {
                    delete this.pending[requestId];
                    this.status.busy = false;
                    this.updateStatus(this.status);
                    this.log('request.bridge_error', { requestId, message: String(e && e.message ? e.message : e) });
                    return false;
                }
            },
            receive(requestId, rawText) {
                delete this.pending[requestId];
                this.status.busy = false;
                this.refresh();
                let parsed = parseGemmaJson(rawText);
                if (!parsed) {
                    this.log('response.parse_failed', { requestId, rawText: String(rawText || '') });
                    DirectorPanel.addModel(String(rawText || ''));
                    return;
                }
                this.log('response.parsed', { requestId, turn: parsed });
                applyGemmaDirectorTurn(parsed, requestId);
            },
            error(requestId, message) {
                delete this.pending[requestId];
                this.status.busy = false;
                this.updateStatus(Object.assign({}, this.status, { state: this.status.state === 'ready' ? 'ready' : 'error', message }));
                this.log('request.error', { requestId, message: String(message || '') });
                DirectorPanel.addSystem(`Local Gemma could not answer: ${message}`);
            }
        };

        function installLocalGemma() {
            if (NativeGemma.status.state === 'installed') {
                try { window.LocalGemmaAndroid.loadModel(); } catch (e) { }
                NativeGemma.updateStatus(Object.assign({}, NativeGemma.status, { state: 'loading' }));
                return;
            }
            NativeGemma.install();
        }

        function parseGemmaJson(rawText) {
            let text = String(rawText || '').trim();
            let first = text.indexOf('{');
            let last = text.lastIndexOf('}');
            if (first === -1 || last <= first) return null;
            try { return JSON.parse(text.slice(first, last + 1)); } catch (e) { return null; }
        }

        function applyGemmaDirectorTurn(turn, requestId = '') {
            if (turn.pressure && ['rush', 'balanced', 'mercy'].includes(turn.pressure)) {
                DirectorMemory.setPressure(turn.pressure);
                DirectorPanel.renderMemory();
            }

            let action = turn.action || {};
            let reason = action.reason || 'Gemma plan';
            let requestedTool = action.tool || 'none';
            let applied = false;
            let originalSay = turn.say ? String(turn.say) : '';
            if (requestedTool === 'spawn_unit') applied = AIDirector.trySpawnUnit(Math.max(0, Math.min(2, Number(action.typeIndex) || 0)), reason);
            else if (requestedTool === 'buy_upgrade') applied = AIDirector.tryUpgrade(['dmg', 'hp', 'econ'].includes(action.upgrade) ? action.upgrade : 'econ', reason);
            else if (requestedTool === 'build_turret') applied = AIDirector.tryBuildTurret(reason);
            else if (requestedTool === 'use_special') applied = AIDirector.trySpecial(reason);

            if (GemmaMemory.shouldRewriteSay(originalSay)) {
                turn.say = GemmaMemory.rewriteSay(turn, { requestId, requestedTool, applied });
                NativeGemma.log('say.rewritten', { requestId, originalSay, rewritten: turn.say });
            }

            NativeGemma.log('action.result', {
                requestId,
                requestedTool,
                applied,
                pressure: turn.pressure || null,
                action
            });
            GemmaMemory.recordModel(turn, { requestId, requestedTool, applied }, originalSay);
            if (!applied && requestedTool !== 'none') DirectorPanel.addSystem('model move unavailable');

            if (turn.say) DirectorPanel.addModel(turn.say);
        }

        window.onLocalGemmaStatus = (json) => {
            try { NativeGemma.updateStatus(JSON.parse(json)); } catch (e) { }
        };
        window.onLocalGemmaResponse = (requestId, text) => NativeGemma.receive(requestId, text);
        window.onLocalGemmaError = (requestId, message) => NativeGemma.error(requestId, message);
        window.onLocalGemmaMemory = (jobId, text) => GemmaMemory.receiveNative(jobId, text);
        window.onLocalGemmaMemoryError = (jobId, message) => GemmaMemory.nativeError(jobId, message);

        // --- DIRECTOR CHAT SURFACE (COMMANDER HUD) ---
        const DirectorPanel = {
            els: {},
            aiWriteTimeout: null,
            playerWriteTimeout: null,
            systemWriteTimeout: null,
            init() {
                ['commander-hud', 'ai-hud', 'director-log', 'director-tool-log', 'director-input', 'director-memory', 'player-last-line', 'btn-pause'].forEach(id => {
                    this.els[id] = document.getElementById(id);
                });
                this.renderMemory();
            },
            start(diffKey) {
                if (!this.els['ai-hud']) return;
                GemmaMemory.start(diffKey);
                this.els['ai-hud'].classList.remove('hidden');
                if (this.els['director-log']) this.els['director-log'].innerHTML = '';
                if (this.els['director-tool-log']) this.els['director-tool-log'].innerHTML = '';
                if (this.els['player-last-line']) {
                    this.els['player-last-line'].innerHTML = '';
                    this.els['player-last-line'].classList.add('hidden');
                }
                this.renderMemory();
                NativeGemma.refresh();

                setTimeout(() => {
                    this.addSystem(`Director online. Pacts and notes are active.`);
                }, 800);
            },
            add(role, text, tool = false) {
                if (!text) return;
                if (role === 'player') {
                    this.writeLatest(this.els['player-last-line'], this.normalizeLine(text, 120), 'player-last-text', 'player');
                    return;
                }
                this.addSystem(text);
            },
            addModel(text) {
                let message = this.normalizeLine(text, 220);
                if (!message) return;
                this.writeLatest(this.els['director-log'], message, 'director-msg', 'ai');
            },
            normalizeLine(text, maxLen = 220) {
                return String(text || '').replace(/\s+/g, ' ').trim().slice(0, maxLen);
            },
            writeLatest(host, text, className, lane) {
                if (!host || !text) return;
                host.classList.remove('hidden');
                let timeoutKey = lane === 'player' ? 'playerWriteTimeout' : (lane === 'system' ? 'systemWriteTimeout' : 'aiWriteTimeout');
                clearTimeout(this[timeoutKey]);

                let render = () => {
                    host.innerHTML = '';
                    let row = document.createElement('div');
                    row.className = `${className} is-writing`;
                    row.innerText = text;
                    host.appendChild(row);
                };

                let current = host.firstElementChild;
                if (current) {
                    current.classList.remove('is-writing');
                    current.classList.add('is-erasing');
                    this[timeoutKey] = setTimeout(render, 190);
                } else {
                    render();
                }
            },
            addSystem(text) {
                let host = this.els['director-tool-log'];
                if (!host || !text) return;
                this.writeLatest(host, this.normalizeLine(text, 96), 'director-tool-msg', 'system');
            },
            showAction(toolName, reason) {
                let name = String(toolName || '').toLowerCase();
                let label = 'move';
                if (name.includes('spawn') || name.includes('unit')) label = 'unit';
                else if (name.includes('upgrade') || name.includes('econ') || name.includes('dmg') || name.includes('hp')) label = 'upgrade';
                else if (name.includes('turret') || name.includes('slot')) label = 'fort';
                else if (name.includes('evolve') || name.includes('age')) label = 'age';
                else if (name.includes('special')) label = 'special';

                let detail = String(reason || 'new plan').replace(/\s+/g, ' ').trim().slice(0, 64);
                this.addSystem(`${label}: ${detail}`);
            },
            renderMemory() {
                let host = this.els['director-memory'];
                if (!host) return;
                host.innerHTML = '';
                DirectorMemory.tags().forEach(tag => {
                    let chip = document.createElement('span');
                    chip.className = 'memory-chip';
                    chip.innerText = tag;
                    host.appendChild(chip);
                });
            },
            handlePlayerText(raw) {
                let message = String(raw || '').trim();
                if (!message) return;
                this.add('player', message);
                GemmaMemory.recordPlayer(message);

                let text = message.toLowerCase();
                let replies = [];

                if (/\bforget\b|clear memory|reset memory/.test(text)) {
                    DirectorMemory.clear();
                    GemmaMemory.clearAll();
                    AIDirector.restraintUntil = 0;
                    replies.push('Fresh page. I dropped the saved pacts and notes.');
                }

                let rememberMatch = message.match(/\bremember\s+(.+)/i);
                if (rememberMatch && rememberMatch[1]) {
                    DirectorMemory.addNote(rememberMatch[1]);
                    replies.push('Noted for later matches.');
                }

                if (/no\s+special|don'?t use special|no\s+ult/.test(text)) {
                    DirectorMemory.setAgreement('noSpecials', true);
                    replies.push('Agreed: no enemy specials.');
                } else if (/specials?\s+(ok|allowed|on)|use specials?/.test(text)) {
                    DirectorMemory.setAgreement('noSpecials', false);
                    replies.push('Specials are back on the page.');
                }

                if (/no\s+turret|don'?t build turret/.test(text)) {
                    DirectorMemory.setAgreement('noTurrets', true);
                    replies.push('Agreed: I will not buy enemy turrets.');
                } else if (/turrets?\s+(ok|allowed|on)|build turrets?/.test(text)) {
                    DirectorMemory.setAgreement('noTurrets', false);
                    replies.push('Turrets are allowed again.');
                }

                if (/melee only|no ranged|only melee/.test(text)) {
                    DirectorMemory.setAgreement('meleeOnly', true);
                    replies.push('Agreed: enemy unit buys avoid ranged units.');
                } else if (/all units|ranged ok|anything goes|use ranged/.test(text)) {
                    DirectorMemory.setAgreement('meleeOnly', false);
                    replies.push('All enemy unit types are available again.');
                }

                if (/go easy|take it easy|mercy|soft/.test(text)) {
                    DirectorMemory.setPressure('mercy');
                    replies.push('I will spend slower unless your army reaches my base.');
                } else if (/rush|aggressive|pressure me|try hard|harder/.test(text)) {
                    DirectorMemory.setPressure('rush');
                    AIDirector.restraintUntil = 0;
                    replies.push('Pressure plan accepted. I will stop hoarding and push.');
                } else if (/balanced|fair|normal plan/.test(text)) {
                    DirectorMemory.setPressure('balanced');
                    replies.push('Balanced plan restored.');
                }

                if (/truce|pause attacks|give me/.test(text)) {
                    let secondsMatch = text.match(/(\d{1,2})\s*(sec|second)/);
                    let seconds = secondsMatch ? Math.max(10, Math.min(60, parseInt(secondsMatch[1], 10))) : 30;
                    AIDirector.setRestraint(seconds);
                    replies.push(`Truce for ${seconds}s unless you hit my doorstep.`);
                }

                if (replies.length === 0) {
                    replies.push('I heard you. I will keep reading the lane and adapt.');
                }

                this.renderMemory();
                GemmaMemory.recordSystem(`Local director replied: ${replies.join(' ')}`);
                setTimeout(() => this.add('ai', replies.join(' ')), 400);
                NativeGemma.requestTurn('player_chat', message);
            }
        };

        function submitDirectorChat(event) {
            event.preventDefault();
            let input = DirectorPanel.els['director-input'];
            if (!input) return;
            DirectorPanel.handlePlayerText(input.value);
            input.value = '';
        }

        function toggleDirectorPanel() {
            let hud = DirectorPanel.els['ai-hud'];
            if (hud) hud.classList.toggle('hidden');
        }

        function togglePause(forceState) {
            if (!gameState || !gameState.running) return;
            gameState.paused = typeof forceState === 'boolean' ? forceState : !gameState.paused;
            let overlay = document.getElementById('pause-overlay');
            let btn = DirectorPanel.els['btn-pause'];
            if (overlay) overlay.classList.toggle('hidden', !gameState.paused);
            if (btn) btn.innerText = gameState.paused ? 'Resume' : 'Pause';
            if (!gameState.paused) lastTime = performance.now();
        }

        // --- LOCAL TOOL-USING OPPONENT DIRECTOR ---
        const AIDirector = {
            actionTimer: 1,
            chatTimer: 4,
            gemmaTimer: 14,
            restraintUntil: 0,
            lastPlayerAge: 0,
            lastEnemyAge: 0,
            lastActionNoticeAt: -99,
            start(diffKey) {
                this.actionTimer = 0.8;
                this.chatTimer = 3.5;
                this.gemmaTimer = 12;
                this.restraintUntil = 0;
                this.lastPlayerAge = 0;
                this.lastEnemyAge = 0;
                this.lastActionNoticeAt = -99;
                this.lowHpWarned = false;
                DirectorPanel.start(diffKey);
            },
            tick(dt) {
                let ai = gameState.enemy;
                if (!ai || ai.drawProgress < 1) return;

                this.actionTimer -= dt;
                this.chatTimer -= dt;
                this.gemmaTimer -= dt;
                let snapshot = this.snapshot();
                this.maybeMilestoneChat(snapshot);

                if (this.actionTimer <= 0) {
                    this.actionTimer = this.nextThinkDelay();
                    this.chooseAction(snapshot);
                }
                if (this.chatTimer <= 0) {
                    this.chatTimer = 8 + Math.random() * 7;
                    this.comment(snapshot);
                }
                if (this.gemmaTimer <= 0) {
                    this.gemmaTimer = 22 + Math.random() * 10;
                    NativeGemma.requestTurn('periodic_director_turn');
                }
            },
            setRestraint(seconds) {
                this.restraintUntil = Math.max(this.restraintUntil, globalTime + seconds);
            },
            nextThinkDelay() {
                let pressure = DirectorMemory.data.agreements.pressure;
                let pressureFactor = pressure === 'rush' ? 0.7 : (pressure === 'mercy' ? 1.7 : 1);
                let difficultyFactor = 1 - (currentConfig.aiAggression * 0.12);
                return Math.max(0.25, (currentConfig.thinkRate * pressureFactor * difficultyFactor) + Math.random() * 0.45);
            },
            snapshot() {
                let ai = gameState.enemy;
                let player = gameState.player;
                let playerUnits = 0, enemyUnits = 0, threatCount = 0;
                let heavyThreat = false, closestThreatDist = Infinity;
                let playerFront = BASE_WIDTH, enemyFront = CANVAS_WIDTH - BASE_WIDTH;

                for (let i = 0; i < gameState.units.pool.length; i++) {
                    let u = gameState.units.pool[i];
                    if (!u.active || u.hp <= 0 || u.drawProgress < 0.5) continue;
                    if (u.team === 1) {
                        playerUnits++;
                        playerFront = Math.max(playerFront, u.x);
                        let dist = (CANVAS_WIDTH - BASE_WIDTH) - u.x;
                        if (dist < closestThreatDist) closestThreatDist = dist;
                        if (dist < 620) threatCount++;
                        if (dist < 620 && u.type === 'heavy') heavyThreat = true;
                    } else {
                        enemyUnits++;
                        enemyFront = Math.min(enemyFront, u.x);
                    }
                }

                return {
                    playerUnits, enemyUnits, threatCount, heavyThreat,
                    closestThreatDist: Number.isFinite(closestThreatDist) ? closestThreatDist : 9999,
                    lanePressure: playerFront - (CANVAS_WIDTH - enemyFront),
                    playerHpRatio: player.hp / player.maxHp,
                    enemyHpRatio: ai.hp / ai.maxHp,
                    enemyGold: ai.gold,
                    pressure: DirectorMemory.data.agreements.pressure,
                    restrained: globalTime < this.restraintUntil
                };
            },
            maybeMilestoneChat(snapshot) {
                if (gameState.player.age !== this.lastPlayerAge) {
                    this.lastPlayerAge = gameState.player.age;
                    let line = `You reached ${AGES[gameState.player.age].name}. I am updating the counter-plan.`;
                    DirectorPanel.add('ai', line);
                    GemmaMemory.recordSystem(line);
                }
                if (gameState.enemy.age !== this.lastEnemyAge) {
                    this.lastEnemyAge = gameState.enemy.age;
                    DirectorPanel.showAction('evolve_enemy', AGES[gameState.enemy.age].name);
                    GemmaMemory.recordSystem(`Enemy evolved to ${AGES[gameState.enemy.age].name}.`);
                }
                if (snapshot.enemyHpRatio < 0.25 && !this.lowHpWarned) {
                    this.lowHpWarned = true;
                    let line = 'My base is down to the margin. Expect defensive spending.';
                    DirectorPanel.add('ai', line);
                    GemmaMemory.recordSystem(line);
                }
            },
            comment(snapshot) {
                let a = DirectorMemory.data.agreements;
                if (snapshot.restrained) {
                    DirectorPanel.add('ai', 'Truce timer is still active. I am using the quiet turns for upgrades.');
                } else if (a.noSpecials || a.noTurrets || a.meleeOnly) {
                    DirectorPanel.add('ai', `Pacts still active: ${DirectorMemory.tags().join(', ')}.`);
                } else if (snapshot.threatCount >= 4) {
                    DirectorPanel.add('ai', 'Your line is stacked near my base. I am spending defensively.');
                } else if (snapshot.pressure === 'rush') {
                    DirectorPanel.add('ai', 'You asked for pressure, so I am converting gold into bodies.');
                } else if (snapshot.pressure === 'mercy') {
                    DirectorPanel.add('ai', 'Mercy plan is on. I will not flood the lane while you are behind.');
                } else {
                    DirectorPanel.add('ai', 'I am watching age timing, gold float, and front-line distance.');
                }
            },
            chooseAction(snapshot) {
                if (this.tryEvolve()) return;

                if (snapshot.restrained && snapshot.threatCount < 2) {
                    if (this.tryUpgrade('econ', 'truce economy')) return;
                    if (this.tryUpgrade('hp', 'truce fortify')) return;
                    return;
                }

                if ((snapshot.threatCount >= 5 || snapshot.heavyThreat) && this.trySpecial('clear the pressure wave')) return;
                if (snapshot.threatCount > 0 && this.tryBuildTurret('base defense')) return;
                if (snapshot.enemyHpRatio < 0.45 && this.tryUpgrade('hp', 'stabilize base')) return;

                let ai = gameState.enemy;
                let ecoTarget = 2 + Math.floor(currentConfig.aiAggression * 4) + (snapshot.pressure === 'rush' ? 1 : 0);
                if (ai.upgrades.econ < ecoTarget && snapshot.threatCount < 4 && this.tryUpgrade('econ', 'long game income')) return;

                if (snapshot.pressure === 'mercy' && snapshot.playerHpRatio < 0.45 && snapshot.threatCount < 3) {
                    if (this.tryUpgrade('dmg', 'holding attacks back')) return;
                    return;
                }

                if (snapshot.pressure === 'rush') {
                    if (this.trySpawnUnit(2, 'rush heavy')) return;
                    if (this.trySpawnUnit(1, 'rush support')) return;
                    if (this.trySpawnUnit(0, 'rush filler')) return;
                }

                if (snapshot.threatCount >= 3) {
                    if (this.trySpawnUnit(1, 'answer nearby units')) return;
                    if (this.trySpawnUnit(0, 'stall the lane')) return;
                }

                let ageData = AGES[ai.age];
                if (ai.gold >= ageData.units[2].cost * (1.4 - currentConfig.aiAggression * 0.4) && this.trySpawnUnit(2, 'timed power unit')) return;
                if (snapshot.enemyUnits < Math.max(2, Math.floor(snapshot.playerUnits * 0.9)) && this.trySpawnUnit(1, 'match your army count')) return;
                if ((currentConfig.aiAggression > 0.45 || ai.gold > ageData.units[0].cost * 5) && this.trySpawnUnit(0, 'keep lane presence')) return;
            },
            tryEvolve() {
                let ai = gameState.enemy;
                if (ai.age >= AGES.length - 1 || ai.xp < AGES[ai.age].evolveXP) return false;
                ai.age++;
                ai.drawProgress = 0;
                let newMax = AGES[ai.age].baseHp * currentConfig.baseHpMult * getStatMult(ai, 'hp');
                ai.hp += (newMax - ai.maxHp);
                ai.maxHp = newMax;
                ai.turrets = [null, null, null, null];
                ai.turretTimers = [0, 0, 0, 0];
                this.lastEnemyAge = ai.age;
                this.reportTool('evolve_enemy', AGES[ai.age].name, true);
                return true;
            },
            tryUpgrade(type, reason) {
                let ai = gameState.enemy;
                let lvl = ai.upgrades[type];
                if (lvl >= 10) return false;
                let cost = UPGRADE_COSTS[lvl];
                if (ai.gold < cost) return false;
                ai.gold -= cost;
                ai.upgrades[type]++;
                if (type === 'hp') {
                    let newMax = AGES[ai.age].baseHp * currentConfig.baseHpMult * getStatMult(ai, 'hp');
                    ai.hp += (newMax - ai.maxHp);
                    ai.maxHp = newMax;
                }
                this.reportTool(`buy_upgrade:${type}`, reason);
                return true;
            },
            tryBuildTurret(reason) {
                let a = DirectorMemory.data.agreements;
                if (a.noTurrets) return false;
                let ai = gameState.enemy;
                let emptySlot = ai.turrets.findIndex((t, idx) => t === null && idx < ai.unlockedSlots);
                if (emptySlot === -1) {
                    let slotCost = ai.unlockedSlots * 500;
                    if (ai.unlockedSlots < 4 && ai.gold >= slotCost) {
                        ai.gold -= slotCost;
                        ai.unlockedSlots++;
                        this.reportTool('buy_turret_slot', reason);
                        return true;
                    }
                    return false;
                }

                let ageData = AGES[ai.age];
                let typeIdx = 0;
                if (ai.gold >= ageData.turrets[2].cost && currentConfig.aiAggression > 0.45) typeIdx = 2;
                else if (ai.gold >= ageData.turrets[1].cost) typeIdx = 1;
                let cost = ageData.turrets[typeIdx].cost;
                if (ai.gold < cost) return false;
                ai.gold -= cost;
                ai.turrets[emptySlot] = typeIdx;
                ai.turretProgress[emptySlot] = 0;
                this.reportTool(`build_turret:${ageData.turrets[typeIdx].name}`, reason);
                return true;
            },
            trySpecial(reason) {
                let a = DirectorMemory.data.agreements;
                let ai = gameState.enemy;
                if (a.noSpecials || ai.specialTimer > 0 || gameState.specialActive) return false;
                triggerSpecial(-1);
                ai.specialTimer = AGES[ai.age].special.cooldown;
                this.reportTool(`use_special:${AGES[ai.age].special.name}`, reason, true);
                return true;
            },
            trySpawnUnit(typeIdx, reason) {
                let a = DirectorMemory.data.agreements;
                let ai = gameState.enemy;
                let data = AGES[ai.age].units[typeIdx];
                if (!data) return false;
                if (a.meleeOnly && data.type === 'ranged') return false;
                if (globalTime < this.restraintUntil && reason.indexOf('answer') === -1 && reason.indexOf('stall') === -1) return false;
                if (ai.gold < data.cost) return false;
                ai.gold -= data.cost;
                spawnUnit(-1, ai.age, typeIdx);
                this.reportTool(`spawn_unit:${data.name}`, reason);
                return true;
            },
            reportTool(name, reason, force = false) {
                if (force || globalTime - this.lastActionNoticeAt > 1.8) {
                    DirectorPanel.showAction(name, reason);
                    if (force || /special|evolve|age/i.test(name)) {
                        GemmaMemory.recordSystem(`Fallback action ${name}: ${reason}`);
                    }
                    this.lastActionNoticeAt = globalTime;
                }
            }
        };

        // --- OBJECT POOL ARCHITECTURE (ZERO-GC GAMEPLAY) ---
        class ObjectPool {
            constructor(maxSize, factory) {
                this.factory = factory;
                this.pool = new Array(maxSize);
                for (let i = 0; i < maxSize; i++) { this.pool[i] = factory(); this.pool[i].active = false; }
            }
            spawn(props) {
                for (let i = 0; i < this.pool.length; i++) {
                    if (!this.pool[i].active) {
                        let obj = this.pool[i];
                        for (let k in props) obj[k] = props[k];
                        obj.active = true; return obj;
                    }
                }
                // Expand dynamically if impossible limits hit.
                let obj = this.factory();
                for (let k in props) obj[k] = props[k];
                obj.active = true; this.pool.push(obj);
                return obj;
            }
        }

        // --- GAME ENGINE STATE ---
        let gameState = {};
        let globalIdSequence = 0;
        let lastTime = 0;
        let globalTime = 0;
        let currentTab = 'units';

        // Pre-allocate large physics arrays to avoid GC
        let physicsAllies = new Array(500); let physicsAlliesCount = 0;
        let physicsEnemies = new Array(500); let physicsEnemiesCount = 0;

        // --- SQUIGGLEVISION MAGIC ---
        function jitterVal(x, y, amp) {
            let frame = Math.floor(globalTime * 8) % 3;
            let seed = x * 12.9898 + y * 78.233 + frame * 13.131;
            let h = Math.sin(seed) * 43758.5453;
            return ((h - Math.floor(h)) - 0.5) * amp;
        }

        function setSketchStyle(color, thickness = 2) {
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = thickness;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }

        function applyDash(progress, pathLen) {
            if (progress >= 1.0) { ctx.setLineDash([]); return; }
            let dash = pathLen;
            ctx.setLineDash([dash, dash]);
            ctx.lineDashOffset = dash * (1.0 - progress);
        }

        function drawRoughLine(x1, y1, x2, y2, passes = 2, jAmp = 3, progress = 1.0) {
            ctx.beginPath();
            let len = Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
            for (let i = 0; i < passes; i++) {
                let ox1 = x1 + jitterVal(x1, y1 + i, jAmp);
                let oy1 = y1 + jitterVal(x1 + i, y1, jAmp);
                let ox2 = x2 + jitterVal(x2, y2 + i, jAmp);
                let oy2 = y2 + jitterVal(x2 + i, y2, jAmp);
                ctx.moveTo(ox1, oy1);
                let mx = (x1 + x2) / 2 + jitterVal((x1 + x2) / 2, (y1 + y2) / 2 + i, jAmp * 2);
                let my = (y1 + y2) / 2 + jitterVal((x1 + x2) / 2 + i, (y1 + y2) / 2, jAmp * 2);
                ctx.quadraticCurveTo(mx, my, ox2, oy2);
            }
            applyDash(progress, len);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawRoughCircle(cx, cy, r, passes = 2, jAmp = 3, progress = 1.0) {
            ctx.beginPath();
            let len = 2 * Math.PI * r;
            for (let i = 0; i < passes; i++) {
                let jc_x = cx + jitterVal(cx, cy + i, jAmp);
                let jc_y = cy + jitterVal(cx + i, cy, jAmp);
                let jr = r + jitterVal(r, i, jAmp);
                ctx.arc(jc_x, jc_y, jr, 0, Math.PI * 2);
            }
            applyDash(progress, len * passes);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function fillScribble(x, y, w, h, color, density = 5, progress = 1.0) {
            if (progress <= 0) return;
            ctx.strokeStyle = color;
            ctx.lineWidth = 1;
            ctx.beginPath();
            let totalLines = Math.floor(w / density);
            let linesToDraw = Math.max(1, Math.floor(totalLines * progress));
            for (let i = 0; i <= linesToDraw; i++) {
                let cx = x + (i * density);
                let j1 = jitterVal(cx, y, 5);
                let j2 = jitterVal(cx, y + h, 5);
                ctx.moveTo(cx + j1, y + Math.abs(j1));
                ctx.lineTo(cx + j2, y + h - Math.abs(j2));
            }
            ctx.stroke();
        }

        // --- BOOTSTRAP INITIALIZATION ---
        window.onload = () => {
            UIManager.init();
            TooltipManager.init();
            StorageManager.init();
            DirectorMemory.init();
            GemmaMemory.init();
            DirectorPanel.init();
            NativeGemma.init();

            // Async generation of heavy procedural assets
            WatercolorEngine.generateAll().then(() => {
                document.getElementById('preloader').classList.add('hidden');
                document.getElementById('game-container').classList.remove('hidden');
            });
        };

        document.addEventListener('visibilitychange', () => {
            if (document.hidden && gameState && gameState.running && !gameState.paused) {
                togglePause(true);
            }
        });

        if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
            navigator.serviceWorker.register('./service-worker.js').catch(() => { });
        }

        function initGame(diffKey) {
            if (gameState && gameState.running) return;
            document.getElementById('start-screen').classList.add('fade-out');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('pause-overlay').classList.add('hidden');
            document.getElementById('ui-layer').classList.remove('hidden');

            currentDifficulty = diffKey;
