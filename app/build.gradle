plugins {
    id 'com.android.application'
}

def generatedWebAssetsDir = layout.buildDirectory.dir('generated/web-assets').get().asFile

android {
    namespace = 'com.ronitervo.inkbattle'
    compileSdk = 36
    buildToolsVersion = '36.0.0'

    signingConfigs {
        release {
            def keystorePropertiesFile = rootProject.file("keystore.properties")
            if (keystorePropertiesFile.exists()) {
                def keystoreProperties = new Properties()
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                storeFile = rootProject.file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId = 'com.ronitervo.inkbattle'
        // Google Play automatic protection requires Android 7.0 / API 24 or newer.
        minSdk = 24
        targetSdk = 36
        versionCode = 212
        versionName = '2.2.0'
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDir(generatedWebAssetsDir)
        }
    }
}

dependencies {
    implementation("com.google.ai.edge.litertlm:litertlm-android:0.11.0")
}

tasks.register('syncWebAssets', Sync) {
    from(rootProject.file('ink-battle.html'))
    from(rootProject.file('mr.html'))
    from(rootProject.file('index.html'))
    from(rootProject.file('privacy-policy.html'))
    from(rootProject.file('manifest.webmanifest'))
    from(rootProject.file('service-worker.js'))
    from(rootProject.file('favicon.ico'))
    from(rootProject.file('web')) { into 'web'; exclude 'vendor/**' }
    from(rootProject.file('src/client/game.css')) { into 'src/client' }
    from(rootProject.file('src/mr/tabletop.css')) { into 'src/mr' }
    from(rootProject.file('assets')) {
        into 'assets'
    }
    into(generatedWebAssetsDir)
}

tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn(tasks.named('syncWebAssets'))
}

tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }.configureEach {
    dependsOn(tasks.named('syncWebAssets'))
}
