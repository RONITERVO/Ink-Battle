                let specialReady = !agreements.noSpecials && gameState.enemy.specialTimer <= 0 && !gameState.specialActive;
                let affordableTools = [];
                if (affordableUnits.length) affordableTools.push('spawn_unit');
                if (affordableUpgrades.length) affordableTools.push('buy_upgrade');
                if (affordableTurrets.length || canBuyTurretSlot) affordableTools.push('build_turret');
                if (specialReady) affordableTools.push('use_special');
                affordableTools.push('none');
                let cleanExtraMessage = normalizeGemmaRecentUserMessage(extraMessage, 120);
                let requestedUserLineId = options && options.userLineId ? String(options.userLineId) : '';
                let relayComment = null;
                if (reason === 'player_chat' && cleanExtraMessage) {
                    relayComment = {
                        lineId: requestedUserLineId || (this.queuedUserComment ? this.queuedUserComment.lineId : ''),
                        text: cleanExtraMessage,
                        source: 'player_chat'
                    };
                } else if (this.queuedUserComment && this.queuedUserComment.text) {
                    relayComment = {
                        lineId: this.queuedUserComment.lineId,
                        text: this.queuedUserComment.text,
                        source: 'queued_recent_player_line'
                    };
                }

                let contextImageDataUrl = captureGemmaContextImage(snapshot);
                let requestId = `g${Date.now()}_${Math.floor(Math.random() * 10000)}`;
                let actionChoices = buildGemmaActionChoices({
                    affordableUnits,
                    affordableUpgrades,
                    affordableTurrets,
                    openTurretSlots,
                    canBuyTurretSlot,
                    specialReady
                });
                let doctrineChoices = buildGemmaDoctrineChoices();
                let roleplay = buildGemmaRoleplayPrompts({
                    reason,
                    cleanExtraMessage,
                    relayComment,
                    snapshot,
                    actionChoices,
                    doctrineChoices
                });
                let payload = {
                    version: RELEASE_VERSION,
                    mode: 'roleplay_v1',
                    reason,
                    difficulty: currentDifficulty,
                    extraMessage: cleanExtraMessage,
                    roleplay,
                    actionChoices,
                    doctrineChoices,
                    debug: {
                        contextImageAttached: !!contextImageDataUrl,
                        affordableTools,
                        memorySummaryChars: GemmaMemory.data ? GemmaMemory.data.summary.length : 0
                    }
                };
                let payloadJson = JSON.stringify(payload);

                this.pending[requestId] = {
                    payload,
                    reason,
                    userLineId: relayComment ? relayComment.lineId : '',
                    relayedUserMessage: relayComment ? relayComment.text : ''
                };
                this.lastRequestAt = globalTime;
                this.status.busy = true;
                this.updateStatus(this.status);
                DirectorPanel.beginModelThoughts(requestId, reason);
                this.log('request.pre_send', {
                    requestId,
                    reason,
                    gameTime: Math.round(globalTime),
                    payloadChars: payloadJson.length,
                    difficulty: currentDifficulty,
                    memorySummaryChars: GemmaMemory.data ? GemmaMemory.data.summary.length : 0,
                    contextImageChars: contextImageDataUrl ? contextImageDataUrl.length : 0
                });
                try {
                    if (contextImageDataUrl && typeof window.LocalGemmaAndroid.generateDirectorTurnWithImage === 'function') {
                        window.LocalGemmaAndroid.generateDirectorTurnWithImage(requestId, payloadJson, contextImageDataUrl);
                    } else {
                        window.LocalGemmaAndroid.generateDirectorTurn(requestId, payloadJson);
                    }
                    if (relayComment && relayComment.lineId) {
                        DirectorPanel.markPlayerLineSeen(relayComment.lineId, requestId);
                    }
                    if (relayComment && this.queuedUserComment) {
                        let sameLine = relayComment.lineId && relayComment.lineId === this.queuedUserComment.lineId;
                        let sameText = relayComment.text === this.queuedUserComment.text;
                        if (sameLine || sameText) this.queuedUserComment = null;
                    }
                    return true;
                } catch (e) {
                    delete this.pending[requestId];
                    this.status.busy = false;
                    this.updateStatus(this.status);
                    DirectorPanel.failModelThoughts(requestId, 'bridge error');
                    this.log('request.bridge_error', { requestId, message: String(e && e.message ? e.message : e) });
                    return false;
                }
            },
            stream(requestId, phase, text, done) {
                DirectorPanel.updateModelThoughts(requestId, phase, text, !!done);
            },
            receive(requestId, rawText) {
                let pendingMeta = this.pending[requestId] || null;
                delete this.pending[requestId];
                this.status.busy = false;
                this.refresh();
                let roleplayResult = parseGemmaRoleplayResult(rawText);
                if (roleplayResult) {
                    this.log('response.roleplay', {
                        requestId,
                        doctrineWord: roleplayResult.doctrineWord || '',
                        actionWord: roleplayResult.actionWord || '',
                        replyChars: String(roleplayResult.reply || '').length,
                        summaryChars: String(roleplayResult.summary || '').length,
                        elapsedMs: roleplayResult.elapsedMs || 0
                    });
                    applyGemmaRoleplayTurn(roleplayResult, requestId, pendingMeta);
                    return;
                }
                let parsed = parseGemmaJson(rawText);
                if (!parsed) {
                    this.log('response.parse_failed', { requestId, rawText: String(rawText || '') });
                    DirectorPanel.failModelThoughts(requestId, 'parse failed');
                    DirectorPanel.addModelRaw(String(rawText || '').trim() || '<<empty model response>>');
                    return;
                }
                if (parsed._recovered) {
                    delete parsed._recovered;
                    this.log('response.parse_recovered', { requestId, turn: parsed });
                }
                this.log('response.parsed', {
                    requestId,
                    turn: parsed,
                    reason: pendingMeta && pendingMeta.reason ? pendingMeta.reason : ''
                });
                applyGemmaDirectorTurn(parsed, requestId);
            },
            error(requestId, message) {
                delete this.pending[requestId];
                this.status.busy = false;
                this.updateStatus(Object.assign({}, this.status, { state: this.status.state === 'ready' ? 'ready' : 'error', message }));
                this.log('request.error', { requestId, message: String(message || '') });
                DirectorPanel.failModelThoughts(requestId, String(message || 'error'));
                DirectorPanel.addSystem(`Local Gemma could not answer: ${message}`);
            }
        };

        function installLocalGemma() {
            if (NativeGemma.status.state === 'installed') {
                try { window.LocalGemmaAndroid.loadModel(); } catch (e) { }
                NativeGemma.updateStatus(Object.assign({}, NativeGemma.status, { state: 'loading' }));
                return;
            }
            NativeGemma.install();
        }

        function parseGemmaJson(rawText) {
            let text = String(rawText || '').trim();
            if (!text) return null;

            let candidates = buildGemmaJsonCandidates(text);
            for (let i = 0; i < candidates.length; i++) {
                let parsed = tryParseGemmaCandidate(candidates[i]);
                if (parsed) return parsed;
            }

            return recoverGemmaTurnFromText(text);
        }

        function buildGemmaJsonCandidates(text) {
            let cleaned = String(text || '').trim();
            cleaned = cleaned.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();

            let seeds = [cleaned];
            let balanced = extractBalancedJsonObject(cleaned);
            if (balanced) seeds.push(balanced);
            let first = cleaned.indexOf('{');
            if (first !== -1) {
                let fromFirst = cleaned.slice(first).trim();
                seeds.push(fromFirst);
                let last = fromFirst.lastIndexOf('}');
                if (last > 0) seeds.push(fromFirst.slice(0, last + 1));
            }

            let unique = [];
            let seen = Object.create(null);
            for (let i = 0; i < seeds.length; i++) {
                let seed = String(seeds[i] || '').replace(/\u0000/g, '').trim();
                if (!seed || seen[seed]) continue;
                seen[seed] = true;
                unique.push(seed);

                let repaired = repairJsonLikeText(seed);
                if (repaired && !seen[repaired]) {
                    seen[repaired] = true;
                    unique.push(repaired);
                }
            }
            return unique;
        }

        function repairJsonLikeText(text) {
            let repaired = String(text || '').trim();
            if (!repaired) return '';

            // Fix common local-model artifacts like ," ,"memoryPatch" and dangling commas/quotes.
            repaired = repaired.replace(/,\s*"\s*,\s*"/g, ',"');
            repaired = repaired.replace(/"\s*(memPatch|memory_patch)"\s*:/g, '"memoryPatch":');
            repaired = repaired.replace(/,\s*"(?=\s*[}\]])/g, '');
            repaired = repaired.replace(/,\s*([}\]])/g, '$1');
            repaired = balanceJsonBrackets(repaired);
            return repaired.trim();
        }

        function extractBalancedJsonObject(text) {
            let source = String(text || '');
            let start = source.indexOf('{');
            if (start === -1) return '';

            let depth = 0;
            let inString = false;
            let escaped = false;
            for (let i = start; i < source.length; i++) {
                let ch = source[i];
                if (inString) {
                    if (escaped) escaped = false;
                    else if (ch === '\\') escaped = true;
                    else if (ch === '"') inString = false;
                    continue;
                }
                if (ch === '"') {
                    inString = true;
                    continue;
                }
                if (ch === '{') depth++;
                else if (ch === '}') {
                    depth--;
                    if (depth === 0) return source.slice(start, i + 1).trim();
                }
            }
            return source.slice(start).trim();
        }

        function balanceJsonBrackets(text) {
            let out = String(text || '');
            let stack = [];
            let inString = false;
            let escaped = false;

            for (let i = 0; i < out.length; i++) {
                let ch = out[i];
                if (inString) {
                    if (escaped) escaped = false;
                    else if (ch === '\\') escaped = true;
                    else if (ch === '"') inString = false;
                    continue;
                }
                if (ch === '"') {
                    inString = true;
                    continue;
                }
                if (ch === '{' || ch === '[') stack.push(ch);
                else if (ch === '}' && stack[stack.length - 1] === '{') stack.pop();
                else if (ch === ']' && stack[stack.length - 1] === '[') stack.pop();
            }

            while (stack.length > 0) {
                out += stack.pop() === '{' ? '}' : ']';
            }
            return out;
        }

        function tryParseGemmaCandidate(candidate) {
            if (!candidate) return null;
            try {
                let parsed = JSON.parse(candidate);
                if (!parsed || typeof parsed !== 'object') return null;
                return normalizeGemmaTurnObject(parsed);
            } catch (e) {
                return null;
            }
        }

        function cleanGemmaText(value, maxLen = 220) {
            return String(value || '').replace(/\s+/g, ' ').trim().slice(0, maxLen);
        }

        function normalizeGemmaList(value, maxItems = 6, maxLen = 120) {
            return (Array.isArray(value) ? value : [])
                .map(item => cleanGemmaText(item, maxLen))
                .filter(Boolean)
                .slice(0, maxItems);
        }

        function normalizeGemmaMemoryPatch(patch) {
            if (!patch || typeof patch !== 'object') return null;
            let out = {};

            let summary = cleanGemmaText(patch.summary, 700);
            if (summary) out.summary = summary;

            let openLoops = normalizeGemmaList(patch.openLoops, 5, 120);
            if (openLoops.length) out.openLoops = openLoops;

            return Object.keys(out).length ? out : null;
        }

        function normalizeGemmaTurnObject(parsed) {
            if (!parsed || typeof parsed !== 'object') return null;
            let raw = (parsed.turn && typeof parsed.turn === 'object') ? parsed.turn : parsed;
            if (!raw || typeof raw !== 'object') return null;

            let turn = {};
            let say = cleanGemmaText(raw.say, 240);
            if (say) turn.say = say;

            let pressure = cleanGemmaText(raw.pressure, 16).toLowerCase();
            if (['rush', 'balanced', 'mercy'].includes(pressure)) turn.pressure = pressure;

            let actionRaw = raw.action && typeof raw.action === 'object' ? raw.action : null;
            if (actionRaw) {
                let action = {};
                let tool = cleanGemmaText(actionRaw.tool, 24);
                if (['spawn_unit', 'buy_upgrade', 'build_turret', 'use_special', 'none'].includes(tool)) {
                    action.tool = tool;
                }
                let typeIndex = Number(actionRaw.typeIndex);
                if (Number.isFinite(typeIndex)) action.typeIndex = Math.max(0, Math.min(2, Math.round(typeIndex)));
                let upgrade = cleanGemmaText(actionRaw.upgrade, 12).toLowerCase();
                if (['dmg', 'hp', 'econ'].includes(upgrade)) action.upgrade = upgrade;
                let reason = cleanGemmaText(actionRaw.reason, 96);
                if (reason) action.reason = reason;
                if (Object.keys(action).length > 0) {
                    if (!action.tool) action.tool = 'none';
                    turn.action = action;
                }
            }

            let patch = normalizeGemmaMemoryPatch(raw.memoryPatch || raw.memory || raw.turnMemory);
            if (patch) turn.memoryPatch = patch;

            if (!turn.say && !turn.action) return null;
            if (!turn.say) turn.say = 'I am adjusting the plan.';
            return turn;
        }

        function recoverGemmaTurnFromText(text) {
            let say = extractJsonStringField(text, 'say');
            let pressure = extractJsonStringField(text, 'pressure');
            let tool = extractJsonStringField(text, 'tool');
            let reason = extractJsonStringField(text, 'reason');
            let upgrade = extractJsonStringField(text, 'upgrade');
            let typeIndex = extractJsonNumberField(text, 'typeIndex');

            let turn = {};
            if (say) turn.say = say;
            if (['rush', 'balanced', 'mercy'].includes(pressure)) turn.pressure = pressure;

            if (tool || reason || upgrade || typeIndex !== null) {
                turn.action = {};
                if (['spawn_unit', 'buy_upgrade', 'build_turret', 'use_special', 'none'].includes(tool)) {
                    turn.action.tool = tool;
                }
                if (Number.isFinite(typeIndex)) turn.action.typeIndex = typeIndex;
                if (upgrade) turn.action.upgrade = upgrade;
                if (reason) turn.action.reason = reason;
                if (!turn.action.tool) turn.action.tool = 'none';
            }

            if (!turn.say && !turn.action) return null;
            if (!turn.say) turn.say = 'I am adjusting the plan.';
            let normalized = normalizeGemmaTurnObject(turn);
            if (!normalized) return null;
            normalized._recovered = true;
            return normalized;
        }

        function extractJsonStringField(text, key) {
            let escapedKey = String(key || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            let match = String(text || '').match(new RegExp('"' + escapedKey + '"\\s*:\\s*"((?:\\\\.|[^"\\\\])*)"', 'i'));
            if (!match) return '';
            return decodeJsonLikeString(match[1]).trim();
        }

        function extractJsonNumberField(text, key) {
            let escapedKey = String(key || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            let match = String(text || '').match(new RegExp('"' + escapedKey + '"\\s*:\\s*(-?\\d+|null)', 'i'));
            if (!match) return null;
            if (String(match[1]).toLowerCase() === 'null') return null;
            let value = Number(match[1]);
            return Number.isFinite(value) ? value : null;
        }

        function decodeJsonLikeString(value) {
            return String(value || '')
                .replace(/\\u([0-9a-fA-F]{4})/g, (_, hex) => String.fromCharCode(parseInt(hex, 16)))
                .replace(/\\n/g, ' ')
                .replace(/\\r/g, ' ')
                .replace(/\\t/g, ' ')
                .replace(/\\"/g, '"')
                .replace(/\\\\/g, '\\');
        }

        function applyGemmaDirectorTurn(turn, requestId = '') {
            if (turn.pressure && ['rush', 'balanced', 'mercy'].includes(turn.pressure)) {
                DirectorMemory.setPressure(turn.pressure);
                DirectorPanel.renderMemory();
            }

            let action = turn.action || {};
            let reason = action.reason || 'Gemma plan';
            let requestedTool = action.tool || 'none';
            let applied = false;
            if (requestedTool === 'spawn_unit') applied = AIDirector.trySpawnUnit(Math.max(0, Math.min(2, Number(action.typeIndex) || 0)), reason);
            else if (requestedTool === 'buy_upgrade') applied = AIDirector.tryUpgrade(['dmg', 'hp', 'econ'].includes(action.upgrade) ? action.upgrade : 'econ', reason);
            else if (requestedTool === 'build_turret') applied = AIDirector.tryBuildTurret(reason);
            else if (requestedTool === 'use_special') applied = AIDirector.trySpecial(reason);

            NativeGemma.log('action.result', {
                requestId,
                requestedTool,
                applied,
                pressure: turn.pressure || null,
                action
            });
            GemmaMemory.recordModel(turn, { requestId, requestedTool, applied });
            if (!applied && requestedTool !== 'none') DirectorPanel.addSystem('model move unavailable');

            if (turn.say) DirectorPanel.addModel(turn.say);
        }

        function applyGemmaRoleplayTurn(result, requestId = '', pendingMeta = null) {
            let payload = pendingMeta && pendingMeta.payload ? pendingMeta.payload : {};
            let doctrine = selectGemmaDoctrineChoice(result && result.doctrineWord, payload.doctrineChoices || []);
            let choice = selectGemmaActionChoice(result && result.actionWord, payload.actionChoices || []);
            let action = {
                tool: choice.tool || 'none',
                typeIndex: Number.isFinite(Number(choice.typeIndex)) ? Number(choice.typeIndex) : 0,
                upgrade: choice.upgrade || '',
                reason: choice.reason || `Gemma chose ${choice.token || 'none'}`
            };
            let requestedTool = action.tool || 'none';
            let applied = false;
            if (requestedTool === 'spawn_unit') applied = AIDirector.trySpawnUnit(Math.max(0, Math.min(2, Number(action.typeIndex) || 0)), action.reason);
            else if (requestedTool === 'buy_upgrade') applied = AIDirector.tryUpgrade(['dmg', 'hp', 'econ'].includes(action.upgrade) ? action.upgrade : 'econ', action.reason);
            else if (requestedTool === 'build_turret') applied = AIDirector.tryBuildTurret(action.reason);
            else if (requestedTool === 'use_special') applied = AIDirector.trySpecial(action.reason);

            NativeGemma.log('action.roleplay_result', {
                requestId,
                doctrineWord: result && result.doctrineWord ? result.doctrineWord : '',
                selectedDoctrine: doctrine.token || 'balanced',
                actionWord: result && result.actionWord ? result.actionWord : '',
                selectedToken: choice.token || '',
                requestedTool,
                applied
            });
            GemmaMemory.recordRoleplay(result || {}, choice, doctrine, { requestId, requestedTool, applied });
            DirectorPanel.finishModelThoughts(requestId, result && result.reply ? result.reply : 'I am watching the line and holding my next move.');
            DirectorPanel.renderMemory();
            DirectorPanel.addSystem(`doctrine: ${doctrine.token || 'balanced'} | choice: ${choice.token || 'none'}${!applied && requestedTool !== 'none' ? ' blocked' : ''}`);
        }

        window.onLocalGemmaStatus = (json) => {
            try { NativeGemma.updateStatus(JSON.parse(json)); } catch (e) { }
        };
        window.onLocalGemmaStream = (requestId, phase, text, done) => NativeGemma.stream(requestId, phase, text, done);
        window.onLocalGemmaResponse = (requestId, text) => NativeGemma.receive(requestId, text);
        window.onLocalGemmaError = (requestId, message) => NativeGemma.error(requestId, message);

        // --- DIRECTOR CHAT SURFACE (COMMANDER HUD) ---
        const DirectorPanel = {
            els: {},
            aiWriteTimeout: null,
            playerWriteTimeout: null,
            systemWriteTimeout: null,
            playerLineSeq: 0,
            currentPlayerLine: null,
            thoughtEntries: {},
            init() {
                ['commander-hud', 'ai-hud', 'director-log', 'director-tool-log', 'director-input', 'director-memory', 'player-last-line', 'btn-pause'].forEach(id => {
                    this.els[id] = document.getElementById(id);
                });
                this.renderMemory();
            },
            start(diffKey) {
                if (!this.els['ai-hud']) return;
                GemmaMemory.start(diffKey);
                this.els['ai-hud'].classList.remove('hidden');
                if (this.els['director-log']) this.els['director-log'].innerHTML = '';
                if (this.els['director-tool-log']) this.els['director-tool-log'].innerHTML = '';
                if (this.els['player-last-line']) {
                    this.els['player-last-line'].innerHTML = '';
                    this.els['player-last-line'].classList.add('hidden');
                }
                this.playerLineSeq = 0;
                this.currentPlayerLine = null;
                this.thoughtEntries = {};
                this.renderMemory();
                NativeGemma.refresh();

                setTimeout(() => {
                    this.addSystem(`Director online. Pacts and notes are active.`);
                }, 800);
            },
            add(role, text, tool = false) {
                if (!text) return;
                if (role === 'player') {
                    return this.addPlayerLine(text);
                }
                this.addSystem(text);
            },
            addPlayerLine(text) {
                let message = this.normalizeLine(text, 120);
                if (!message) return '';
                this.playerLineSeq++;
                let line = {
                    id: `pl${Date.now()}_${this.playerLineSeq}`,
                    text: message,
                    seen: false,
                    requestId: ''
                };
                this.currentPlayerLine = line;
                this.renderPlayerLine(line);
                return line.id;
            },
            renderPlayerLine(line) {
                let host = this.els['player-last-line'];
                if (!host || !line) return;
                host.classList.remove('hidden');
                clearTimeout(this.playerWriteTimeout);

                let render = () => {
                    host.innerHTML = '';
                    let row = document.createElement('div');
                    row.className = 'player-last-text is-writing';
                    row.setAttribute('data-player-line-id', line.id);

                    let seen = document.createElement('span');
                    seen.className = `player-last-seen ${line.seen ? 'is-seen' : 'is-pending'}`;
                    seen.innerText = line.seen ? 'seen' : 'pending';

                    let text = document.createElement('span');
                    text.className = 'player-last-message';
                    text.innerText = line.text;

                    row.appendChild(seen);
                    row.appendChild(text);
                    host.appendChild(row);
                };

                let current = host.firstElementChild;
                if (current) {
                    current.classList.remove('is-writing');
                    current.classList.add('is-erasing');
                    this.playerWriteTimeout = setTimeout(render, 190);
                } else {
                    render();
                }
            },
            markPlayerLineSeen(lineId, requestId = '') {
                if (!lineId || !this.currentPlayerLine || this.currentPlayerLine.id !== lineId) return;
                if (requestId && this.currentPlayerLine.requestId === requestId && this.currentPlayerLine.seen) return;

                this.currentPlayerLine.seen = true;
                if (requestId) this.currentPlayerLine.requestId = requestId;

                let host = this.els['player-last-line'];
                let row = host ? host.firstElementChild : null;
                if (row && row.getAttribute('data-player-line-id') === lineId) {
                    let badge = row.querySelector('.player-last-seen');
                    if (badge) {
                        badge.classList.remove('is-pending');
                        badge.classList.add('is-seen');
                        badge.innerText = 'seen';
                    }
                    return;
                }
                this.renderPlayerLine(this.currentPlayerLine);
            },
            addModel(text) {
                let message = this.normalizeLine(this.sanitizeModelLine(text), 220);
                if (!message) return;
                this.writeLatest(this.els['director-log'], message, 'director-msg', 'ai');
            },
            addModelRaw(text) {
                let message = this.normalizeRawModelLine(text, 1400);
                if (!message) return;
                this.writeLatest(this.els['director-log'], message, 'director-msg', 'ai');
            },
            beginModelThoughts(requestId, reason = '') {
                let host = this.els['director-log'];
                if (!host || !requestId) return;
                host.classList.remove('hidden');
                clearTimeout(this.aiWriteTimeout);
                let entry = {
                    requestId,
                    reason,
                    visible: '...',
                    phases: {},
                    done: {},
                    open: false
                };
                this.thoughtEntries = {};
                this.thoughtEntries[requestId] = entry;
                host.innerHTML = '';

                let row = document.createElement('div');
                row.className = 'director-msg has-thoughts is-writing';
                row.setAttribute('data-gemma-request-id', requestId);
                row.setAttribute('role', 'button');
                row.setAttribute('tabindex', '0');
                row.setAttribute('aria-label', 'Toggle opponent thoughts');
                row.addEventListener('click', () => this.toggleModelThoughts(requestId));
                row.addEventListener('keydown', event => {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        this.toggleModelThoughts(requestId);
                    }
                });

                let main = document.createElement('div');
                main.className = 'director-msg-main';

                let toggle = document.createElement('button');
                toggle.className = 'director-thought-toggle';
                toggle.type = 'button';
                toggle.title = 'Opponent thoughts';
                toggle.setAttribute('aria-label', 'Opponent thoughts');
                toggle.innerText = '...';
                toggle.addEventListener('click', event => {
                    event.stopPropagation();
                    this.toggleModelThoughts(requestId);
                });

                let visible = document.createElement('span');
                visible.className = 'director-msg-text';
                visible.innerText = entry.visible;

                let panel = document.createElement('div');
                panel.className = 'director-thought-panel';

                let viewport = document.createElement('div');
                viewport.className = 'director-thought-viewport';

                let track = document.createElement('div');
                track.className = 'director-thought-track';
                track.innerText = 'reading map...';

                viewport.appendChild(track);
                panel.appendChild(viewport);
                main.appendChild(toggle);
                main.appendChild(visible);
                row.appendChild(main);
                row.appendChild(panel);
                host.appendChild(row);

                entry.row = row;
                entry.visibleEl = visible;
                entry.trackEl = track;
            },
            updateModelThoughts(requestId, phase, text, done = false) {
                if (!requestId) return;
                let entry = this.thoughtEntries[requestId];
                if (!entry) {
                    this.beginModelThoughts(requestId, 'model');
                    entry = this.thoughtEntries[requestId];
                    if (!entry) return;
                }
                let clean = this.normalizeThoughtLine(text);
                if (clean) entry.phases[phase] = clean;
                if (done) entry.done[phase] = true;
                if (phase === 'opinion' && clean) entry.visible = this.normalizeLine(clean, 220);
                else if (!entry.phases.opinion && phase === 'battlefield' && clean) entry.visible = 'reading the lane...';
                else if (!entry.phases.opinion && phase === 'action' && clean) entry.visible = 'choosing a move...';
                this.renderThoughtEntry(entry);
            },
            finishModelThoughts(requestId, visibleText) {
                let entry = this.thoughtEntries[requestId];
                if (!entry) {
                    this.addModel(visibleText);
                    return;
                }
                entry.visible = this.normalizeLine(this.sanitizeModelLine(visibleText), 220) || entry.visible || 'I am adjusting the plan.';
                entry.done.final = true;
                this.renderThoughtEntry(entry);
            },
            failModelThoughts(requestId, message) {
                let entry = this.thoughtEntries[requestId];
                if (!entry) return;
                entry.phases.error = this.normalizeLine(message || 'Gemma could not finish', 120);
                if (!entry.phases.opinion) entry.visible = 'The thought broke before a clean reply.';
                this.renderThoughtEntry(entry);
            },
            toggleModelThoughts(requestId) {
                let entry = this.thoughtEntries[requestId];
                if (!entry || !entry.row) return;
                entry.open = !entry.open;
                entry.row.classList.toggle('thoughts-open', entry.open);
            },
            renderThoughtEntry(entry) {
                if (!entry) return;
                if (entry.visibleEl) entry.visibleEl.innerText = entry.visible || '...';
                if (entry.trackEl) entry.trackEl.innerText = this.buildThoughtLine(entry);
            },
            buildThoughtLine(entry) {
                let labels = {
                    battlefield: 'status',
                    opinion: 'reply',
                    doctrine: 'doctrine',
                    action: 'move',
                    summary: 'memory',
                    error: 'error'
                };
                let parts = ['battlefield', 'doctrine', 'action', 'summary', 'error']
                    .map(phase => entry.phases[phase] ? `${labels[phase]}: ${entry.phases[phase]}` : '')
                    .filter(Boolean);
                if (parts.length === 0) return 'reading map...';
                return parts.join('    //    ');
            },
            sanitizeModelLine(text) {
                let raw = String(text || '').trim();
                if (!raw) return '';
                if (!this.looksLikeModelJsonLeak(raw)) return raw;
                let recovered = recoverGemmaTurnFromText(raw);
                if (recovered && recovered.say) return recovered.say;
                return 'I am reworking that move.';
            },
            looksLikeModelJsonLeak(text) {
                let sample = String(text || '').trim();
                if (!sample) return false;
                if (/^[\[{]/.test(sample)) return true;
                return /"say"\s*:|"action"\s*:|"memoryPatch"\s*:|"pressure"\s*:/.test(sample);
            },
            normalizeRawModelLine(text, maxLen = 1400) {
                let raw = String(text || '').replace(/\u0000/g, '').trim();
                if (!raw) return '';
                if (raw.length <= maxLen) return raw;
                return `${raw.slice(0, maxLen)} ...[truncated ${raw.length - maxLen} chars]`;
            },
            normalizeThoughtLine(text) {
                return String(text || '').replace(/\u0000/g, '').replace(/\s+/g, ' ').trim();
            },
            normalizeLine(text, maxLen = 220) {
                return String(text || '').replace(/\s+/g, ' ').trim().slice(0, maxLen);
            },
            writeLatest(host, text, className, lane) {
                if (!host || !text) return;
                host.classList.remove('hidden');
                let timeoutKey = lane === 'player' ? 'playerWriteTimeout' : (lane === 'system' ? 'systemWriteTimeout' : 'aiWriteTimeout');
                clearTimeout(this[timeoutKey]);

                let render = () => {
                    host.innerHTML = '';
                    let row = document.createElement('div');
                    row.className = `${className} is-writing`;
                    row.innerText = text;
                    host.appendChild(row);
                };

                let current = host.firstElementChild;
                if (current) {
                    current.classList.remove('is-writing');
                    current.classList.add('is-erasing');
                    this[timeoutKey] = setTimeout(render, 190);
                } else {
                    render();
                }
            },
            addSystem(text) {
                let host = this.els['director-tool-log'];
                if (!host || !text) return;
                this.writeLatest(host, this.normalizeLine(text, 96), 'director-tool-msg', 'system');
            },
            showAction(toolName, reason) {
                let name = String(toolName || '').toLowerCase();
                let label = 'move';
                if (name.includes('spawn') || name.includes('unit')) label = 'unit';
                else if (name.includes('upgrade') || name.includes('econ') || name.includes('dmg') || name.includes('hp')) label = 'upgrade';
                else if (name.includes('turret') || name.includes('slot')) label = 'fort';
                else if (name.includes('evolve') || name.includes('age')) label = 'age';
                else if (name.includes('special')) label = 'special';

                let detail = String(reason || 'new plan').replace(/\s+/g, ' ').trim().slice(0, 64);
                this.addSystem(`${label}: ${detail}`);
            },
            renderMemory() {
                let host = this.els['director-memory'];
                if (!host) return;
                host.innerHTML = '';
                let tags = [];
                if (GemmaMemory.data && GemmaMemory.data.doctrine) tags.push(`doctrine: ${GemmaMemory.data.doctrine}`);
                tags = tags.concat(DirectorMemory.tags());
                tags.forEach(tag => {
                    let chip = document.createElement('span');
                    chip.className = 'memory-chip';
                    chip.innerText = tag;
                    host.appendChild(chip);
                });
            },
            handlePlayerText(raw) {
                let message = String(raw || '').trim();
                if (!message) return;
                let playerLineId = this.add('player', message);
                NativeGemma.queueRecentUserComment(playerLineId, message);
                GemmaMemory.recordPlayer(message);

                let text = message.toLowerCase();
                let replies = [];

                if (/\bforget\b|clear memory|reset memory/.test(text)) {
                    DirectorMemory.clear();
                    GemmaMemory.clearAll();
                    AIDirector.restraintUntil = 0;
                    replies.push('Fresh page. I dropped the saved pacts and notes.');
                }

                let rememberMatch = message.match(/\bremember\s+(.+)/i);
                if (rememberMatch && rememberMatch[1]) {
                    DirectorMemory.addNote(rememberMatch[1]);
                    replies.push('Noted for later matches.');
                }

                if (/no\s+special|don'?t use special|no\s+ult/.test(text)) {
                    DirectorMemory.setAgreement('noSpecials', true);
                    replies.push('Agreed: no enemy specials.');
                } else if (/specials?\s+(ok|allowed|on)|use specials?/.test(text)) {
                    DirectorMemory.setAgreement('noSpecials', false);
                    replies.push('Specials are back on the page.');
                }

                if (/no\s+turret|don'?t build turret/.test(text)) {
                    DirectorMemory.setAgreement('noTurrets', true);
                    replies.push('Agreed: I will not buy enemy turrets.');
                } else if (/turrets?\s+(ok|allowed|on)|build turrets?/.test(text)) {
                    DirectorMemory.setAgreement('noTurrets', false);
                    replies.push('Turrets are allowed again.');
                }

                if (/melee only|no ranged|only melee/.test(text)) {
                    DirectorMemory.setAgreement('meleeOnly', true);
                    replies.push('Agreed: enemy unit buys avoid ranged units.');
                } else if (/all units|ranged ok|anything goes|use ranged/.test(text)) {
                    DirectorMemory.setAgreement('meleeOnly', false);
                    replies.push('All enemy unit types are available again.');
                }

                if (/go easy|take it easy|mercy|soft/.test(text)) {
                    DirectorMemory.setPressure('mercy');
                    replies.push('I will spend slower unless your army reaches my base.');
                } else if (/rush|aggressive|pressure me|try hard|harder/.test(text)) {
                    DirectorMemory.setPressure('rush');
                    AIDirector.restraintUntil = 0;
                    replies.push('Pressure plan accepted. I will stop hoarding and push.');
                } else if (/balanced|fair|normal plan/.test(text)) {
                    DirectorMemory.setPressure('balanced');
                    replies.push('Balanced plan restored.');
                }

                if (/truce|pause attacks|give me/.test(text)) {
                    let secondsMatch = text.match(/(\d{1,2})\s*(sec|second)/);
                    let seconds = secondsMatch ? Math.max(10, Math.min(60, parseInt(secondsMatch[1], 10))) : 30;
                    AIDirector.setRestraint(seconds);
                    replies.push(`Truce for ${seconds}s unless you hit my doorstep.`);
                }

                this.renderMemory();
                if (replies.length) {
                    let localNote = replies.join(' ');
                    GemmaMemory.recordSystem(`Local pact update: ${localNote}`);
                    this.addSystem(localNote);
                }
                let requested = NativeGemma.requestTurn('player_chat', message, { userLineId: playerLineId });
                if (!requested && (!NativeGemma.available || !['ready', 'installed', 'loading', 'downloading'].includes(NativeGemma.status.state || ''))) {
                    setTimeout(() => this.add('ai', replies.join(' ') || 'I heard you. I will keep reading the lane and adapt.'), 400);
                }
            }
        };

        function submitDirectorChat(event) {
            event.preventDefault();
            let input = DirectorPanel.els['director-input'];
            if (!input) return;
            DirectorPanel.handlePlayerText(input.value);
            input.value = '';
        }

        function toggleDirectorPanel() {
            let hud = DirectorPanel.els['ai-hud'];
            if (hud) hud.classList.toggle('hidden');
        }

        function togglePause(forceState) {
            if (!gameState || !gameState.running) return;
            gameState.paused = typeof forceState === 'boolean' ? forceState : !gameState.paused;
            let overlay = document.getElementById('pause-overlay');
            let btn = DirectorPanel.els['btn-pause'];
            if (overlay) overlay.classList.toggle('hidden', !gameState.paused);
            if (btn) btn.innerText = gameState.paused ? 'Resume' : 'Pause';
            if (!gameState.paused) lastTime = performance.now();
        }

        // --- LOCAL TOOL-USING OPPONENT DIRECTOR ---
        const AIDirector = {
            actionTimer: 1,
            chatTimer: 4,
            gemmaTimer: 14,
            restraintUntil: 0,
            lastPlayerAge: 0,
            lastEnemyAge: 0,
            lastActionNoticeAt: -99,
            start(diffKey) {
                this.actionTimer = 0.8;
                this.chatTimer = 3.5;
                this.gemmaTimer = 12;
                this.restraintUntil = 0;
                this.lastPlayerAge = 0;
                this.lastEnemyAge = 0;
                this.lastActionNoticeAt = -99;
                this.lowHpWarned = false;
                DirectorPanel.start(diffKey);
            },
            tick(dt) {
                let ai = gameState.enemy;
                if (!ai || ai.drawProgress < 1) return;

                this.actionTimer -= dt;
                this.chatTimer -= dt;
                this.gemmaTimer -= dt;
                let snapshot = this.snapshot();
                this.maybeMilestoneChat(snapshot);

                if (this.actionTimer <= 0) {
                    this.actionTimer = this.nextThinkDelay();
                    this.chooseAction(snapshot);
                }
                if (this.chatTimer <= 0) {
                    this.chatTimer = 8 + Math.random() * 7;
                    this.comment(snapshot);
                }
                if (this.gemmaTimer <= 0) {
                    this.gemmaTimer = 22 + Math.random() * 10;
                    NativeGemma.requestTurn('periodic_director_turn');
                }
            },
            setRestraint(seconds) {
                this.restraintUntil = Math.max(this.restraintUntil, globalTime + seconds);
            },
            doctrine() {
                return (GemmaMemory.data && GemmaMemory.data.doctrine) || 'balanced';
            },
            effectiveDoctrine(snapshot = null) {
                let pressure = (DirectorMemory.data.agreements || {}).pressure || 'balanced';
                let doctrine = this.doctrine();
                if (pressure === 'mercy' && (!snapshot || (snapshot.playerHpRatio < 0.55 && snapshot.threatCount < 3))) {
                    return doctrine === 'turtle' || doctrine === 'stall' || doctrine === 'tech' ? doctrine : 'stall';
                }
                if (pressure === 'rush' && doctrine === 'balanced') return 'rush';
                return doctrine;
            },
            nextThinkDelay() {
                let pressure = DirectorMemory.data.agreements.pressure;
                let pressureFactor = pressure === 'rush' ? 0.7 : (pressure === 'mercy' ? 1.7 : 1);
                let doctrine = this.effectiveDoctrine();
                let doctrineFactor = {
                    allin: 0.58,
                    rush: 0.72,
                    counter: 0.86,
                    turtle: 0.95,
                    balanced: 1,
                    tech: 1.12,
                    bait: 1.22,
                    stall: 1.35
                }[doctrine] || 1;
                let difficultyFactor = 1 - (currentConfig.aiAggression * 0.12);
                return Math.max(0.25, (currentConfig.thinkRate * pressureFactor * doctrineFactor * difficultyFactor) + Math.random() * 0.45);
            },
            snapshot() {
                let ai = gameState.enemy;
                let player = gameState.player;
                let playerUnits = 0, enemyUnits = 0, threatCount = 0;
                let heavyThreat = false, closestThreatDist = Infinity;
                let playerFront = BASE_WIDTH, enemyFront = CANVAS_WIDTH - BASE_WIDTH;

                for (let i = 0; i < gameState.units.pool.length; i++) {
                    let u = gameState.units.pool[i];
                    if (!u.active || u.hp <= 0 || u.drawProgress < 0.5) continue;
                    if (u.team === 1) {
                        playerUnits++;
                        playerFront = Math.max(playerFront, u.x);
                        let dist = (CANVAS_WIDTH - BASE_WIDTH) - u.x;
                        if (dist < closestThreatDist) closestThreatDist = dist;
                        if (dist < 620) threatCount++;
                        if (dist < 620 && u.type === 'heavy') heavyThreat = true;
                    } else {
                        enemyUnits++;
                        enemyFront = Math.min(enemyFront, u.x);
                    }
                }

                return {
                    playerUnits, enemyUnits, threatCount, heavyThreat,
                    closestThreatDist: Number.isFinite(closestThreatDist) ? closestThreatDist : 9999,
                    lanePressure: playerFront - (CANVAS_WIDTH - enemyFront),
                    playerFrontX: Math.round(playerFront),
                    enemyFrontX: Math.round(enemyFront),
                    frontGap: Math.max(0, Math.round(enemyFront - playerFront)),
                    playerHpRatio: player.hp / player.maxHp,
                    enemyHpRatio: ai.hp / ai.maxHp,
                    enemyGold: ai.gold,
                    pressure: DirectorMemory.data.agreements.pressure,
                    doctrine: this.doctrine(),
                    restrained: globalTime < this.restraintUntil
                };
            },
            maybeMilestoneChat(snapshot) {
                let gemmaOwnsChat = NativeGemma.ownsVisibleChat();
                if (gameState.player.age !== this.lastPlayerAge) {
                    this.lastPlayerAge = gameState.player.age;
                    let line = `You reached ${AGES[gameState.player.age].name}. I am updating the counter-plan.`;
                    if (!gemmaOwnsChat) DirectorPanel.add('ai', line);
                    GemmaMemory.recordSystem(line);
                }
                if (gameState.enemy.age !== this.lastEnemyAge) {
                    this.lastEnemyAge = gameState.enemy.age;
                    DirectorPanel.showAction('evolve_enemy', AGES[gameState.enemy.age].name);
                    GemmaMemory.recordSystem(`Enemy evolved to ${AGES[gameState.enemy.age].name}.`);
                }
                if (snapshot.enemyHpRatio < 0.25 && !this.lowHpWarned) {
                    this.lowHpWarned = true;
                    let line = 'My base is down to the margin. Expect defensive spending.';
                    if (!gemmaOwnsChat) DirectorPanel.add('ai', line);
                    GemmaMemory.recordSystem(line);
                }
            },
            comment(snapshot) {
                if (NativeGemma.ownsVisibleChat()) return;
                let a = DirectorMemory.data.agreements;
                if (snapshot.restrained) {
                    DirectorPanel.add('ai', 'Truce timer is still active. I am using the quiet turns for upgrades.');
                } else if (a.noSpecials || a.noTurrets || a.meleeOnly) {
                    DirectorPanel.add('ai', `Pacts still active: ${DirectorMemory.tags().join(', ')}.`);
                } else if (snapshot.threatCount >= 4) {
                    DirectorPanel.add('ai', 'Your line is stacked near my base. I am spending defensively.');
                } else if (snapshot.pressure === 'rush') {
                    DirectorPanel.add('ai', 'You asked for pressure, so I am converting gold into bodies.');
                } else if (snapshot.pressure === 'mercy') {
                    DirectorPanel.add('ai', 'Mercy plan is on. I will not flood the lane while you are behind.');
                } else {
                    DirectorPanel.add('ai', 'I am watching age timing, gold float, and front-line distance.');
                }
            },
            chooseAction(snapshot) {
                if (this.tryEvolve()) return;
                let doctrine = this.effectiveDoctrine(snapshot);

                if (snapshot.restrained && snapshot.threatCount < 2) {
                    if (this.tryUpgrade('econ', 'truce economy')) return;
                    if (this.tryUpgrade('hp', 'truce fortify')) return;
                    return;
                }

                if ((snapshot.threatCount >= 5 || snapshot.heavyThreat) && this.trySpecial('clear the pressure wave')) return;
                if (snapshot.threatCount > 0 && this.tryBuildTurret('base defense')) return;
                if (snapshot.enemyHpRatio < 0.45 && this.tryUpgrade('hp', 'stabilize base')) return;

                if (this.tryDoctrineAction(doctrine, snapshot)) return;

                let ai = gameState.enemy;
                let ecoTarget = 2 + Math.floor(currentConfig.aiAggression * 4) + (snapshot.pressure === 'rush' ? 1 : 0);
                if (ai.upgrades.econ < ecoTarget && snapshot.threatCount < 4 && this.tryUpgrade('econ', 'long game income')) return;

                if (snapshot.pressure === 'mercy' && snapshot.playerHpRatio < 0.45 && snapshot.threatCount < 3) {
                    if (this.tryUpgrade('dmg', 'holding attacks back')) return;
                    return;
                }

                if (snapshot.pressure === 'rush') {
                    if (this.trySpawnUnit(2, 'rush heavy')) return;
                    if (this.trySpawnUnit(1, 'rush support')) return;
                    if (this.trySpawnUnit(0, 'rush filler')) return;
                }

                if (snapshot.threatCount >= 3) {
                    if (this.trySpawnUnit(1, 'answer nearby units')) return;
                    if (this.trySpawnUnit(0, 'stall the lane')) return;
                }

                let ageData = AGES[ai.age];
                if (ai.gold >= ageData.units[2].cost * (1.4 - currentConfig.aiAggression * 0.4) && this.trySpawnUnit(2, 'timed power unit')) return;
                if (snapshot.enemyUnits < Math.max(2, Math.floor(snapshot.playerUnits * 0.9)) && this.trySpawnUnit(1, 'match your army count')) return;
                if ((currentConfig.aiAggression > 0.45 || ai.gold > ageData.units[0].cost * 5) && this.trySpawnUnit(0, 'keep lane presence')) return;
            },
            tryDoctrineAction(doctrine, snapshot) {
                let ai = gameState.enemy;
                let ageData = AGES[ai.age];
                if (!ageData) return false;

                if (doctrine === 'tech') {
                    let ecoTarget = Math.min(10, 4 + Math.floor(currentConfig.aiAggression * 4));
                    if (ai.upgrades.econ < ecoTarget && snapshot.threatCount < 3 && this.tryUpgrade('econ', 'doctrine tech economy')) return true;
                    if (snapshot.threatCount < 2 && this.tryUpgrade('dmg', 'doctrine tech damage')) return true;
                    if (snapshot.enemyUnits < Math.max(1, Math.floor(snapshot.playerUnits * 0.65)) && this.trySpawnUnit(1, 'tech screen')) return true;
                    return false;
                }

                if (doctrine === 'turtle') {
                    if (this.tryBuildTurret('doctrine turtle fort')) return true;
                    if (this.tryUpgrade('hp', 'doctrine turtle base hp')) return true;
                    if (snapshot.enemyUnits < snapshot.playerUnits + 1 && this.trySpawnUnit(1, 'turtle ranged cover')) return true;
                    if (this.trySpawnUnit(0, 'turtle stall body')) return true;
                    return false;
                }

                if (doctrine === 'counter') {
                    if (snapshot.heavyThreat && this.trySpecial('counter heavy threat')) return true;
                    if (snapshot.threatCount >= 2 && this.trySpawnUnit(1, 'counter ranged pressure')) return true;
                    if (snapshot.playerUnits > snapshot.enemyUnits && this.trySpawnUnit(2, 'counter power unit')) return true;
                    if (this.tryUpgrade('dmg', 'counter damage timing')) return true;
                    return false;
                }

                if (doctrine === 'bait') {
                    if (snapshot.threatCount >= 4 && this.trySpecial('bait punish wave')) return true;
                    if (snapshot.threatCount >= 2 && this.tryBuildTurret('bait punish near base')) return true;
                    if (snapshot.threatCount === 0 && this.tryUpgrade('econ', 'bait quiet economy')) return true;
                    if (snapshot.enemyUnits < 2 && this.trySpawnUnit(0, 'bait light screen')) return true;
                    return false;
                }

                if (doctrine === 'stall') {
                    if (this.tryBuildTurret('stall fortify')) return true;
                    if (this.tryUpgrade('hp', 'stall survival')) return true;
                    if (snapshot.threatCount < 3 && this.tryUpgrade('econ', 'stall income')) return true;
                    if (this.trySpawnUnit(0, 'stall cheap blocker')) return true;
                    return false;
                }

                if (doctrine === 'allin') {
                    if (snapshot.threatCount < 5 && this.trySpawnUnit(2, 'allin heavy push')) return true;
                    if (this.trySpawnUnit(1, 'allin support')) return true;
                    if (this.tryUpgrade('dmg', 'allin damage')) return true;
                    if (this.trySpawnUnit(0, 'allin filler')) return true;
                    return false;
                }

                if (doctrine === 'rush') {
                    if (this.trySpawnUnit(1, 'doctrine rush support')) return true;
                    if (this.trySpawnUnit(0, 'doctrine rush filler')) return true;
                    if (snapshot.threatCount < 3 && this.trySpawnUnit(2, 'doctrine rush heavy')) return true;
                    return false;
                }

                return false;
            },
            tryEvolve() {
                let ai = gameState.enemy;
                if (ai.age >= AGES.length - 1 || ai.xp < AGES[ai.age].evolveXP) return false;
                ai.age++;
                ai.drawProgress = 0;
                let newMax = AGES[ai.age].baseHp * currentConfig.baseHpMult * getStatMult(ai, 'hp');
                ai.hp += (newMax - ai.maxHp);
                ai.maxHp = newMax;
                ai.turrets = [null, null, null, null];
                ai.turretTimers = [0, 0, 0, 0];
                this.lastEnemyAge = ai.age;
                this.reportTool('evolve_enemy', AGES[ai.age].name, true);
                return true;
            },
            tryUpgrade(type, reason) {
                let ai = gameState.enemy;
                let lvl = ai.upgrades[type];
                if (lvl >= 10) return false;
                let cost = UPGRADE_COSTS[lvl];
                if (ai.gold < cost) return false;
                ai.gold -= cost;
                ai.upgrades[type]++;
                if (type === 'hp') {
                    let newMax = AGES[ai.age].baseHp * currentConfig.baseHpMult * getStatMult(ai, 'hp');
                    ai.hp += (newMax - ai.maxHp);
                    ai.maxHp = newMax;
                }
                this.reportTool(`buy_upgrade:${type}`, reason);
                return true;
            },
            tryBuildTurret(reason) {
                let a = DirectorMemory.data.agreements;
                if (a.noTurrets) return false;
                let ai = gameState.enemy;
                let emptySlot = ai.turrets.findIndex((t, idx) => t === null && idx < ai.unlockedSlots);
                if (emptySlot === -1) {
                    let slotCost = ai.unlockedSlots * 500;
                    if (ai.unlockedSlots < 4 && ai.gold >= slotCost) {
                        ai.gold -= slotCost;
                        ai.unlockedSlots++;
                        this.reportTool('buy_turret_slot', reason);
                        return true;
                    }
                    return false;
                }

                let ageData = AGES[ai.age];
                let typeIdx = 0;
                if (ai.gold >= ageData.turrets[2].cost && currentConfig.aiAggression > 0.45) typeIdx = 2;
                else if (ai.gold >= ageData.turrets[1].cost) typeIdx = 1;
                let cost = ageData.turrets[typeIdx].cost;
                if (ai.gold < cost) return false;
                ai.gold -= cost;
                ai.turrets[emptySlot] = typeIdx;
                ai.turretProgress[emptySlot] = 0;
                this.reportTool(`build_turret:${ageData.turrets[typeIdx].name}`, reason);
                return true;
            },
            trySpecial(reason) {
                let a = DirectorMemory.data.agreements;
                let ai = gameState.enemy;
                if (a.noSpecials || ai.specialTimer > 0 || gameState.specialActive) return false;
                triggerSpecial(-1);
                ai.specialTimer = AGES[ai.age].special.cooldown;
                this.reportTool(`use_special:${AGES[ai.age].special.name}`, reason, true);
                return true;
            },
            trySpawnUnit(typeIdx, reason) {
                let a = DirectorMemory.data.agreements;
                let ai = gameState.enemy;
                let data = AGES[ai.age].units[typeIdx];
                if (!data) return false;
                if (a.meleeOnly && data.type === 'ranged') return false;
                if (globalTime < this.restraintUntil && reason.indexOf('answer') === -1 && reason.indexOf('stall') === -1) return false;
                if (ai.gold < data.cost) return false;
                ai.gold -= data.cost;
                spawnUnit(-1, ai.age, typeIdx);
                this.reportTool(`spawn_unit:${data.name}`, reason);
                return true;
            },
            reportTool(name, reason, force = false) {
                if (force || globalTime - this.lastActionNoticeAt > 1.8) {
                    DirectorPanel.showAction(name, reason);
                    if (force || /special|evolve|age/i.test(name)) {
                        GemmaMemory.recordSystem(`Fallback action ${name}: ${reason}`);
                    }
                    this.lastActionNoticeAt = globalTime;
                }
            }
        };

        // --- OBJECT POOL ARCHITECTURE (ZERO-GC GAMEPLAY) ---
        class ObjectPool {
            constructor(maxSize, factory) {
                this.factory = factory;
                this.pool = new Array(maxSize);
                for (let i = 0; i < maxSize; i++) { this.pool[i] = factory(); this.pool[i].active = false; }
            }
            spawn(props) {
                for (let i = 0; i < this.pool.length; i++) {
                    if (!this.pool[i].active) {
                        let obj = this.pool[i];
                        for (let k in props) obj[k] = props[k];
                        obj.active = true; return obj;
                    }
                }
                // Expand dynamically if impossible limits hit.
                let obj = this.factory();
                for (let k in props) obj[k] = props[k];
                obj.active = true; this.pool.push(obj);
                return obj;
            }
        }

        // --- GAME ENGINE STATE ---
        let gameState = {};
        let globalIdSequence = 0;
        let lastTime = 0;
        let globalTime = 0;
        let currentTab = 'units';

        // Pre-allocate large physics arrays to avoid GC
        let physicsAllies = new Array(500); let physicsAlliesCount = 0;
        let physicsEnemies = new Array(500); let physicsEnemiesCount = 0;

        // --- SQUIGGLEVISION MAGIC ---
        function jitterVal(x, y, amp) {
            let frame = Math.floor(globalTime * 8) % 3;
            let seed = x * 12.9898 + y * 78.233 + frame * 13.131;
            let h = Math.sin(seed) * 43758.5453;
            return ((h - Math.floor(h)) - 0.5) * amp;
        }

        function setSketchStyle(color, thickness = 2) {
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = thickness;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }

        function applyDash(progress, pathLen) {
            if (progress >= 1.0) { ctx.setLineDash([]); return; }
            let dash = pathLen;
            ctx.setLineDash([dash, dash]);
            ctx.lineDashOffset = dash * (1.0 - progress);
        }

        function drawRoughLine(x1, y1, x2, y2, passes = 2, jAmp = 3, progress = 1.0) {
            ctx.beginPath();
            let len = Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
            for (let i = 0; i < passes; i++) {
                let ox1 = x1 + jitterVal(x1, y1 + i, jAmp);
                let oy1 = y1 + jitterVal(x1 + i, y1, jAmp);
                let ox2 = x2 + jitterVal(x2, y2 + i, jAmp);
                let oy2 = y2 + jitterVal(x2 + i, y2, jAmp);
                ctx.moveTo(ox1, oy1);
                let mx = (x1 + x2) / 2 + jitterVal((x1 + x2) / 2, (y1 + y2) / 2 + i, jAmp * 2);
                let my = (y1 + y2) / 2 + jitterVal((x1 + x2) / 2 + i, (y1 + y2) / 2, jAmp * 2);
                ctx.quadraticCurveTo(mx, my, ox2, oy2);
            }
            applyDash(progress, len);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawRoughCircle(cx, cy, r, passes = 2, jAmp = 3, progress = 1.0) {
            ctx.beginPath();
            let len = 2 * Math.PI * r;
            for (let i = 0; i < passes; i++) {
                let jc_x = cx + jitterVal(cx, cy + i, jAmp);
                let jc_y = cy + jitterVal(cx + i, cy, jAmp);
                let jr = r + jitterVal(r, i, jAmp);
                ctx.arc(jc_x, jc_y, jr, 0, Math.PI * 2);
            }
            applyDash(progress, len * passes);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function fillScribble(x, y, w, h, color, density = 5, progress = 1.0) {
            if (progress <= 0) return;
            ctx.strokeStyle = color;
            ctx.lineWidth = 1;
            ctx.beginPath();
            let totalLines = Math.floor(w / density);
            let linesToDraw = Math.max(1, Math.floor(totalLines * progress));
            for (let i = 0; i <= linesToDraw; i++) {
                let cx = x + (i * density);
                let j1 = jitterVal(cx, y, 5);
                let j2 = jitterVal(cx, y + h, 5);
                ctx.moveTo(cx + j1, y + Math.abs(j1));
                ctx.lineTo(cx + j2, y + h - Math.abs(j2));
            }
            ctx.stroke();
        }

        // --- BOOTSTRAP INITIALIZATION ---
        window.onload = () => {
            UIManager.init();
            TooltipManager.init();
            StorageManager.init();
            DirectorMemory.init();
            GemmaMemory.init();
            DirectorPanel.init();
            NativeGemma.init();

            // Async generation of heavy procedural assets
            WatercolorEngine.generateAll().then(() => {
                document.getElementById('preloader').classList.add('hidden');
                document.getElementById('game-container').classList.remove('hidden');
            });
        };

        document.addEventListener('visibilitychange', () => {
            if (document.hidden && gameState && gameState.running && !gameState.paused) {
                togglePause(true);
            }
        });

        if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
            navigator.serviceWorker.register('./service-worker.js').catch(() => { });
        }

        function initGame(diffKey) {
            if (gameState && gameState.running) return;
            document.getElementById('start-screen').classList.add('fade-out');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('pause-overlay').classList.add('hidden');
            document.getElementById('ui-layer').classList.remove('hidden');

            currentDifficulty = diffKey;
            currentConfig = DIFFICULTY_SETTINGS[diffKey] || DIFFICULTY_SETTINGS['normal'];

            let badge = document.getElementById('diff-badge');
            badge.innerText = currentConfig.name;
            badge.style.backgroundColor = currentConfig.color;

            gameState = {
                running: true,
                paused: false,
                worldProgress: 0,
                screenShake: 0,
                ageTransition: 0,
                player: { hp: 500, maxHp: 500, age: 0, gold: 175, xp: 0, turrets: [null, null, null, null], turretProgress: [1, 1, 1, 1], unlockedSlots: 1, specialTimer: 0, drawProgress: 1, upgrades: { dmg: 0, hp: 0, econ: 0 } },
                enemy: { hp: 500 * currentConfig.baseHpMult, maxHp: 500 * currentConfig.baseHpMult, age: 0, gold: currentConfig.baseGold, xp: 0, turrets: [null, null, null, null], turretProgress: [1, 1, 1, 1], unlockedSlots: 1, aiTimer: 2, specialTimer: 0, drawProgress: 1, upgrades: { dmg: 0, hp: 0, econ: 0 } },
                specialActive: null,

                // Vast Object Pools to handle "Impossible" stress
                units: new ObjectPool(600, () => ({})),
                projectiles: new ObjectPool(1000, () => ({ trailX: new Float32Array(10), trailY: new Float32Array(10) })),
                particles: new ObjectPool(2500, () => ({})),
                visualFx: new ObjectPool(50, () => ({})),
                floatingTexts: new ObjectPool(200, () => ({}))
            };

            applyTheme(0);
            accumulator = 0;
            globalTime = 0;
            globalIdSequence = 0;
            lastTime = performance.now();
            switchTab('units');
            AIDirector.start(diffKey);
            requestAnimationFrame(gameLoop);
        }

        function applyTheme(ageIndex) {
            let theme = AGES[ageIndex].theme;
            document.documentElement.style.setProperty('--background', theme.bg);
            document.documentElement.style.setProperty('--foreground', theme.fg);
            document.documentElement.style.setProperty('--pencil', theme.fg);
            document.documentElement.style.setProperty('--accent', theme.accent);

            COLORS.pencil = `hsl(${theme.fg})`;
            COLORS.pencilLight = `hsl(${theme.fg} / 0.5)`;
            COLORS.accent = `hsl(${theme.accent})`;
        }

        // --- CORE FIXED-TIMESTEP LOOP ---
        function gameLoop(timestamp) {
            if (!gameState.running) return;
            if (gameState.paused) {
                lastTime = timestamp;
                draw();
                requestAnimationFrame(gameLoop);
                return;
            }

            // Safety cap for massive lag spikes
            let frameTime = Math.min((timestamp - lastTime) / 1000, 0.25);
            lastTime = timestamp;
            accumulator += frameTime;

            while (accumulator >= FIXED_DT) {
                update(FIXED_DT);
                globalTime += FIXED_DT;
                accumulator -= FIXED_DT;
            }

            draw();
            requestAnimationFrame(gameLoop);
        }

        function getStatMult(state, type) {
            let isEnemy = state === gameState.enemy;
            let base = 1.0;

            if (type === 'dmg') base = 1.0 + (state.upgrades.dmg * 0.15);
            if (type === 'hp') base = 1.0 + (state.upgrades.hp * 0.25);
            if (type === 'econ') base = 1.0 + (state.upgrades.econ * 0.20);

            if (isEnemy) {
                if (type === 'dmg') return base * currentConfig.dmgMult;
                if (type === 'hp') return base * currentConfig.hpMult;
                if (type === 'econ') return base * currentConfig.econMult;
            }
            return base;
        }

        function insertionSortQueueDesc(arr, count) {
            for (let i = 1; i < count; i++) {
                let key = arr[i]; let j = i - 1;
                while (j >= 0 && arr[j].x < key.x) { arr[j + 1] = arr[j]; j--; }
                arr[j + 1] = key;
            }
        }

        function insertionSortQueueAsc(arr, count) {
            for (let i = 1; i < count; i++) {
                let key = arr[i]; let j = i - 1;
                while (j >= 0 && arr[j].x > key.x) { arr[j + 1] = arr[j]; j--; }
                arr[j + 1] = key;
            }
        }

        // --- UPDATE LOGIC ---
        function update(dt) {
            if (gameState.worldProgress < 1.0) {
                gameState.worldProgress += dt * 0.75;
                if (gameState.worldProgress > 1.0) gameState.worldProgress = 1.0;
                else return;
            }

            if (gameState.ageTransition > 0) gameState.ageTransition -= dt;

            gameState.player.gold += (5 + gameState.player.age * 5) * getStatMult(gameState.player, 'econ') * dt;
            gameState.enemy.gold += (5 + gameState.enemy.age * 5) * getStatMult(gameState.enemy, 'econ') * dt;

            if (gameState.player.specialTimer > 0) {
                gameState.player.specialTimer -= dt;
                if (gameState.player.specialTimer <= 0 && currentTab === 'units') {
                    document.getElementById('btn-special').classList.add('pulse-alert');
                    setTimeout(() => document.getElementById('btn-special').classList.remove('pulse-alert'), 3000);
                }
            }
            if (gameState.enemy.specialTimer > 0) gameState.enemy.specialTimer -= dt;
            if (gameState.screenShake > 0) gameState.screenShake -= dt;

            if (gameState.player.drawProgress < 1) gameState.player.drawProgress += dt * 0.3;
            if (gameState.enemy.drawProgress < 1) gameState.enemy.drawProgress += dt * 0.3;

            for (let i = 0; i < 4; i++) {
                if (gameState.player.turretProgress[i] < 1) gameState.player.turretProgress[i] += dt * 0.5;
                if (gameState.enemy.turretProgress[i] < 1) gameState.enemy.turretProgress[i] += dt * 0.5;
            }

            handleAdvancedAI(dt);
            handleSpecialAttacks(dt);

            physicsAlliesCount = 0;
            physicsEnemiesCount = 0;

            for (let i = 0; i < gameState.units.pool.length; i++) {
                let u = gameState.units.pool[i];
                if (!u.active) continue;

                if (u.team === 1) physicsAllies[physicsAlliesCount++] = u;
                else physicsEnemies[physicsEnemiesCount++] = u;

                if (u.hp <= 0) {
                    if (u.team === -1) {
                        gameState.player.gold += u.killGold;
                        addXP(1, u.killXp);
                        spawnCanvasText(`+${u.killGold}g`, u.x, u.y - u.size - 20, COLORS.gold);
                    } else {
                        gameState.enemy.gold += u.killGold * currentConfig.econMult;
                        addXP(-1, u.killXp);
                    }
                    spawnParticles(u.x, u.y - u.size / 2, COLORS.destructive, 10, 'splatter');
                    spawnParticles(u.x, u.y - u.size, COLORS.pencilLight, 1, 'ghost');

                    u.active = false;
                    if (u.team === 1) physicsAlliesCount--; else physicsEnemiesCount--;
                }
            }

            insertionSortQueueDesc(physicsAllies, physicsAlliesCount);
            insertionSortQueueAsc(physicsEnemies, physicsEnemiesCount);

            resolveQueueLogic(physicsAllies, physicsAlliesCount, physicsEnemies, physicsEnemiesCount, 1, CANVAS_WIDTH - BASE_WIDTH, dt);
            resolveQueueLogic(physicsEnemies, physicsEnemiesCount, physicsAllies, physicsAlliesCount, -1, BASE_WIDTH, dt);

            updateTurrets(1, physicsEnemies, physicsEnemiesCount, dt);
            updateTurrets(-1, physicsAllies, physicsAlliesCount, dt);

            updateProjectilesAndFX(dt);
            updateUI();
            checkWinLoss();
        }

        function resolveQueueLogic(allies, aCount, enemies, eCount, dir, enemyBaseX, dt) {
            let queueLimit = dir === 1 ? CANVAS_WIDTH : 0;

            for (let i = 0; i < aCount; i++) {
                let u = allies[i];

                if (u.drawProgress < 1.0) {
                    u.drawProgress += dt * 2.0;
                    if (Math.random() < 0.4) spawnParticles(u.x + (Math.random() - 0.5) * u.size, u.y - Math.random() * u.size, COLORS.pencil, 1, 'graphite');
                    queueLimit = u.x - dir * (u.size / 2 + 5);
                    continue;
                }

                if (u.attackCooldown > 0) u.attackCooldown -= dt;
                if (u.animTimer > 0) u.animTimer -= dt;

                let target = null;
                let minDist = Infinity;
                for (let j = 0; j < eCount; j++) {
                    let e = enemies[j];
                    if (e.drawProgress < 0.8 || e.hp <= 0) continue;
                    let dist = (e.x - u.x) * dir - (u.size / 2 + e.size / 2);
                    if (dist >= 0 && dist < minDist) { minDist = dist; target = e; }
                }

                let baseDist = (enemyBaseX - u.x) * dir - u.size / 2;
                let targetIsBase = false;
                if (baseDist < minDist && baseDist >= 0) { minDist = baseDist; targetIsBase = true; }

                if (minDist <= u.range) {
                    u.isAttacking = true;
                    u.moving = false;
                    queueLimit = u.x - dir * (u.size / 2 + 5);

                    if (u.attackCooldown <= 0) {
                        u.attackCooldown = u.attackSpeed;
                        u.animTimer = 0.3;
                        let actualDmg = u.dmg * getStatMult(u.team === 1 ? gameState.player : gameState.enemy, 'dmg');
                        let tX = targetIsBase ? enemyBaseX : target.x;
                        let tY = targetIsBase ? GROUND_Y - 40 : target.y - target.size / 2;

                        if (u.projType) {
                            fireProjectile(u.x, u.y - u.size * 0.7, tX, tY, u.projType, u.projSpeed, actualDmg, u.team, target);
                        } else {
                            spawnParticles(u.x + dir * u.size / 2, u.y - u.size / 2, COLORS.pencil, 1, 'slash');
                            if (targetIsBase) {
                                applyDamage(u.team === 1 ? -1 : 1, 'base', actualDmg);
                            } else if (target && target.hp > 0) {
                                target.hp -= actualDmg;
                                spawnParticles(target.x, target.y - target.size / 2, COLORS.destructive, 5, 'splatter');
                                spawnCanvasText(`-${Math.floor(actualDmg)}`, target.x + (Math.random() * 20 - 10), target.y - target.size, COLORS.destructive);
                                if (u.type === 'heavy') target.x += dir * 15;
                            }
                        }
                    }
                } else {
                    u.isAttacking = false;
                    u.moving = true;
                    let intendedX = u.x + u.speed * dir * dt;
                    let blockedX = queueLimit - dir * (u.size / 2 + 5);

                    // Ensure base bounds are not exceeded
                    if (dir === 1 && blockedX > enemyBaseX) blockedX = enemyBaseX;
                    if (dir === -1 && blockedX < enemyBaseX) blockedX = enemyBaseX;

                    if ((dir === 1 && intendedX > blockedX) || (dir === -1 && intendedX < blockedX)) {
                        u.x += (blockedX - u.x) * 10 * dt;
                        if (Math.abs(u.x - blockedX) < 2) u.moving = false;
                    } else {
                        u.x = intendedX;
                    }
                    queueLimit = u.x - dir * (u.size / 2 + 5);
                }
            }
        }

        function updateProjectilesAndFX(dt) {
            for (let i = 0; i < gameState.projectiles.pool.length; i++) {
                let p = gameState.projectiles.pool[i];
                if (!p.active) continue;

                let validTarget = p.targetUnit && p.targetUnit.active && p.targetUnit.id === p.targetUnitId;

                if (p.type === 'laser' || p.type === 'orbital') {
                    p.life -= dt;
                    if (p.life <= 0) p.active = false;
                    else if (!p.isSpecial && !p.hit) {
                        if (validTarget && p.targetUnit.hp > 0) p.targetUnit.hp -= p.dmg;
                        else if (p.targetIsBase) applyDamage(p.team === 1 ? -1 : 1, 'base', p.dmg);
                        p.hit = true;
                        spawnParticles(p.targetX, p.targetY, COLORS.blue, 10, 'spark');
                    }
                    continue;
                }

                if (p.type === 'bombDrop') {
                    p.vy += 800 * dt; p.y += p.vy * dt;
                    if (p.y > GROUND_Y) {
                        applyAoEDamage(p.x, p.team, p.dmg, 120, true);
