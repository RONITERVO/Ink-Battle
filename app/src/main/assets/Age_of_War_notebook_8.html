                        spawnParticles(p.x, GROUND_Y, COLORS.fire, 20, 'explosion');
                        gameState.screenShake = 0.2; p.active = false;
                    }
                    continue;
                }

                for (let j = 9; j > 0; j--) {
                    p.trailX[j] = p.trailX[j - 1]; p.trailY[j] = p.trailY[j - 1];
                }
                p.trailX[0] = p.x; p.trailY[0] = p.y;
                p.trailCount = Math.min(10, (p.trailCount || 0) + 1);

                p.x += p.vx * dt;
                p.y += p.vy * dt;

                if (p.type === 'arc' || p.type === 'meteor' || p.type === 'arrow' || p.type === 'cannonball') p.vy += 800 * dt;
                if (p.type === 'orb') { p.life += dt; p.vx += Math.sin(p.life * 10) * 50 * dt; }

                let hit = false;
                if (p.y >= p.targetY && Math.abs(p.x - p.targetX) < HIT_TOLERANCE) hit = true;
                if (p.y > GROUND_Y + 20) hit = true;
                if ((p.team === 1 && p.x >= CANVAS_WIDTH - BASE_WIDTH) || (p.team === -1 && p.x <= BASE_WIDTH)) hit = true;

                if (validTarget && (p.type === 'straight' || p.type === 'orb')) {
                    let dx = p.targetUnit.x - p.x; let dy = (p.targetUnit.y - p.targetUnit.size / 2) - p.y;
                    if (Math.sqrt(dx * dx + dy * dy) < p.targetUnit.size / 2) hit = true;
                }

                if (hit) {
                    if (p.isSpecial) {
                        let radius = p.type === 'meteor' ? 150 : (p.type === 'cannonball' ? 120 : 60);
                        applyAoEDamage(p.x, p.team, p.dmg, radius, true);
                        if (p.type === 'meteor' || p.type === 'cannonball') {
                            spawnParticles(p.x, GROUND_Y, COLORS.fire, 25, 'explosion');
                            spawnParticles(p.x, GROUND_Y, COLORS.pencil, 15, 'dust');
                            gameState.screenShake = p.type === 'meteor' ? 0.3 : 0.2;
                        } else if (p.type === 'arrow') {
                            spawnParticles(p.x, GROUND_Y, COLORS.pencilLight, 5, 'dust');
                        }
                    } else {
                        if (validTarget && Math.abs(p.x - p.targetUnit.x) < p.targetUnit.size + 20) {
                            p.targetUnit.hp -= p.dmg;
                            spawnParticles(p.x, p.y, COLORS.destructive, 5, 'splatter');
                            spawnCanvasText(`-${Math.floor(p.dmg)}`, p.x, p.y - 20, COLORS.destructive);
                        } else if (
                            (p.team === 1 && p.x >= CANVAS_WIDTH - BASE_WIDTH - HIT_TOLERANCE) ||
                            (p.team === -1 && p.x <= BASE_WIDTH + HIT_TOLERANCE)
                        ) {
                            applyDamage(p.team === 1 ? -1 : 1, 'base', p.dmg);
                            spawnParticles(p.x, p.y, COLORS.accent, 8, 'explosion');
                        } else {
                            spawnParticles(p.x, GROUND_Y, COLORS.pencilLight, 5, 'dust');
                        }
                    }
                    p.active = false;
                }
            }

            for (let i = 0; i < gameState.visualFx.pool.length; i++) {
                let fx = gameState.visualFx.pool[i];
                if (!fx.active) continue;
                if (fx.type === 'plane') {
                    fx.x += fx.vx * dt;
                    if (Math.random() < dt * 4) {
                        gameState.projectiles.spawn({ type: 'bombDrop', x: fx.x, y: fx.y, vx: 0, vy: 0, dmg: 400, team: fx.team, isSpecial: true });
                    }
                    if ((fx.vx > 0 && fx.x > CANVAS_WIDTH) || (fx.vx < 0 && fx.x < 0)) fx.active = false;
                }
            }

            for (let i = 0; i < gameState.particles.pool.length; i++) {
                let pt = gameState.particles.pool[i];
                if (!pt.active) continue;

                pt.x += pt.vx * dt;
                pt.y += pt.vy * dt;

                if (['splatter', 'explosion', 'dust'].includes(pt.pType)) pt.vy += 600 * dt;
                if (pt.pType === 'graphite' || pt.pType === 'ghost') {
                    pt.x += Math.sin(pt.life * 10) * 15 * dt;
                    pt.y -= 30 * dt;
                }

                pt.life -= dt;
                if (pt.life <= 0) pt.active = false;
            }

            for (let i = 0; i < gameState.floatingTexts.pool.length; i++) {
                let ft = gameState.floatingTexts.pool[i];
                if (!ft.active) continue;
                ft.life -= dt * 1.2;
                ft.y -= dt * 40;
                if (ft.life <= 0) ft.active = false;
            }
        }

        function updateTurrets(team, enemies, eCount, dt) {
            let state = team === 1 ? gameState.player : gameState.enemy;
            for (let i = 0; i < state.unlockedSlots; i++) {
                let tIdx = state.turrets[i];
                if (tIdx === null || state.turretProgress[i] < 1) continue;

                if (!state.turretTimers) state.turretTimers = [0, 0, 0, 0];
                state.turretTimers[i] -= dt;

                if (state.turretTimers[i] <= 0) {
                    let tData = AGES[state.age].turrets[tIdx];
                    let baseX = team === 1 ? BASE_WIDTH - 10 : CANVAS_WIDTH - BASE_WIDTH + 10;
                    let baseY = GROUND_Y - 150 - (i * 90);
                    let actualDmg = tData.dmg * getStatMult(state, 'dmg');

                    let target = null, closest = Infinity;
                    for (let j = 0; j < eCount; j++) {
                        let e = enemies[j];
                        if (e.drawProgress < 0.8 || e.hp <= 0) continue;
                        let dist = Math.abs(e.x - baseX);
                        if (dist <= tData.range && dist < closest) { closest = dist; target = e; }
                    }
                    if (target) {
                        state.turretTimers[i] = tData.attackSpeed;
                        spawnParticles(baseX + (team * 20), baseY, COLORS.pencil, 3, 'spark');
                        fireProjectile(baseX, baseY, target.x, target.y - target.size / 2, tData.projType, tData.projSpeed, actualDmg, team, target);
                    }
                }
            }
        }

        // --- ADVANCED AI DECISION ENGINE ---
        function handleAdvancedAI(dt) {
            AIDirector.tick(dt);
        }

        function handleSpecialAttacks(dt) {
            if (!gameState.specialActive) return;

            let sa = gameState.specialActive;
            sa.timer -= dt;
            let sData = AGES[sa.age].special;
            let effectArea = (sa.team === 1) ? { min: BASE_WIDTH + 50, max: CANVAS_WIDTH } : { min: 0, max: CANVAS_WIDTH - BASE_WIDTH - 50 };

            if (sData.type === "meteor") {
                if (Math.random() < 8 * dt) {
                    let sx = effectArea.min + Math.random() * (effectArea.max - effectArea.min);
                    fireProjectile(sx - (sa.team * 200), -50, sx, GROUND_Y, 'meteor', 800, 150, sa.team, null);
                }
            } else if (sData.type === "arrows") {
                if (Math.random() < 30 * dt) {
                    let sx = effectArea.min + Math.random() * (effectArea.max - effectArea.min);
                    fireProjectile(sx - (sa.team * 300), -50, sx, GROUND_Y, 'arrow', 1000, 40, sa.team, null);
                }
            } else if (sData.type === "cannons") {
                if (Math.random() < 6 * dt) {
                    let sx = effectArea.min + Math.random() * (effectArea.max - effectArea.min);
                    let startX = sa.team === 1 ? 0 : CANVAS_WIDTH;
                    fireProjectile(startX, Math.random() * 200 + 100, sx, GROUND_Y, 'cannonball', 1200, 300, sa.team, null);
                }
            } else if (sData.type === "airstrike") {
                let planeCount = 0;
                for (let i = 0; i < gameState.visualFx.pool.length; i++) {
                    if (gameState.visualFx.pool[i].active && gameState.visualFx.pool[i].type === 'plane') planeCount++;
                }
                if (Math.random() < 2 * dt && planeCount < 2) {
                    gameState.visualFx.spawn({
                        type: 'plane', x: sa.team === 1 ? 0 : CANVAS_WIDTH,
                        y: 150 + Math.random() * 100, vx: sa.team === 1 ? 600 : -600, team: sa.team
                    });
                }
            } else if (sData.type === "laser" || sData.type === "orbital") {
                gameState.screenShake = sData.type === "laser" ? 0.15 : 0.3;
                let dpt = (sData.type === "laser" ? 800 : 2500) * dt;
                let cx = sa.team === 1 ? effectArea.max - 300 : effectArea.min + 300;

                let found = false;
                for (let i = 0; i < gameState.projectiles.pool.length; i++) {
                    if (gameState.projectiles.pool[i].active && gameState.projectiles.pool[i].type === sData.type && gameState.projectiles.pool[i].team === sa.team) { found = true; break; }
                }
                if (!found) gameState.projectiles.spawn({ type: sData.type, x: cx, y: GROUND_Y, life: sa.timer, team: sa.team, isSpecial: true });

                let radius = sData.type === "laser" ? 150 : 300;
                for (let i = 0; i < gameState.units.pool.length; i++) {
                    let e = gameState.units.pool[i];
                    if (!e.active || e.team === sa.team) continue;
                    if (Math.abs(e.x - cx) < radius) {
                        e.hp -= dpt;
                        if (Math.random() < 0.2) spawnParticles(e.x, e.y - e.size / 2, COLORS.destructive, 1, 'splatter');
                    }
                }
            }
            if (sa.timer <= 0) gameState.specialActive = null;
        }

        // --- ACTIONS & UTILS ---
        function fireProjectile(startX, startY, targetX, targetY, type, speed, dmg, team, targetUnit) {
            let dx = targetX - startX;
            let dy = targetY - startY;
            let isSpecial = ['meteor', 'arrow', 'cannonball', 'bombDrop'].includes(type);

            let p = gameState.projectiles.spawn({
                x: startX, y: startY, targetX, targetY, type, speed, dmg, team,
                targetUnit: targetUnit, targetUnitId: targetUnit ? targetUnit.id : null,
                targetIsBase: !targetUnit && ((team === 1 && targetX >= CANVAS_WIDTH - BASE_WIDTH - HIT_TOLERANCE) || (team === -1 && targetX <= BASE_WIDTH + HIT_TOLERANCE)),
                life: 0, hit: false, isSpecial, trailCount: 0
            });

            if (['straight', 'laser', 'orb'].includes(type)) {
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 1) dist = 1;
                p.vx = (dx / dist) * speed; p.vy = (dy / dist) * speed;
                if (type === 'laser') p.life = 0.25;
            } else {
                let t = Math.abs(dx) / speed;
                p.vx = (dx / t); p.vy = (dy - 0.5 * 800 * t * t) / t;
            }
        }

        function applyAoEDamage(x, sourceTeam, dmg, radius, isSpecial = false) {
            for (let i = 0; i < gameState.units.pool.length; i++) {
                let e = gameState.units.pool[i];
                if (!e.active || e.team === sourceTeam) continue;
                if (Math.abs(e.x - x) < radius) {
                    e.hp -= dmg;
                    spawnCanvasText(`-${Math.floor(dmg)}`, e.x, e.y - e.size - 10, COLORS.destructive);
                    e.x += sourceTeam * 10;
                }
            }
            if (!isSpecial) {
                let baseHitX = sourceTeam === 1 ? CANVAS_WIDTH - BASE_WIDTH : BASE_WIDTH;
                if (Math.abs(baseHitX - x) < radius) applyDamage(sourceTeam === 1 ? -1 : 1, 'base', dmg);
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            UIManager.toggleClass('menuUnits', tab !== 'units', 'hidden');
            UIManager.toggleClass('menuTurrets', tab !== 'turrets', 'hidden');
            UIManager.toggleClass('menuUpgrades', tab !== 'upgrades', 'hidden');
            updateUI();
        }

        function buyUnit(typeIdx) {
            let p = gameState.player;
            let cost = AGES[p.age].units[typeIdx].cost;
            if (p.gold >= cost && p.drawProgress >= 1) {
                p.gold -= cost;
                spawnUnit(1, p.age, typeIdx);
                updateUI();
            }
        }

        function buyTurret(typeIdx) {
            let p = gameState.player;
            let cost = AGES[p.age].turrets[typeIdx].cost;
            let emptySlot = p.turrets.findIndex((t, idx) => t === null && idx < p.unlockedSlots);
            if (p.gold >= cost && emptySlot !== -1 && p.drawProgress >= 1) {
                p.gold -= cost; p.turrets[emptySlot] = typeIdx; p.turretProgress[emptySlot] = 0; updateUI();
            }
        }

        function sellTurret() {
            let p = gameState.player;
            for (let i = p.unlockedSlots - 1; i >= 0; i--) {
                if (p.turrets[i] !== null) {
                    p.gold += AGES[p.age].turrets[p.turrets[i]].cost * 0.5; p.turrets[i] = null; updateUI(); break;
                }
            }
        }

        function buySlot() {
            let p = gameState.player; let cost = p.unlockedSlots * 500;
            if (p.unlockedSlots < 4 && p.gold >= cost) { p.gold -= cost; p.unlockedSlots++; updateUI(); }
        }

        function buyUpgrade(type) {
            let p = gameState.player; let lvl = p.upgrades[type];
            if (lvl < 10 && p.gold >= UPGRADE_COSTS[lvl]) {
                p.gold -= UPGRADE_COSTS[lvl]; p.upgrades[type]++;
                if (type === 'hp') {
                    let newMax = AGES[p.age].baseHp * getStatMult(p, 'hp');
                    p.hp += (newMax - p.maxHp); p.maxHp = newMax;
                }
                spawnCanvasText("UPGRADED!", BASE_WIDTH, CANVAS_HEIGHT / 2, COLORS.accent);
                updateUI();
            }
        }

        function evolve() {
            let p = gameState.player;
            if (p.age < AGES.length - 1 && p.xp >= AGES[p.age].evolveXP && p.drawProgress >= 1) {
                p.age++; p.drawProgress = 0;
                let newMax = AGES[p.age].baseHp * getStatMult(p, 'hp');
                p.hp += (newMax - p.maxHp); p.maxHp = newMax;
                p.turrets = [null, null, null, null];

                applyTheme(p.age);
                gameState.ageTransition = 1.0;
                spawnCanvasText("NEW AGE!", BASE_WIDTH + 50, CANVAS_HEIGHT / 2, COLORS.gold);
                gameState.screenShake = 0.5;
                updateUI();
            }
        }

        function useSpecial() {
            let p = gameState.player;
            if (p.specialTimer <= 0 && !gameState.specialActive) {
                triggerSpecial(1); p.specialTimer = AGES[p.age].special.cooldown; updateUI();
            }
        }

        function triggerSpecial(team) {
            let age = team === 1 ? gameState.player.age : gameState.enemy.age;
            gameState.specialActive = { team, age, timer: AGES[age].special.duration };
        }

        function spawnUnit(team, age, typeIdx) {
            let uData = AGES[age].units[typeIdx];
            let owner = team === 1 ? gameState.player : gameState.enemy;
            let hp = uData.hp * getStatMult(owner, 'hp');
            gameState.units.spawn({
                id: ++globalIdSequence, team: team, age: age, uType: typeIdx, type: uData.type, name: uData.name,
                x: team === 1 ? BASE_WIDTH : CANVAS_WIDTH - BASE_WIDTH, y: GROUND_Y,
                hp: hp, maxHp: hp, dmg: uData.dmg, range: uData.range,
                speed: uData.speed, size: uData.size, attackSpeed: uData.attackSpeed,
                projType: uData.projType, projSpeed: uData.projSpeed,
                killXp: uData.killXp, killGold: uData.killGold,
                attackCooldown: 0, animOffset: Math.random() * 100,
                isAttacking: false, moving: true, animTimer: 0, drawProgress: 0
            });
        }

        function applyDamage(targetTeam, targetType, amount) {
            if (targetType === 'base' && amount > 0) {
                let state = targetTeam === 1 ? gameState.player : gameState.enemy;
                state.hp -= amount;
                let bx = targetTeam === 1 ? BASE_WIDTH / 2 : CANVAS_WIDTH - BASE_WIDTH / 2;
                spawnParticles(bx, GROUND_Y - 100, COLORS.destructive, 15, 'explosion');
                spawnCanvasText(`-${Math.floor(amount)}`, bx, GROUND_Y - 150, COLORS.destructive);
                if (amount > 100) gameState.screenShake = 0.1;
            }
        }

        function addXP(team, amount) {
            if (team === 1) {
                gameState.player.xp += amount;
                spawnCanvasText(`+${amount} XP`, CANVAS_WIDTH / 2, 200, COLORS.blue);
            } else {
                gameState.enemy.xp += amount * currentConfig.xpMult;
            }
        }

        function spawnParticles(x, y, color, count, pType) {
            for (let i = 0; i < count; i++) {
                gameState.particles.spawn({
                    x, y, pType, color,
                    vx: (Math.random() - 0.5) * 500, vy: (Math.random() - 1) * 400,
                    life: 0.3 + Math.random() * 0.5, size: Math.random() * 8 + 4
                });
            }
        }

        function spawnCanvasText(text, x, y, color) {
            gameState.floatingTexts.spawn({ text, x, y, color, life: 1.0 });
        }

        function updateUI() {
            if (!gameState.player) return;
            let p = gameState.player;
            let ageData = AGES[p.age];

            UIManager.setText('ui-gold', Math.floor(p.gold));
            UIManager.setText('ui-xp', Math.floor(p.xp));
            UIManager.setText('ui-income', ((5 + p.age * 5) * getStatMult(p, 'econ')).toFixed(1) + "/s");
            UIManager.setText('age-title', ageData.name);

            if (currentTab === 'units') {
                for (let i = 0; i < 3; i++) {
                    let uData = ageData.units[i];
                    UIManager.setText(`name-u${i + 1}`, uData.name);
                    UIManager.setText(`cost-u${i + 1}`, uData.cost);
                    UIManager.setDisabled(`btn-u${i + 1}`, p.gold < uData.cost || p.drawProgress < 1);
                }
            } else if (currentTab === 'turrets') {
                let hasEmptySlot = p.turrets.slice(0, p.unlockedSlots).includes(null);
                let hasTurret = p.turrets.some(t => t !== null);
                for (let i = 0; i < 3; i++) {
                    let tData = ageData.turrets[i];
                    UIManager.setText(`name-t${i + 1}`, tData.name);
                    UIManager.setText(`cost-t${i + 1}`, tData.cost);
                    UIManager.setDisabled(`btn-t${i + 1}`, p.gold < tData.cost || !hasEmptySlot || p.drawProgress < 1);
                }
                UIManager.setDisabled('btn-sell', !hasTurret);

                if (p.unlockedSlots >= 4) {
                    UIManager.setDisabled('btn-slot', true); UIManager.setText('cost-slot', "MAX");
                } else {
                    let slotCost = p.unlockedSlots * 500;
                    UIManager.setText('cost-slot', slotCost); UIManager.setDisabled('btn-slot', p.gold < slotCost);
                }
            } else if (currentTab === 'upgrades') {
                ['dmg', 'hp', 'econ'].forEach(t => {
                    let lvl = p.upgrades[t];
                    if (lvl >= 10) {
                        UIManager.setDisabled(`btn-up-${t}`, true); UIManager.setText(`cost-up-${t}`, "MAX"); UIManager.setText(`val-up-${t}`, `Lvl 10`);
                    } else {
                        let cost = UPGRADE_COSTS[lvl];
                        UIManager.setText(`cost-up-${t}`, cost); UIManager.setDisabled(`btn-up-${t}`, p.gold < cost);
                        let mult = (t === 'dmg') ? 15 : (t === 'hp' ? 25 : 20);
                        UIManager.setText(`val-up-${t}`, `Lvl ${lvl} (+${lvl * mult}%)`);
                    }
                });
            }

            if (p.age >= AGES.length - 1) {
                UIManager.setDisabled('btn-evolve', true); UIManager.setText('cost-evolve', "MAX AGE");
            } else {
                UIManager.setText('cost-evolve', ageData.evolveXP + " XP");
                UIManager.setDisabled('btn-evolve', p.xp < ageData.evolveXP || p.drawProgress < 1);
            }

            if (p.specialTimer > 0) {
                UIManager.setDisabled('btn-special', true); UIManager.setText('cost-special', Math.ceil(p.specialTimer) + "s");
            } else if (gameState.specialActive) {
                UIManager.setDisabled('btn-special', true); UIManager.setText('cost-special', "Busy");
            } else {
                UIManager.setDisabled('btn-special', false); UIManager.setText('cost-special', "Ready");
            }

            UIManager.setWidth('player-hp-fill', `${Math.max(0, p.hp / p.maxHp) * 100}%`);
            UIManager.setWidth('enemy-hp-fill', `${Math.max(0, gameState.enemy.hp / gameState.enemy.maxHp) * 100}%`);
            UIManager.setText('player-hp-text', `${Math.floor(Math.max(0, p.hp))} / ${Math.floor(p.maxHp)}`);
            UIManager.setText('enemy-hp-text', `${Math.floor(Math.max(0, gameState.enemy.hp))} / ${Math.floor(gameState.enemy.maxHp)}`);
        }

        function checkWinLoss() {
            if (gameState.player.hp <= 0 || gameState.enemy.hp <= 0) {
                gameState.running = false;
                document.getElementById('game-over-screen').classList.remove('hidden');
                TooltipManager.hide();

                let won = gameState.enemy.hp <= 0;
                document.getElementById('end-title').innerText = won ? "Victory!" : "Defeat...";
                document.getElementById('end-desc').innerText = won ? "You have conquered history and filled the sketchbook." : "Your civilization was erased from the pages of history.";

                if (won) {
                    StorageManager.saveWin(currentDifficulty);
                    DirectorPanel.add('ai', 'That page is yours. I saved the difficulty medal.');
                    GemmaMemory.recordSystem(`Match ended: player won ${currentDifficulty} at ${Math.round(globalTime)}s.`);
                } else {
                    DirectorPanel.add('ai', 'I took this page. The pacts and memory remain for the rematch.');
                    GemmaMemory.recordSystem(`Match ended: Gemma director won ${currentDifficulty} at ${Math.round(globalTime)}s.`);
                }
            }
        }

        // --- RENDERING PIPELINE ---
        function draw() {
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            ctx.save();

            if (gameState.screenShake > 0) {
                let mag = gameState.screenShake * 15;
                ctx.translate(Math.sin(globalTime * 50) * mag, Math.cos(globalTime * 43) * mag);
            }

            drawBackground(gameState.worldProgress);

            if (gameState.worldProgress >= 1.0) {
                drawBase(1, gameState.player);
                drawBase(-1, gameState.enemy);

                for (let i = 0; i < gameState.units.pool.length; i++) {
                    if (gameState.units.pool[i].active) drawUnit(gameState.units.pool[i]);
                }
                for (let i = 0; i < gameState.projectiles.pool.length; i++) {
                    if (gameState.projectiles.pool[i].active) drawProjectile(gameState.projectiles.pool[i]);
                }
                for (let i = 0; i < gameState.visualFx.pool.length; i++) {
                    if (gameState.visualFx.pool[i].active) drawFX(gameState.visualFx.pool[i]);
                }

                // Render Particles
                for (let i = 0; i < gameState.particles.pool.length; i++) {
                    let pt = gameState.particles.pool[i];
                    if (!pt.active) continue;

                    setSketchStyle(pt.color, 2);
                    ctx.globalAlpha = Math.max(0, pt.life);

                    if (pt.pType === 'splatter') {
                        ctx.beginPath();
                        ctx.moveTo(pt.x, pt.y);
                        ctx.lineTo(pt.x - pt.vx * 0.05, pt.y - pt.vy * 0.05);
                        ctx.arc(pt.x, pt.y, pt.size / 2, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (pt.pType === 'ghost') {
                        setSketchStyle(COLORS.pencilLight, 2);
                        drawRoughCircle(pt.x, pt.y, 15, 1, 2);
                        drawRoughLine(pt.x - 5, pt.y - 2, pt.x - 2, pt.y - 2, 1, 0);
                        drawRoughLine(pt.x + 5, pt.y - 2, pt.x + 2, pt.y - 2, 1, 0);
                        drawRoughLine(pt.x - 10, pt.y + 15, pt.x + 10, pt.y + 15, 1, 5);
                    } else if (pt.pType === 'slash') {
                        setSketchStyle(COLORS.pencil, 3);
                        ctx.beginPath();
                        ctx.arc(pt.x, pt.y, 30, -Math.PI / 4, Math.PI / 4);
                        ctx.stroke();
                    } else if (pt.pType === 'graphite') {
                        setSketchStyle(COLORS.pencil, 3);
                        ctx.beginPath();
                        ctx.arc(pt.x, pt.y, 2, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (pt.pType === 'spark' || pt.pType === 'dust') {
                        drawRoughCircle(pt.x, pt.y, pt.size / 2, 1, 1);
                    } else {
                        fillScribble(pt.x, pt.y, pt.size, pt.size, pt.color, 3);
                    }
                }
                ctx.globalAlpha = 1.0;

                // Render Floating Text
                for (let i = 0; i < gameState.floatingTexts.pool.length; i++) {
                    let ft = gameState.floatingTexts.pool[i];
                    if (!ft.active) continue;

                    ctx.globalAlpha = ft.life;
                    ctx.fillStyle = ft.color;
                    ctx.font = `bold ${30 + (1 - ft.life) * 15}px 'Caveat', cursive`;
                    ctx.textAlign = 'center';
                    ctx.fillText(ft.text, ft.x, ft.y);
                }
                ctx.globalAlpha = 1.0;
            }
            ctx.restore();
        }

        function drawBackground(wp) {
            // 1. Draw Organic Procedural Watercolor Wash (Restored Multiply from Iteration 1)
            ctx.save();
            ctx.globalCompositeOperation = 'multiply';

            if (gameState.ageTransition > 0) {
                ctx.globalAlpha = gameState.ageTransition;
                ctx.drawImage(WatercolorEngine.canvases[gameState.player.age - 1], 0, 0);
                ctx.globalAlpha = 1.0 - gameState.ageTransition;
                ctx.drawImage(WatercolorEngine.canvases[gameState.player.age], 0, 0);
            } else {
                ctx.drawImage(WatercolorEngine.canvases[gameState.player.age], 0, 0);
            }
            ctx.restore();

            // 2. Era-Specific Architectural/Sketch details
            setSketchStyle(COLORS.pencilLight, 1);
            ctx.save();
            ctx.globalAlpha = 0.2 + (0.1 * Math.sin(globalTime));
            let age = gameState.player.age;

            if (age === 0) {
                drawRoughCircle(CANVAS_WIDTH / 2, 200, 50, 1, 5, wp);
                for (let i = 0; i < 3; i++) drawRoughCircle(CANVAS_WIDTH / 2, 200, 30 + i * 10, 1, 3, wp);
            } else if (age === 1) {
                for (let x = 200; x < CANVAS_WIDTH - 200; x += 150) {
                    drawRoughLine(x, GROUND_Y, x, GROUND_Y - 300, 1, 1, wp);
                    drawRoughLine(x, GROUND_Y - 300, x + 150, GROUND_Y - 300, 1, 1, wp);
                    ctx.beginPath();
                    ctx.arc(x + 75, GROUND_Y - 150, 75, Math.PI, 0);
                    ctx.stroke();
                }
            } else if (age === 2) {
                drawRoughCircle(CANVAS_WIDTH / 2, 300, 200, 2, 1, wp);
                drawRoughLine(CANVAS_WIDTH / 2 - 200, 300, CANVAS_WIDTH / 2 + 200, 300, 1, 1, wp);
                drawRoughLine(CANVAS_WIDTH / 2, 100, CANVAS_WIDTH / 2, 500, 1, 1, wp);
                ctx.strokeRect(CANVAS_WIDTH / 2 - 140, 160, 280, 280);
            } else if (age === 3) {
                for (let r = 0; r < 4; r++) {
                    ctx.beginPath();
                    for (let x = 0; x <= CANVAS_WIDTH; x += 100) {
                        let y = 300 + Math.sin(x / 200) * 100 + r * 50 + Math.cos(x / 150 + r) * 30;
                        ctx.lineTo(x, y);
                    }
                    ctx.stroke();
                }
            } else if (age === 4) {
                for (let x = 100; x < CANVAS_WIDTH; x += 150) {
                    for (let y = 100; y < GROUND_Y; y += 130) {
                        drawRoughCircle(x, y, 40, 1, 1, wp);
                        drawRoughLine(x, y, x + 75, y + 65, 1, 1, wp);
                    }
                }
            } else if (age === 5) {
                for (let i = 0; i < 15; i++) {
                    let cx = (Math.sin(i * 12.2) * CANVAS_WIDTH + CANVAS_WIDTH) % CANVAS_WIDTH;
                    let cy = (Math.cos(i * 3.1) * 400 + 400) % 400;
                    drawRoughCircle(cx, cy, 20 + i * 2, 1, 2, wp);
                    drawRoughLine(cx, cy, CANVAS_WIDTH / 2, 200, 1, 1, wp);
                }
            }
            ctx.restore();

            // 3. Environment Scenery
            drawRoughCircle(CANVAS_WIDTH * 0.8, 150, 60, 2, 5, wp);

            ctx.beginPath();
            for (let x = 0; x <= CANVAS_WIDTH; x += 80) {
                let y = GROUND_Y - 200 - Math.sin(x / 300 + globalTime * 0.1) * 100 + jitterVal(x, 0, 5);
                ctx.lineTo(x, y);
            }
            applyDash(wp, CANVAS_WIDTH * 2);
            ctx.stroke();
            ctx.setLineDash([]);

            for (let c = 0; c < 4; c++) {
                let cx = (globalTime * 5 + c * 300) % (CANVAS_WIDTH + 200) - 100;
                let cy = 100 + c * 40;
                drawRoughCircle(cx, cy, 30, 1, 5, wp);
                drawRoughCircle(cx + 40, cy - 10, 45, 1, 5, wp);
                drawRoughCircle(cx + 80, cy, 25, 1, 5, wp);
            }

            setSketchStyle(COLORS.pencil, 2);
            drawRoughLine(0, GROUND_Y, CANVAS_WIDTH, GROUND_Y, 2, 5, wp);

            ctx.beginPath();
            for (let i = 0; i < CANVAS_WIDTH; i += 60) {
                let j = jitterVal(i, GROUND_Y, 5);
                ctx.moveTo(i, GROUND_Y + j);
                ctx.lineTo(i + 30, GROUND_Y - 50 - Math.abs(j * 5));
                ctx.lineTo(i + 60, GROUND_Y + j);
            }
            applyDash(wp, CANVAS_WIDTH * 2);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawFX(fx) {
            if (fx.type === 'plane') {
                ctx.save();
                ctx.translate(fx.x, fx.y);
                if (fx.team === -1) ctx.scale(-1, 1);

                setSketchStyle(COLORS.pencil, 3);
                drawRoughLine(-40, 0, 50, 0, 2, 2);
                drawRoughCircle(50, 0, 10, 2, 2);
                drawRoughLine(10, 0, -20, -30, 2, 2);
                drawRoughLine(10, 0, -20, 30, 2, 2);
                drawRoughLine(-40, 0, -50, -15, 2, 2);
                fillScribble(-30, -5, 60, 10, COLORS.pencil, 3);

                ctx.restore();
            }
        }

        function drawBase(team, state) {
            let x = team === 1 ? 0 : CANVAS_WIDTH - BASE_WIDTH;
            let y = GROUND_Y;
            let dp = state.drawProgress;

            ctx.save();
            ctx.translate(x, y);
            if (team === -1) {
                ctx.translate(BASE_WIDTH, 0);
                ctx.scale(-1, 1);
            }

            setSketchStyle(COLORS.pencil, 3);

            switch (AGES[state.age].baseStyle) {
                case "cave":
                    drawRoughLine(10, 0, BASE_WIDTH, 0, 2, 5, dp);
                    ctx.beginPath();
                    ctx.moveTo(10, 0);
                    ctx.quadraticCurveTo(BASE_WIDTH / 2, -300, BASE_WIDTH, 0);
                    applyDash(dp, BASE_WIDTH * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    fillScribble(30, -150, BASE_WIDTH - 60, 150, COLORS.pencil, 8, dp);
                    break;
                case "castle":
                    drawRoughLine(20, 0, 20, -200, 2, 3, dp);
                    drawRoughLine(BASE_WIDTH - 20, 0, BASE_WIDTH - 20, -200, 2, 3, dp);
                    drawRoughLine(20, -200, BASE_WIDTH - 20, -200, 2, 3, dp);
                    for (let i = 20; i < BASE_WIDTH - 30; i += 30) {
                        drawRoughLine(i, -200, i, -230, 2, 2, dp);
                        drawRoughLine(i, -230, i + 15, -230, 2, 2, dp);
                        drawRoughLine(i + 15, -230, i + 15, -200, 2, 2, dp);
                    }
                    fillScribble(BASE_WIDTH / 2 - 30, -100, 60, 100, COLORS.pencil, 6, dp);
                    break;
                case "fort":
                    drawRoughLine(10, 0, 30, -250, 2, 2, dp);
                    drawRoughLine(BASE_WIDTH - 10, 0, BASE_WIDTH - 30, -250, 2, 2, dp);
                    drawRoughLine(30, -250, BASE_WIDTH - 30, -250, 2, 2, dp);
                    for (let i = -200; i < 0; i += 40) drawRoughLine(15, i, BASE_WIDTH - 15, i, 1, 2, dp);
                    break;
                case "bunker":
                    drawRoughLine(10, 0, 10, -150, 2, 2, dp);
                    drawRoughLine(10, -150, BASE_WIDTH / 2, -200, 2, 2, dp);
                    drawRoughLine(BASE_WIDTH / 2, -200, BASE_WIDTH - 10, -150, 2, 2, dp);
                    drawRoughLine(BASE_WIDTH - 10, -150, BASE_WIDTH - 10, 0, 2, 2, dp);
                    for (let i = 0; i < 3; i++) drawRoughCircle(BASE_WIDTH + 20, -15 - i * 20, 15, 2, 2, dp);
                    fillScribble(20, -120, BASE_WIDTH - 40, 20, COLORS.pencil, 4, dp);
                    break;
                case "dome":
                    ctx.beginPath();
                    ctx.arc(BASE_WIDTH / 2, 0, BASE_WIDTH / 2 - 10, Math.PI, 0);
                    applyDash(dp, BASE_WIDTH * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    setSketchStyle(COLORS.blue, 2);
                    ctx.beginPath();
                    ctx.arc(BASE_WIDTH / 2, 0, BASE_WIDTH / 2 - 25, Math.PI, 0);
                    applyDash(dp, BASE_WIDTH * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    drawRoughLine(BASE_WIDTH / 2, 0, BASE_WIDTH / 2, -BASE_WIDTH / 2 + 25, 2, 2, dp);
                    setSketchStyle(COLORS.pencil, 3);
                    break;
                case "portal":
                    setSketchStyle(COLORS.accent, 2);
                    for (let i = 0; i < 4; i++) {
                        let r = (BASE_WIDTH / 2 - 10) - i * 10;
                        drawRoughCircle(BASE_WIDTH / 2, -BASE_WIDTH / 2, r, 2, 4 + i * 2, dp);
                    }
                    drawRoughLine(0, 0, BASE_WIDTH, 0, 2, 3, dp);
                    drawRoughLine(BASE_WIDTH / 2 - 20, 0, BASE_WIDTH / 2, -BASE_WIDTH / 2, 2, 2, dp);
                    drawRoughLine(BASE_WIDTH / 2 + 20, 0, BASE_WIDTH / 2, -BASE_WIDTH / 2, 2, 2, dp);
                    setSketchStyle(COLORS.pencil, 3);
                    break;
            }

            for (let i = 0; i < state.unlockedSlots; i++) {
                let ty = -150 - (i * 90);
                let tx = BASE_WIDTH - 60;
                let tp = state.turretProgress[i];

                if (state.age !== 5) {
                    drawRoughLine(tx, ty, tx + 50, ty, 2, 3, tp);
                    drawRoughLine(tx + 10, ty, tx + 10, ty + 90, 2, 3, tp);
                    drawRoughLine(tx + 40, ty, tx + 40, ty + 90, 2, 3, tp);
                    drawRoughLine(tx + 10, ty + 90, tx + 40, ty, 1, 2, tp);
                }
                if (state.turrets[i] !== null) drawTurret(tx + 25, ty, state.age, AGES[state.age].turrets[state.turrets[i]].name, tp);
            }
            ctx.restore();
        }

        function drawTurret(x, y, age, name, dp) {
            ctx.save();
            ctx.translate(x, y);
            setSketchStyle(COLORS.pencil, 2);

            if (age === 0) {
                drawRoughLine(-15, 0, 15, 0, 2, 3, dp);
                drawRoughLine(0, 0, 0, -30, 2, 3, dp);
                if (name.includes("Rock")) {
                    drawRoughCircle(0, -35, 10, 2, 3, dp);
                } else if (name.includes("Egg")) {
                    drawRoughLine(-10, -40, 10, -40, 2, 3, dp);
                    drawRoughLine(0, -30, 0, -40, 2, 3, dp);
                } else {
                    fillScribble(-10, -40, 20, 20, COLORS.accent, 4, dp);
                }
            } else if (age === 1) {
                drawRoughLine(-20, 0, 20, 0, 2, 3, dp);
                drawRoughLine(-10, 0, -20, -20, 2, 3, dp);
                if (name.includes("Catapult")) {
                    drawRoughLine(-20, -20, 20, -30, 2, 3, dp);
                    drawRoughCircle(20, -30, 8, 2, 3, dp);
                } else if (name.includes("Ballista")) {
                    drawRoughLine(-25, -15, 25, -25, 2, 3, dp);
                    drawRoughLine(10, -40, 10, -10, 2, 3, dp);
                } else {
                    drawRoughLine(-15, -30, 15, -30, 3, 2, dp);
                    fillScribble(-10, -25, 20, 25, COLORS.pencil, 4, dp);
                }
            } else if (age === 2) {
                drawRoughCircle(0, -10, 10, 2, 3, dp);
                drawRoughLine(0, -10, 25, -20, 3, 2, dp);
                if (name.includes("Heavy")) drawRoughLine(0, -10, 35, -25, 4, 2, dp);
                if (name.includes("Mortar")) drawRoughLine(-10, 0, 15, -35, 5, 2, dp);
            } else if (age === 3) {
                drawRoughLine(-15, 0, 15, 0, 2, 3, dp);
                drawRoughLine(0, 0, 0, -20, 2, 3, dp);
                if (name.includes("Machine")) {
                    drawRoughLine(-10, -20, 30, -20, 2, 1, dp);
                } else if (name.includes("Rocket")) {
                    drawRoughLine(0, -20, 25, -30, 4, 1, dp);
                    fillScribble(5, -35, 20, 10, COLORS.pencil, 3, dp);
                } else {
                    drawRoughLine(-5, -15, 40, -40, 4, 1, dp);
                }
            } else if (age === 4) {
                setSketchStyle(COLORS.blue, 2);
                drawRoughLine(-10, 0, 10, 0, 2, 3, dp);
                drawRoughLine(0, 0, 0, -20, 2, 3, dp);
                if (name.includes("Gatling")) {
                    drawRoughLine(0, -20, 30, -20, 2, 3, dp);
                    drawRoughLine(0, -15, 30, -15, 2, 3, dp);
                } else if (name.includes("Ion")) {
                    drawRoughCircle(0, -20, 15, 2, 3, dp);
                    drawRoughLine(15, -20, 40, -20, 3, 1, dp);
                } else {
                    drawRoughLine(-10, -30, 30, -40, 5, 1, dp);
                    fillScribble(0, -45, 20, 20, COLORS.blue, 4, dp);
                }
            } else if (age === 5) {
                setSketchStyle(COLORS.accent, 2);
                drawRoughCircle(0, -20, 15, 2, 5, dp);
                if (name.includes("Plasma")) {
                    drawRoughLine(0, -20, 40, -20, 4, 2, dp);
                } else if (name.includes("Black")) {
                    fillScribble(-15, -35, 30, 30, COLORS.pencil, 3, dp);
                } else {
                    drawRoughLine(-15, -20, 45, -20, 6, 1, dp);
                    drawRoughCircle(45, -20, 5, 2, 2, dp);
                }
            }
            ctx.restore();
        }

        function drawUnit(u) {
            ctx.save();
            ctx.translate(u.x, u.y);
            if (u.team === -1) ctx.scale(-1, 1);

            let bob = u.moving ? Math.abs(Math.sin((globalTime * 10) + u.animOffset)) * 5 : 0;
            let lunge = 0, armRot = 0, legRot = 0;

            if (u.isAttacking) {
                lunge = Math.sin(u.animTimer * Math.PI * 3) * 15;
                armRot = Math.sin(u.animTimer * Math.PI * 3) * Math.PI / 3;
            } else if (u.moving) {
                armRot = Math.sin((globalTime * 10) + u.animOffset) * Math.PI / 4;
                legRot = Math.sin((globalTime * 10) + u.animOffset) * Math.PI / 4;
            }

            ctx.translate(lunge, -bob);
            setSketchStyle(COLORS.pencil, 2);
            let s = u.size;
            let dp = u.drawProgress;

            if (u.age === 0) {
                if (u.type === 'heavy') {
                    drawRoughCircle(0, -s / 2, s / 3, 2, 3, dp);
                    drawRoughLine(s / 3, -s / 2, s / 1.5, -s * 0.8, 2, 4, dp);
                    drawRoughCircle(s / 1.5, -s * 0.8, 15, 2, 3, dp);
                    drawRoughLine(-s / 3, -s / 2, -s / 1.5, -s / 3, 2, 4, dp);
                    drawRoughLine(0, -s * 0.8, 0, -s * 1.2, 2, 3, dp);
                    drawRoughCircle(0, -s * 1.3, 8, 2, 3, dp);
                    drawRoughLine(0, -s, 15, -s * 0.9, 2, 3, dp);
                } else {
                    drawRoughCircle(0, -s + 10, 12, 2, 3, dp);
                    drawRoughLine(0, -s + 22, 0, -20, 2, 3, dp);

                    ctx.save(); ctx.translate(0, -20); ctx.rotate(legRot); drawRoughLine(0, 0, 0, 20, 2, 3, dp); ctx.restore();
                    ctx.save(); ctx.translate(0, -20); ctx.rotate(-legRot); drawRoughLine(0, 0, 0, 20, 2, 3, dp); ctx.restore();
                    ctx.save(); ctx.translate(0, -s / 1.5); ctx.rotate(armRot); drawRoughLine(0, 0, 20, 10, 2, 3, dp);

                    if (u.type === 'melee') {
                        drawRoughLine(20, 10, 30, -10, 4, 3, dp);
                    } else {
                        drawRoughCircle(25, 15, 5, 2, 3, dp);
                    }
                    ctx.restore();
                }
            } else if (u.age === 1) {
                if (u.type === 'heavy') {
                    drawRoughLine(-20, -s / 2, 20, -s / 2, 2, 8, dp);
                    drawRoughLine(20, -s / 2, 30, -s * 0.8, 2, 4, dp);
                    drawRoughLine(0, -s / 2, 0, -s, 2, 3, dp);
                    drawRoughLine(-10, -s, 10, -s, 2, 3, dp);
                    drawRoughCircle(0, -s - 10, 10, 2, 3, dp);

                    ctx.save(); ctx.translate(0, -s / 1.2); ctx.rotate(armRot); drawRoughLine(0, 0, 40, 0, 2, 2, dp); ctx.restore();
                } else {
                    drawRoughCircle(0, -s + 10, 10, 2, 3, dp);
                    drawRoughLine(-10, -s + 10, 10, -s + 10, 2, 3, dp);
                    drawRoughLine(0, -s + 20, 0, -20, 2, 3, dp);

                    ctx.save(); ctx.translate(0, -20); ctx.rotate(legRot); drawRoughLine(0, 0, 0, 20, 2, 3, dp); ctx.restore();
                    ctx.save(); ctx.translate(0, -20); ctx.rotate(-legRot); drawRoughLine(0, 0, 0, 20, 2, 3, dp); ctx.restore();
                    ctx.save(); ctx.translate(0, -s / 1.5); ctx.rotate(armRot); drawRoughLine(0, 0, 15, 10, 2, 3, dp);

                    if (u.type === 'melee') {
                        drawRoughLine(15, 10, 25, -15, 2, 1, dp);
                        drawRoughLine(5, -5, 5, 20, 3, 2, dp);
                    } else {
                        drawRoughLine(15, 10, 15, -20, 2, 3, dp);
                        drawRoughLine(15, -20, 25, 10, 2, 3, dp);
                    }
                    ctx.restore();
                }
            } else if (u.age === 2) {
                if (u.type === 'heavy') {
                    drawRoughCircle(0, -15, 15, 2, 3, dp);
                    drawRoughLine(-20, -15, 20, -15, 2, 2, dp);
                    ctx.save(); ctx.translate(0, -15); ctx.rotate(armRot * 0.2); drawRoughLine(-10, -10, 40, -15, 4, 2, dp); ctx.restore();
                } else {
                    drawRoughCircle(0, -s + 10, 10, 2, 3, dp);
                    drawRoughLine(-15, -s, 15, -s, 2, 3, dp);
                    drawRoughLine(0, -s + 20, 0, -20, 2, 3, dp);

                    ctx.save(); ctx.translate(0, -20); ctx.rotate(legRot); drawRoughLine(0, 0, 0, 20, 2, 3, dp); ctx.restore();
                    ctx.save(); ctx.translate(0, -20); ctx.rotate(-legRot); drawRoughLine(0, 0, 0, 20, 2, 3, dp); ctx.restore();
                    ctx.save(); ctx.translate(0, -s / 1.5); ctx.rotate(armRot); drawRoughLine(0, 0, 15, 5, 2, 3, dp);

                    if (u.type === 'melee') drawRoughLine(15, 5, 30, -25, 2, 2, dp);
                    else drawRoughLine(10, 5, 35, 0, 2, 1, dp);

                    ctx.restore();
                }
            } else if (u.age === 3) {
                if (u.type === 'heavy') {
                    drawRoughLine(-40, -10, 40, -10, 3, 2, dp);
                    drawRoughLine(-30, 0, 30, 0, 3, 2, dp);
                    fillScribble(-35, -25, 70, 15, COLORS.pencilLight, 5, dp);
                    ctx.save(); ctx.translate(0, -25); ctx.rotate(armRot * 0.1); drawRoughLine(0, -5, 50, -5, 3, 1, dp); ctx.restore();
                } else {
                    drawRoughCircle(0, -s + 10, 10, 2, 3, dp);
                    drawRoughLine(-12, -s + 5, 12, -s + 5, 2, 2, dp);
                    drawRoughLine(0, -s + 20, 0, -20, 2, 3, dp);

                    ctx.save(); ctx.translate(0, -20); ctx.rotate(legRot); drawRoughLine(0, 0, 0, 20, 2, 3, dp); ctx.restore();
                    ctx.save(); ctx.translate(0, -20); ctx.rotate(-legRot); drawRoughLine(0, 0, 0, 20, 2, 3, dp); ctx.restore();
                    ctx.save(); ctx.translate(0, -s / 1.5); ctx.rotate(armRot); drawRoughLine(0, 0, 15, 5, 2, 3, dp);

                    if (u.type === 'melee') drawRoughLine(15, 5, 25, -5, 2, 1, dp);
                    else drawRoughLine(10, 5, 30, 5, 3, 1, dp);

                    ctx.restore();
                }
            } else if (u.age === 4) {
                setSketchStyle(COLORS.blue, 2);
                if (u.type === 'heavy') {
                    drawRoughCircle(0, -s / 2, s / 2.5, 2, 4, dp);
                    fillScribble(-s / 3, -s * 0.8, s / 1.5, s / 1.5, COLORS.blue, 8, dp);
                    ctx.save(); ctx.translate(0, -s / 2); ctx.rotate(armRot); drawRoughLine(0, 0, 60, 0, 4, 1, dp); ctx.restore();
                } else {
                    drawRoughCircle(0, -s + 10, 10, 2, 3, dp);
                    drawRoughLine(-5, -s + 10, 10, -s + 10, 2, 3, dp);
                    drawRoughLine(0, -s + 20, 0, -20, 2, 3, dp);

                    ctx.save(); ctx.translate(0, -20); ctx.rotate(legRot); drawRoughLine(0, 0, 0, 20, 2, 3, dp); ctx.restore();
                    ctx.save(); ctx.translate(0, -20); ctx.rotate(-legRot); drawRoughLine(0, 0, 0, 20, 2, 3, dp); ctx.restore();
                    ctx.save(); ctx.translate(0, -s / 1.5); ctx.rotate(armRot); drawRoughLine(0, 0, 15, 5, 2, 3, dp);

                    if (u.type === 'melee') {
                        setSketchStyle(COLORS.accent, 2);
                        drawRoughLine(15, 5, 35, -15, 3, 1, dp);
                    } else drawRoughLine(10, 5, 30, 5, 3, 1, dp);

                    ctx.restore();
                }
            } else if (u.age === 5) {
                setSketchStyle(COLORS.accent, 2);
                if (u.type === 'heavy') {
                    drawRoughLine(-s / 2, -s / 2, s / 2, -s / 2, 3, 2, dp);
                    drawRoughLine(-s / 3, -s / 2, 0, -s, 3, 2, dp);
                    drawRoughLine(s / 3, -s / 2, 0, -s, 3, 2, dp);
                    fillScribble(-s / 4, -s * 0.8, s / 2, s / 2, COLORS.accent, 5, dp);
                    drawRoughCircle(0, -s / 2, 20, 2, 5, dp);
                } else if (u.type === 'melee') {
                    drawRoughLine(-20, -s / 2, 20, -s / 2, 3, 2, dp);
                    drawRoughCircle(0, -s / 2, 10, 2, 2, dp);
                    drawRoughLine(0, -s / 2, 15, -s / 2 + 10, 3, 2, dp);
                } else {
                    drawRoughLine(-15, -s / 2, 15, -s / 2, 2, 3, dp);
                    drawRoughLine(0, -s / 2, 30, -s / 2, 4, 1, dp);
                    fillScribble(-10, -s / 2 - 10, 20, 20, COLORS.accent, 3, dp);
                }
            }

            // Health Bars (Drawn slightly below units)
            if (u.drawProgress >= 1) {
                setSketchStyle(COLORS.pencil, 1);
                drawRoughLine(-15, -s - 20, 15, -s - 20, 1, 1);
                setSketchStyle(COLORS.green, 2);
                if (u.hp > 0) drawRoughLine(-15, -s - 20, -15 + (30 * (u.hp / u.maxHp)), -s - 20, 2, 1);
            }
            ctx.restore();
        }

        function drawProjectile(p) {
            ctx.save();

            // Lasers / Orbital Beams
            if (p.type === 'laser' || p.type === 'orbital') {
                let alpha = p.life > 0.5 ? 1 : p.life * 2;
                ctx.globalAlpha = alpha;

                if (p.type === 'laser') {
                    setSketchStyle(p.team === 1 ? COLORS.blue : COLORS.accent, 3);
                    let w = Math.min(150, (5 - p.life) * 50);
                    fillScribble(p.x - w / 2, 0, w, CANVAS_HEIGHT, p.team === 1 ? COLORS.blue : COLORS.accent, 15);
                    drawRoughLine(p.x - w / 2, 0, p.x - w / 2, CANVAS_HEIGHT, 3, 10);
                    drawRoughLine(p.x + w / 2, 0, p.x + w / 2, CANVAS_HEIGHT, 3, 10);
                } else {
                    setSketchStyle(COLORS.darkVoid, 4);
                    drawRoughCircle(p.x, p.y - 400, 150, 4, 30);
                    fillScribble(p.x - 150, p.y - 550, 300, 300, COLORS.darkVoid, 15);

                    setSketchStyle(COLORS.accent, 2);
                    for (let i = 0; i < 5; i++) drawRoughCircle(p.x, p.y - 400, 50 + i * 20 + Math.sin(globalTime * 5) * 10, 1, 10);
                    for (let i = 0; i < 10; i++) drawRoughLine(p.x + (Math.random() - 0.5) * 400, GROUND_Y, p.x, p.y - 400, 1, 5);
                }
                ctx.globalAlpha = 1.0;
                ctx.restore();
                return;
            }

            // Standard Projectile Trails
            if (p.trailCount > 1) {
                setSketchStyle(COLORS.pencilLight, 1);
                ctx.beginPath();
                ctx.moveTo(p.trailX[0], p.trailY[0]);
                for (let i = 1; i < p.trailCount; i++) ctx.lineTo(p.trailX[i], p.trailY[i]);
                ctx.stroke();
            }

            ctx.translate(p.x, p.y);
            let angle = Math.atan2(p.vy, p.vx);
            ctx.rotate(angle);
            setSketchStyle(COLORS.pencil, 2);

            if (p.type === 'meteor') {
                setSketchStyle(COLORS.fire, 3);
                drawRoughCircle(0, 0, 15, 3, 5);
                fillScribble(-30, -10, 30, 20, COLORS.fire, 4);
                drawRoughLine(0, 5, -50, 20, 2, 5);
                drawRoughLine(0, -5, -50, -20, 2, 5);
            } else if (p.type === 'arrow') {
                drawRoughLine(-15, 0, 10, 0, 1, 1);
                drawRoughLine(5, -5, 10, 0, 1, 1);
                drawRoughLine(5, 5, 10, 0, 1, 1);
            } else if (p.type === 'cannonball') {
                drawRoughCircle(0, 0, 10, 3, 2);
                fillScribble(-10, -10, 20, 20, COLORS.pencil, 3);
            } else if (p.type === 'bombDrop') {
                ctx.rotate(-angle + Math.PI / 2);
                drawRoughCircle(0, 10, 8, 2, 2);
                drawRoughLine(0, 10, 0, -15, 2, 2);
                drawRoughLine(-10, -15, 10, -15, 2, 2);
            } else if (p.type === 'arc') {
                if (p.speed > 450) {
                    drawRoughLine(-15, 0, 10, 0, 1, 1);
                    drawRoughLine(-15, -5, -15, 5, 1, 1);
                } else {
                    drawRoughCircle(0, 0, p.dmg > 100 ? 8 : 4, 2, 2);
                }
            } else if (p.type === 'straight') {
                drawRoughLine(-10, 0, 10, 0, 2, 1);
            } else if (p.type === 'laser') {
                setSketchStyle(p.team === 1 ? COLORS.blue : COLORS.accent, 3);
                ctx.rotate(-angle);
                drawRoughLine(0, 0, p.targetX - p.x, p.targetY - p.y, 1, 3);
            } else if (p.type === 'orb') {
                setSketchStyle(COLORS.accent, 2);
                drawRoughCircle(0, 0, 15 + Math.sin(p.life * 20) * 5, 3, 5);
            }
            ctx.restore();
        }
    </script>
