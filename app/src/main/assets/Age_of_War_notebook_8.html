<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ebe3d5">
    <title>Age of War: Sketchbook Edition 1.0</title>
    <link rel="manifest" href="manifest.webmanifest">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Patrick+Hand&display=swap');

        /* CSS Variables - Dynamic Transition System */
        :root {
            --background: 39 35% 90%;
            --foreground: 25 15% 20%;
            --card: 39 40% 95%;
            --primary: 25 20% 25%;
            --secondary: 35 25% 85%;
            --accent: 18 60% 55%;
            --destructive: 0 65% 50%;
            --muted-foreground: 25 10% 45%;
            --pencil: 25 15% 25%;
            --pencil-light: 25 10% 55%;

            /* Difficulty Colors */
            --diff-normal: 25 15% 25%;
            --diff-hard: 200 45% 45%;
            --diff-harder: 30 80% 50%;
            --diff-impossible: 0 65% 50%;
        }

        /* Resets & Base Styles */
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
            font-family: 'Patrick Hand', 'Comic Sans MS', 'Segoe Print', cursive;
            overflow: hidden;
            touch-action: none;
            transition: background-color 2s ease, color 2s ease;
        }

        /* Visual Elements & Realism */
        .sketchbook-spine {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 40px;
            background: linear-gradient(to right, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0.05) 80%, transparent 100%);
            border-right: 2px dashed hsl(var(--pencil-light) / 0.4);
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
        }

        .ring-hole {
            width: 15px;
            height: 15px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.8), 1px 1px 1px rgba(255, 255, 255, 0.2);
        }

        .paper-texture {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
            box-shadow: inset 0 0 150px rgba(0, 0, 0, 0.1);
            transition: opacity 2s ease;
        }

        .coffee-stain {
            position: absolute;
            width: 200px;
            height: 200px;
            right: 5%;
            bottom: 10%;
            pointer-events: none;
            background: radial-gradient(circle, transparent 40%, rgba(139, 69, 19, 0.05) 50%, rgba(139, 69, 19, 0.15) 55%, transparent 60%);
            border-radius: 50%;
            filter: blur(2px);
            transform: scaleY(0.8) rotate(15deg);
            z-index: 0;
        }

        .notebook-lines {
            background-image: repeating-linear-gradient(transparent, transparent 31px,
                    hsl(var(--pencil-light) / 0.15) 31px, hsl(var(--pencil-light) / 0.15) 32px);
            background-position-y: 8px;
        }

        .sketchy-border {
            border: 2px solid hsl(var(--pencil));
            border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
            box-shadow: 3px 4px 0px hsl(var(--pencil) / 0.15);
            transition: border-color 2s ease, box-shadow 2s ease;
        }

        .sketchy-border-thin {
            border: 1.5px solid hsl(var(--pencil-light));
            border-radius: 15px 225px 15px 255px / 255px 15px 225px 15px;
            transition: border-color 2s ease;
        }

        .torn-paper {
            clip-path: polygon(0% 2%, 3% 0%, 7% 3%, 11% 1%, 15% 2%, 19% 0%, 23% 2%, 27% 1%, 31% 3%, 35% 0%, 39% 2%, 43% 1%, 47% 3%, 51% 0%, 55% 2%, 59% 1%, 63% 0%, 67% 3%, 71% 1%, 75% 2%, 79% 0%, 83% 3%, 87% 1%, 91% 2%, 95% 0%, 100% 2%, 100% 98%, 97% 100%, 93% 97%, 89% 100%, 85% 98%, 81% 100%, 77% 97%, 73% 100%, 69% 98%, 65% 100%, 61% 97%, 57% 100%, 53% 98%, 49% 100%, 45% 97%, 41% 100%, 37% 98%, 33% 100%, 29% 97%, 25% 100%, 21% 98%, 17% 100%, 13% 97%, 9% 100%, 5% 98%, 0% 100%);
            background-color: hsl(var(--card));
            transition: background-color 2s ease;
        }

        /* Typography & Animations */
        .font-sketch {
            font-family: 'Caveat', 'Comic Sans MS', 'Segoe Print', cursive;
        }

        .font-hand {
            font-family: 'Patrick Hand', 'Comic Sans MS', 'Segoe Print', cursive;
        }

        @keyframes subtleFloat {

            0%,
            100% {
                transform: translateY(0) rotate(-1deg);
            }

            50% {
                transform: translateY(-4px) rotate(1deg);
            }
        }

        @keyframes pulseAlert {

            0%,
            100% {
                transform: scale(1);
                filter: brightness(1);
            }

            50% {
                transform: scale(1.05);
                filter: brightness(1.2);
            }
        }

        @keyframes scribbleIn {
            0% {
                opacity: 0;
                transform: translateY(8px) rotate(-1deg);
            }

            100% {
                opacity: 1;
                transform: translateY(0) rotate(0deg);
            }
        }

        .title-float {
            animation: subtleFloat 4s ease-in-out infinite;
        }

        .pulse-alert {
            animation: pulseAlert 1.5s infinite;
            color: hsl(var(--accent));
        }

        /* Layout */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        #aspect-wrapper {
            position: relative;
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;
            background: transparent;
            overflow: hidden;
        }

        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            z-index: 2;
        }

        /* UI Panel structure */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1vw 1vw 1vw 45px;
            z-index: 10;
        }

        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            background: hsl(var(--card) / 0.95);
            height: 19%;
            pointer-events: auto;
            padding: 1vw;
            position: relative;
            backdrop-filter: blur(4px);
        }

        /* Stats Panel */
        #stats-panel {
            width: 22%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0.5vw;
            position: relative;
            margin-left: 2vw;
        }

        .stat-line {
            font-size: 2.3vmin;
            color: hsl(var(--foreground));
            line-height: 1.2;
            font-weight: bold;
        }

        .stat-val {
            font-family: 'Caveat', 'Comic Sans MS', 'Segoe Print', cursive;
            font-size: 3vmin;
            text-shadow: 1px 1px 0px rgba(0, 0, 0, 0.1);
        }

        .text-gold {
            color: #b8860b;
        }

        .text-xp {
            color: #4682b4;
        }

        /* Top Left Actions (Badge & Pause) */
        #top-left-actions {
            position: absolute;
            top: -10px;
            left: -10px;
            display: flex;
            flex-direction: column;
            gap: 0.5vw;
            z-index: 20;
            transform: rotate(-3deg);
        }

        #diff-badge {
            font-size: 1.8vmin;
            padding: 4px 12px;
            border-radius: 4px;
            font-weight: bold;
            color: white;
            box-shadow: 2px 3px 6px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        #btn-pause {
            background: hsl(var(--card));
            font-size: 1.8vmin;
            padding: 4px 12px;
            cursor: pointer;
            color: hsl(var(--foreground));
            box-shadow: 2px 3px 6px rgba(0, 0, 0, 0.25);
            transition: all 0.2s;
        }

        #btn-pause:hover {
            transform: scale(1.05);
        }

        /* Center Panel */
        #center-panel {
            width: 30%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        #age-title {
            font-size: 4vmin;
            color: hsl(var(--primary));
            text-transform: capitalize;
            font-weight: bold;
        }

        .center-btns {
            display: flex;
            gap: 1vw;
            width: 100%;
            height: 60%;
        }

        /* Action Panel */
        #action-panel {
            width: 45%;
            display: flex;
            flex-direction: column;
        }

        #tabs {
            display: flex;
            justify-content: flex-end;
            gap: 0.5vw;
            height: 30%;
        }

        .tab-btn {
            background: transparent;
            color: hsl(var(--muted-foreground));
            font-family: 'Caveat', 'Comic Sans MS', 'Segoe Print', cursive;
            font-size: 2.5vmin;
            border: none;
            cursor: pointer;
            padding: 0 1vw;
            font-weight: bold;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: auto;
        }

        .tab-btn.active {
            color: hsl(var(--foreground));
            border-bottom: 3px solid hsl(var(--accent));
            transform: translateY(-3px) scale(1.05);
        }

        .tab-btn:hover:not(.active) {
            color: hsl(var(--pencil));
            transform: translateY(-1px);
        }

        #build-menu {
            display: flex;
            gap: 1vw;
            height: 70%;
            justify-content: flex-end;
            align-items: center;
        }

        /* General Buttons */
        .btn {
            background: hsl(var(--secondary) / 0.5);
            color: hsl(var(--foreground));
            font-family: 'Patrick Hand', 'Comic Sans MS', 'Segoe Print', cursive;
            font-size: 2.1vmin;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex: 1;
            max-width: 11vw;
            height: 100%;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: auto;
            position: relative;
        }

        .btn:hover:not(:disabled) {
            background: hsl(var(--secondary));
            transform: scale(1.04) rotate(1.5deg);
            box-shadow: 2px 4px 8px rgba(0, 0, 0, 0.1);
        }

        .btn:active:not(:disabled) {
            transform: scale(0.96);
            box-shadow: 0px 1px 2px rgba(0, 0, 0, 0.1);
        }

        .btn:disabled {
            opacity: 0.4;
            filter: grayscale(1);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-cost {
            font-family: 'Caveat', 'Comic Sans MS', 'Segoe Print', cursive;
            font-weight: bold;
            font-size: 2.2vmin;
            margin-top: 2px;
        }

        .btn-evolve {
            background: hsl(var(--accent) / 0.15);
            border-color: hsl(var(--accent));
            color: hsl(var(--accent));
        }

        .btn-special {
            background: hsl(var(--destructive) / 0.1);
            border-color: hsl(var(--destructive));
            color: hsl(var(--destructive));
        }

        .upgrade-val {
            font-size: 1.6vmin;
            color: hsl(var(--muted-foreground));
            line-height: 1;
        }

        /* Tooltip System */
        #tooltip {
            position: absolute;
            pointer-events: none;
            z-index: 100;
            background: hsl(var(--card) / 0.95);
            backdrop-filter: blur(4px);
            padding: 1vw;
            max-width: 20vw;
            transform: translate(-50%, 10px);
            opacity: 0;
            transition: opacity 0.2s;
            box-shadow: 4px 6px 12px rgba(0, 0, 0, 0.15);
        }

        #tooltip.visible {
            opacity: 1;
        }

        .tt-title {
            font-size: 2.5vmin;
            font-weight: bold;
            font-family: 'Caveat', 'Comic Sans MS', 'Segoe Print', cursive;
            color: hsl(var(--primary));
            margin-bottom: 0.5vmin;
            border-bottom: 1px dashed hsl(var(--pencil-light));
            padding-bottom: 2px;
        }

        .tt-stat {
            font-size: 1.8vmin;
            color: hsl(var(--foreground));
            display: flex;
            justify-content: space-between;
            margin-bottom: 2px;
        }

        .tt-desc {
            font-size: 1.6vmin;
            color: hsl(var(--muted-foreground));
            margin-top: 1vmin;
            font-style: italic;
        }

        /* Commander HUD: base health, player prompt, and director response */
        #commander-hud {
            position: absolute;
            width: calc(100% - 40px);
            left: 40px;
            top: 21.5%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 0 2vw;
            gap: 2vw;
            pointer-events: none;
            z-index: 30;
        }

        .commander-col {
            width: clamp(12rem, 27vw, 25rem);
            display: flex;
            flex-direction: column;
            gap: 0.7vmin;
            position: relative;
            pointer-events: none;
        }

        .hp-wrapper {
            position: relative;
            width: 100%;
            height: 3.5vmin;
            background: hsl(var(--card));
            padding: 2px;
            box-shadow: 2px 3px 0px rgba(0, 0, 0, 0.1);
            pointer-events: none;
        }

        .hp-fill {
            height: 100%;
            background: repeating-linear-gradient(45deg, hsl(120, 50%, 60%), hsl(120, 50%, 60%) 10px, hsl(120, 50%, 50%) 10px, hsl(120, 50%, 50%) 20px);
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #enemy-hp-fill {
            background: repeating-linear-gradient(-45deg, hsl(0, 60%, 60%), hsl(0, 60%, 60%) 10px, hsl(0, 60%, 50%) 10px, hsl(0, 60%, 50%) 20px);
            float: right;
        }

        .hp-text {
            position: absolute;
            width: 100%;
            text-align: center;
            top: 0;
            font-size: 2.5vmin;
            font-family: 'Caveat', 'Comic Sans MS', 'Segoe Print', cursive;
            font-weight: bold;
            color: hsl(var(--foreground));
            text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.7);
        }

        .director-writing {
            position: relative;
            pointer-events: auto;
            color: hsl(var(--pencil));
            text-shadow: 0.5px 0.5px 0 hsl(var(--background) / 0.7);
        }

        .player-writing {
            min-height: 5.2vmin;
            padding: 0.2vmin 0.35vmin 0;
        }

        .ai-writing {
            min-height: 12.5vmin;
            padding: 0.2vmin 0.35vmin 0;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            text-align: right;
        }

        #director-form {
            display: block;
        }

        #player-last-line {
            min-height: 2.35vmin;
            color: hsl(var(--pencil) / 0.76);
            font-family: 'Caveat', 'Comic Sans MS', 'Segoe Print', cursive;
            font-size: 2.05vmin;
            font-weight: bold;
            line-height: 1.08;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
        }

        .player-last-text {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            min-width: 0;
            white-space: nowrap;
        }

        .player-last-message {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .player-last-seen {
            flex: 0 0 auto;
            font-family: 'Patrick Hand', 'Comic Sans MS', 'Segoe Print', cursive;
            font-size: 1.25vmin;
            line-height: 1;
            border: 1px dashed hsl(var(--pencil-light) / 0.62);
            border-radius: 999px;
            padding: 0.03rem 0.32rem;
            text-transform: lowercase;
            letter-spacing: 0.01em;
        }

        .player-last-seen.is-pending {
            color: hsl(var(--muted-foreground) / 0.9);
            background: hsl(var(--background) / 0.72);
        }

        .player-last-seen.is-seen {
            color: hsl(var(--accent));
            border-color: hsl(var(--accent) / 0.58);
            background: hsl(var(--accent) / 0.14);
        }

        .director-input-row {
            display: flex;
            align-items: flex-end;
            gap: 0.25rem;
            border-bottom: 1.5px dashed hsl(var(--pencil-light) / 0.72);
        }

        #director-input {
            flex: 1;
            min-width: 0;
            border: none;
            background: transparent;
            outline: none;
            color: hsl(var(--pencil));
            font-family: 'Caveat', 'Comic Sans MS', 'Segoe Print', cursive;
            font-size: 2.45vmin;
            font-weight: bold;
            line-height: 1;
            padding: 0 0 0.15vmin;
        }

        #director-input:focus {
            color: hsl(var(--foreground));
        }

        #director-input::placeholder {
            color: hsl(var(--pencil-light) / 0.78);
            font-style: normal;
        }

        #director-form button {
            flex: 0 0 auto;
            width: 2.1rem;
            min-height: 2rem;
            border: none;
            background: transparent;
            color: hsl(var(--pencil));
            font-family: 'Caveat', 'Comic Sans MS', 'Segoe Print', cursive;
            font-size: 2.8vmin;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
            padding: 0;
            transform: rotate(-5deg);
            transition: transform 0.12s, color 0.12s;
        }

        #director-form button:hover {
            color: hsl(var(--accent));
            transform: scale(1.12) rotate(0deg);
        }

        #gemma-card {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.35rem;
            min-height: 1.35vmin;
            margin-top: 0.15vmin;
        }

        #gemma-status {
            min-width: 0;
            color: hsl(var(--muted-foreground) / 0.82);
            font-family: 'Patrick Hand', 'Comic Sans MS', 'Segoe Print', cursive;
            font-size: 1.25vmin;
            line-height: 1;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #gemma-card button {
            flex: 0 0 auto;
            border: none;
            background: transparent;
            color: hsl(var(--accent));
            font-family: 'Caveat', 'Comic Sans MS', 'Segoe Print', cursive;
            font-size: 1.65vmin;
            font-weight: bold;
            cursor: pointer;
            padding: 0;
            text-decoration: underline;
            text-decoration-thickness: 1px;
        }

        #gemma-card button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            text-decoration: none;
        }

        #director-memory {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
            justify-content: flex-end;
            min-height: 1.45vmin;
            margin-bottom: 0.2vmin;
        }

        .memory-chip {
            color: hsl(var(--muted-foreground) / 0.85);
            font-family: 'Caveat', 'Comic Sans MS', 'Segoe Print', cursive;
            font-size: 1.55vmin;
            font-weight: bold;
            line-height: 1;
            text-decoration: underline;
            text-decoration-color: hsl(var(--pencil-light) / 0.45);
            text-decoration-thickness: 1px;
        }

        #director-log {
            min-height: 5.6vmin;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: flex-start;
            overflow: hidden;
        }

        .director-msg {
            max-width: 100%;
            color: hsl(var(--pencil));
            font-family: 'Caveat', 'Comic Sans MS', 'Segoe Print', cursive;
            font-size: 2.35vmin;
            font-weight: bold;
            line-height: 1.08;
            word-break: break-word;
            user-select: text;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .director-msg.has-thoughts {
            display: block;
            overflow: visible;
            cursor: pointer;
            -webkit-line-clamp: unset;
            text-align: right;
        }

        .director-msg-main {
            display: flex;
            justify-content: flex-end;
            align-items: baseline;
            gap: 0.35rem;
            min-width: 0;
        }

        .director-msg-text {
            min-width: 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }

        .director-thought-toggle {
            flex: 0 0 auto;
            border: 1px dashed hsl(var(--pencil-light) / 0.58);
            background: hsl(var(--background) / 0.5);
            color: hsl(var(--pencil-light));
            font-family: 'Patrick Hand', 'Comic Sans MS', 'Segoe Print', cursive;
            font-size: 1.35vmin;
            line-height: 1;
            padding: 0 0.25rem 0.08rem;
            cursor: pointer;
        }

        .director-msg.has-thoughts.thoughts-open .director-thought-toggle {
            color: hsl(var(--accent));
            border-color: hsl(var(--accent) / 0.58);
        }

        .director-thought-panel {
            max-height: 0;
            margin-top: 0;
            overflow: hidden;
            border-top: 1px dashed transparent;
            opacity: 0;
            transition: max-height 0.2s ease, opacity 0.2s ease, margin-top 0.2s ease;
        }

        .director-msg.has-thoughts.thoughts-open .director-thought-panel {
            max-height: 3.4vmin;
            margin-top: 0.25vmin;
            border-color: hsl(var(--pencil-light) / 0.5);
            opacity: 1;
        }

        .director-thought-viewport {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
        }

        .director-thought-track {
            display: inline-block;
            min-width: 100%;
            color: hsl(var(--muted-foreground) / 0.9);
            font-family: 'Patrick Hand', 'Comic Sans MS', 'Segoe Print', cursive;
            font-size: 1.45vmin;
            line-height: 1.12;
            white-space: nowrap;
            animation: thoughtRoll 18s linear infinite;
        }

        @keyframes thoughtRoll {
            0% {
                transform: translateX(18%);
            }

            100% {
                transform: translateX(-100%);
            }
        }

        #director-tool-log {
            min-height: 2.35vmin;
            max-height: 2.35vmin;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: flex-start;
            overflow: hidden;
            margin-top: 0.25vmin;
        }

        .director-tool-msg {
            max-width: 100%;
            color: hsl(var(--muted-foreground) / 0.86);
            font-family: 'Patrick Hand', 'Comic Sans MS', 'Segoe Print', cursive;
            font-size: 1.65vmin;
            line-height: 1.12;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            user-select: text;
        }

        .is-writing {
            clip-path: inset(0 100% 0 0);
            animation: pencilWrite 0.48s steps(18, end) forwards;
        }

        .ai-writing .is-writing {
            clip-path: inset(0 0 0 100%);
            animation-name: pencilWriteRight;
        }

        .is-erasing {
            animation: pencilErase 0.2s ease forwards;
        }

        @keyframes pencilWrite {
            0% {
                opacity: 0.2;
                clip-path: inset(0 100% 0 0);
                filter: blur(0.4px);
            }

            100% {
                opacity: 1;
                clip-path: inset(0 0 0 0);
                filter: blur(0);
            }
        }

        @keyframes pencilWriteRight {
            0% {
                opacity: 0.2;
                clip-path: inset(0 0 0 100%);
                filter: blur(0.4px);
            }

            100% {
                opacity: 1;
                clip-path: inset(0 0 0 0);
                filter: blur(0);
            }
        }

        @keyframes pencilErase {
            0% {
                opacity: 1;
                filter: blur(0);
                transform: translateY(0);
            }

            100% {
                opacity: 0;
                filter: blur(1px);
                transform: translateY(-0.2vmin);
            }
        }

        /* Game Over / Start Screens */
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: hsl(var(--background) / 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 50;
            text-align: center;
            backdrop-filter: blur(8px);
            transition: opacity 0.5s;
        }

        .overlay-content {
            width: 70%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4vw;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E"), hsl(var(--card));
        }

        .overlay-screen h1 {
            font-size: 10vmin;
            font-family: 'Caveat', 'Comic Sans MS', 'Segoe Print', cursive;
            color: hsl(var(--foreground));
            margin-bottom: 1vmin;
            text-shadow: 3px 3px 0px hsl(var(--pencil-light)/0.3);
        }

        .overlay-screen p {
            font-size: 3.5vmin;
            margin-bottom: 3vmin;
            color: hsl(var(--muted-foreground));
            line-height: 1.4;
        }

        /* Difficulty Grid Menu */
        .difficulty-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2vw;
            width: 100%;
            margin-top: 2vmin;
        }

        .diff-btn {
            font-size: 3.5vmin;
            padding: 1.5vw;
            color: hsl(var(--card));
            cursor: pointer;
            font-family: 'Caveat', 'Comic Sans MS', 'Segoe Print', cursive;
            font-weight: bold;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .diff-btn:hover {
            transform: scale(1.05) rotate(-2deg);
            box-shadow: 4px 6px 0px hsl(var(--pencil)/0.2);
        }

        .diff-normal {
            background: hsl(var(--diff-normal));
        }

        .diff-hard {
            background: hsl(var(--diff-hard));
        }

        .diff-harder {
            background: hsl(var(--diff-harder));
        }

        .diff-impossible {
            background: hsl(var(--diff-impossible));
        }

        .medal-icon {
            position: absolute;
            top: -10px;
            right: -10px;
            font-size: 3vmin;
            filter: drop-shadow(2px 2px 1px rgba(0, 0, 0, 0.3));
            display: none;
        }

        .beaten .medal-icon {
            display: block;
            animation: subtleFloat 3s infinite;
        }

        .hidden {
            display: none !important;
        }

        .fade-out {
            opacity: 0;
            pointer-events: none;
        }

        /* Preloader */
        #preloader {
            position: absolute;
            z-index: 100;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: hsl(var(--background));
        }

        .loader-brush {
            font-size: 3vmin;
            margin-top: 10px;
            font-family: 'Caveat', 'Comic Sans MS', 'Segoe Print', cursive;
            color: hsl(var(--accent));
            animation: pulseAlert 1s infinite;
        }

        #loading-bar-wrap {
            width: 40vw;
            height: 10px;
            background: hsl(var(--pencil-light)/0.3);
            margin-top: 2vmin;
            border-radius: 5px;
            overflow: hidden;
        }

        #loading-bar {
            height: 100%;
            width: 0%;
            background: hsl(var(--accent));
            transition: width 0.2s;
        }

        #pause-overlay {
            z-index: 60;
        }

        @media (max-width: 900px),
        (max-height: 520px) {
            #commander-hud {
                top: 21%;
                padding: 0 1.2vw;
                gap: 1vw;
            }

            .commander-col {
                width: clamp(10rem, 30vw, 19rem);
                gap: 0.5vmin;
            }

            .director-writing {
                padding-left: 0.15vmin;
                padding-right: 0.15vmin;
            }

            #gemma-status,
            #gemma-card button {
                font-size: 1.5vmin;
            }

            #director-log {
                min-height: 5vmin;
            }

            #director-tool-log {
                min-height: 2.5vmin;
                max-height: 2.5vmin;
            }
        }

        @media (max-height: 460px) {
            #director-memory {
                display: none;
            }
        }
    </style>
</head>

<body>

                            <button class="btn menu-upgrade hidden sketchy-border-thin" id="btn-up-hp"

                <div id="commander-hud" aria-live="polite">

            <div id="start-screen" class="overlay-screen">
                <div class="overlay-content torn-paper sketchy-border">

    <script>
        /**
         * AGE OF WAR - SKETCHBOOK EDITION v1.0.8 (Gemma 4 vision backend)
         * Fully Audited & Expanded: 
         * - Fixed Timestep Game Loop (1/60s step deterministic collision & physics)
         * - Codex Director AI styled as an immersive legal-pad slider
         * - Persistent LocalStorage (Tracks beaten difficulties and director agreements)
         * - Tooltip Hover System (Displays comprehensive unit/turret stats on hover)
         * - Procedural Watercolor Wash Engine (RESTORED Iteration 1 Multiply Blending)
         * - Expanded Object Pools to prevent exhaustion on "Impossible" late game
         */

        // Context without {alpha: false} or desynchronized to ensure perfect blending of CSS and Canvas
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const RELEASE_VERSION = '1.0.8';
        const LOCAL_GEMMA_IMAGE_INPUT_ENABLED = true;
        const CANVAS_WIDTH = 1280;
        const CANVAS_HEIGHT = 720;
        const GROUND_Y = 600;
        const BASE_WIDTH = 180;
        const HIT_TOLERANCE = 40;

        // Fixed Physics Timestep configuration
        const FIXED_DT = 1 / 60;
        let accumulator = 0;

        // Color Palette with Age-Theming capability
        const COLORS = {
            pencil: "hsl(25, 15%, 25%)",
            pencilLight: "hsl(25, 10%, 55%)",
            accent: "hsl(18, 60%, 55%)",
            destructive: "hsl(0, 65%, 50%)",
            gold: "#b8860b",
            blue: "hsl(200, 45%, 55%)",
            green: "hsl(120, 40%, 40%)",
            fire: "hsl(15, 80%, 60%)",
            darkVoid: "hsl(260, 40%, 20%)"
        };

        const UPGRADE_COSTS = [500, 1500, 3500, 8000, 18000, 35000, 75000, 150000, 350000, 750000];

        // --- ADVANCED DIFFICULTY SETTINGS ---
        const DIFFICULTY_SETTINGS = {
            'normal': {
                name: "Normal", color: "hsl(var(--diff-normal))",
                hpMult: 1.0, dmgMult: 1.0, econMult: 1.0, xpMult: 1.0,
                baseGold: 175, baseHpMult: 1.0, thinkRate: 2.5,
                aiAggression: 0.2 // Spends slower, saves up
            },
            'hard': {
                name: "Hard", color: "hsl(var(--diff-hard))",
                hpMult: 1.2, dmgMult: 1.1, econMult: 1.4, xpMult: 1.2,
                baseGold: 250, baseHpMult: 1.2, thinkRate: 1.5,
                aiAggression: 0.5
            },
            'harder': {
                name: "Harder", color: "hsl(var(--diff-harder))",
                hpMult: 1.5, dmgMult: 1.3, econMult: 2.0, xpMult: 1.5,
                baseGold: 500, baseHpMult: 1.5, thinkRate: 0.8,
                aiAggression: 0.8 // Actively upgrades, pushes aggressively
            },
            'impossible': {
                name: "Impossible", color: "hsl(var(--diff-impossible))",
                hpMult: 2.0, dmgMult: 1.5, econMult: 4.0, xpMult: 2.5,
                baseGold: 1500, baseHpMult: 2.0, thinkRate: 0.3,
                aiAggression: 1.0 // Unrelenting unit spam, maxes economy ASAP
            }
        };

        let currentDifficulty = 'normal';
        let currentConfig = DIFFICULTY_SETTINGS['normal'];

        // --- LOCAL STORAGE MANAGER ---
        const StorageManager = {
            key: 'aow_sketch_progress',
            data: { beaten: [] },
            init() {
                try {
                    let stored = localStorage.getItem(this.key);
                    if (stored) this.data = JSON.parse(stored);
                } catch (e) { console.warn("Local storage blocked"); }
                if (!this.data || !Array.isArray(this.data.beaten)) this.data = { beaten: [] };
                this.updateUI();
            },
            saveWin(diffKey) {
                if (!this.data.beaten.includes(diffKey)) {
                    this.data.beaten.push(diffKey);
                    try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) { }
                }
            },
            updateUI() {
                ['normal', 'hard', 'harder', 'impossible'].forEach(d => {
                    if (this.data.beaten.includes(d)) {
                        let btn = document.getElementById(`diff-btn-${d}`);
                        if (btn) btn.classList.add('beaten');
                    }
                });
            }
        };

        // --- CODEX DIRECTOR MEMORY ---
        const DirectorMemory = {
            key: 'aow_sketch_director_memory_v1',
            data: {
                notes: [],
                agreements: { noSpecials: false, noTurrets: false, meleeOnly: false, pressure: 'balanced' }
            },
            init() {
                try {
                    let stored = localStorage.getItem(this.key);
                    if (stored) {
                        let parsed = JSON.parse(stored);
                        this.data.notes = Array.isArray(parsed.notes) ? parsed.notes.slice(-8) : [];
                        this.data.agreements = Object.assign({}, this.data.agreements, parsed.agreements || {});
                    }
                } catch (e) { console.warn("Director memory blocked"); }
            },
            save() {
                try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) { }
            },
            setAgreement(key, value) {
                this.data.agreements[key] = value;
                this.save();
            },
            setPressure(value) {
                this.data.agreements.pressure = value;
                this.save();
            },
            addNote(note) {
                let clean = String(note || '').trim().slice(0, 90);
                if (!clean) return;
                this.data.notes = this.data.notes.filter(n => n.toLowerCase() !== clean.toLowerCase());
                this.data.notes.push(clean);
                this.data.notes = this.data.notes.slice(-8);
                this.save();
            },
            clear() {
                this.data = {
                    notes: [],
                    agreements: { noSpecials: false, noTurrets: false, meleeOnly: false, pressure: 'balanced' }
                };
                this.save();
            },
            tags() {
                let a = this.data.agreements;
                let tags = [`pressure: ${a.pressure}`];
                if (a.noSpecials) tags.push('no specials');
                if (a.noTurrets) tags.push('no turrets');
                if (a.meleeOnly) tags.push('melee only');
                this.data.notes.forEach(note => tags.push(`note: ${note}`));
                return tags;
            }
        };

        // --- 6 FULL AGES ARCHITECTURE ---
        const AGES = [
            {
                name: "Stone Age", evolveXP: 400, baseHp: 500, baseStyle: "cave",
                theme: { bg: "39 35% 90%", fg: "25 15% 20%", accent: "18 60% 55%" },
                special: { name: "Meteor Shower", cooldown: 60, duration: 4, type: "meteor" },
                units: [
                    { name: "Clubman", desc: "Cheap melee fodder.", cost: 15, hp: 30, dmg: 8, range: 40, speed: 50, type: 'melee', size: 45, attackSpeed: 1.2, killXp: 5, killGold: 10 },
                    { name: "Slinger", desc: "Basic ranged support.", cost: 25, hp: 20, dmg: 5, range: 250, speed: 45, type: 'ranged', size: 40, attackSpeed: 1.5, projType: 'arc', projSpeed: 400, killXp: 8, killGold: 15 },
                    { name: "Dino Rider", desc: "Heavy pushing power.", cost: 100, hp: 150, dmg: 35, range: 50, speed: 70, type: 'heavy', size: 80, attackSpeed: 2.0, killXp: 30, killGold: 50 }
                ],

        // --- PROCEDURAL WATERCOLOR ENGINE (RESTORED TO ITERATION 1) ---
        const WatercolorEngine = {
            canvases: [],
            generateAll() {
                return new Promise(resolve => {
                    let index = 0;
                    const bar = document.getElementById('loading-bar');

                    const step = () => {
                        if (index < AGES.length) {
                            this.canvases.push(this.renderWash(index));
                            if (bar) bar.style.width = `${((index + 1) / AGES.length) * 100}%`;
                            index++;
                            requestAnimationFrame(step);
                        } else {
                            resolve();
                        }
                    };
                    step();
                });
            },
            renderWash(ageIndex) {
                const wc = document.createElement('canvas');
                wc.width = CANVAS_WIDTH; wc.height = CANVAS_HEIGHT;

                // Exact Iteration 1 implementation (No alpha:false, source-over blending)
                const xctx = wc.getContext('2d');
                xctx.globalCompositeOperation = 'source-over';

                const theme = AGES[ageIndex].theme;
                let hslBg = `hsl(${theme.bg})`;
                let hslAcc = `hsl(${theme.accent})`;

                for (let i = 0; i < 45; i++) {
                    let isCorner = Math.random() > 0.3;
                    let cx = isCorner ? (Math.random() > 0.5 ? Math.random() * 400 : CANVAS_WIDTH - Math.random() * 400) : Math.random() * CANVAS_WIDTH;
                    let cy = isCorner ? (Math.random() > 0.5 ? Math.random() * 300 : CANVAS_HEIGHT - Math.random() * 300) : Math.random() * CANVAS_HEIGHT;
                    let radius = 100 + Math.random() * 250;

                    this.drawWatercolorBlob(xctx, cx, cy, radius, hslBg, 0.08);
                    if (Math.random() < 0.25) {
                        this.drawWatercolorBlob(xctx, cx, cy, radius * 0.6, hslAcc, 0.04);
                    }
                }

                for (let i = 0; i < 15; i++) {
                    this.drawWatercolorBlob(xctx, Math.random() * CANVAS_WIDTH, GROUND_Y - 100 + Math.random() * 200, 200 + Math.random() * 400, hslBg, 0.04);
                }
                return wc;
            },
            drawWatercolorBlob(ctx, x, y, r, color, alpha) {
                ctx.save();
                ctx.fillStyle = color;
                ctx.globalAlpha = alpha;

                ctx.beginPath();
                const points = 14;
                for (let i = 0; i <= points; i++) {
                    let angle = (i / points) * Math.PI * 2;
                    let radiusVariation = r + (Math.random() - 0.5) * r * 0.4;
                    let px = x + Math.cos(angle) * radiusVariation;
                    let py = y + Math.sin(angle) * radiusVariation;

                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.bezierCurveTo(x + Math.cos(angle - 0.2) * radiusVariation, y + Math.sin(angle - 0.2) * radiusVariation, px, py, px, py);
                }
                ctx.fill();
                ctx.lineWidth = 1.5 + Math.random() * 2;
                ctx.strokeStyle = color;
                ctx.globalAlpha = alpha * 1.5;
                ctx.stroke();
                ctx.restore();
            }
        };

            show(btn, e) {
                if (!gameState.player) return;
                let type = btn.getAttribute('data-type');
                let idx = parseInt(btn.getAttribute('data-idx'));
                let pAge = gameState.player.age;

                let data = type === 'unit' ? AGES[pAge].units[idx] : AGES[pAge].turrets[idx];
                if (!data) return;

                this.title.innerText = data.name;
                this.desc.innerText = data.desc || "";

                    html += `<div class="tt-stat"><span>Health:</span> <strong>${data.hp}</strong></div>`;
                    html += `<div class="tt-stat"><span>Damage:</span> <strong>${data.dmg}</strong></div>`;

                    html += `<div class="tt-stat"><span>Damage:</span> <strong>${data.dmg}</strong></div>`;

                    html += `<div class="tt-stat"><span>Range:</span> <strong>${data.range}</strong></div>`;
                }
                this.stats.innerHTML = html;
                this.el.classList.add('visible');
                this.move(e);
            },
            hide() { this.el.classList.remove('visible'); },
            move(e) {
                if (!this.el.classList.contains('visible')) return;
                const rect = document.getElementById('aspect-wrapper').getBoundingClientRect();

                // Prevent tooltip from overflowing screen bounds
                let x = e.clientX - rect.left;
                let y = e.clientY - rect.top;

                if (y < this.el.offsetHeight + 20) {
                    y = this.el.offsetHeight + 20;
                }

                this.el.style.left = `${x}px`;
                this.el.style.top = `${y - this.el.offsetHeight - 15}px`;
            }
        };

        // --- GEMMA TURN MEMORY AND VISION CONTEXT ---
        const GemmaMemory = {
            key: 'aow_sketch_gemma_memory_v1',
            version: 5,
            maxRecentTurns: 6,
            maxActions: 10,
            maxEvents: 12,
            validDoctrines: ['balanced', 'rush', 'tech', 'turtle', 'counter', 'bait', 'allin', 'stall'],
            data: null,
            init() {
                let stored = null;
                try {
                    let raw = localStorage.getItem(this.key);
                    if (raw) stored = JSON.parse(raw);
                } catch (e) { }
                this.data = this.normalizeData(stored);
                this.save();
                this.updateInputSuggestion();
            },
            freshData(diffKey) {
                return {
                    version: this.version,
                    matchId: '',
                    difficulty: diffKey || 'normal',
                    summary: 'No active match yet.',
                    doctrine: 'balanced',
                    openLoops: [],
                    recentTurns: [],
                    actionLedger: [],
                    eventLog: [],
                    turnCount: 0
                };
            },
            normalizeData(raw) {
                let diffKey = raw && typeof raw === 'object' ? (raw.difficulty || currentDifficulty || 'normal') : 'normal';
                let data = this.freshData(diffKey);
                if (!raw || typeof raw !== 'object') return data;
                data.matchId = this.cleanLine(raw.matchId, 80);
                data.summary = this.cleanLine(raw.summary || data.summary, 900);
                data.doctrine = this.normalizeDoctrine(raw.doctrine);
                data.openLoops = this.normalizeList(raw.openLoops, 5, 120);
                data.recentTurns = this.normalizeTurnList(raw.recentTurns);
                data.actionLedger = this.normalizeActionList(raw.actionLedger);
                data.eventLog = this.normalizeList(raw.eventLog, this.maxEvents, 180);
                data.turnCount = Number.isFinite(Number(raw.turnCount)) ? Math.max(0, Number(raw.turnCount)) : 0;
                return data;
            },
            normalizeDoctrine(value) {
                let clean = String(value || '').toLowerCase().replace(/[^a-z]/g, '').trim();
                if (clean === 'allin' || clean === 'all-in') clean = 'allin';
                return this.validDoctrines.includes(clean) ? clean : 'balanced';
            },
            normalizeList(value, maxItems, maxLen) {
                return (Array.isArray(value) ? value : [])
                    .map(item => this.cleanLine(item, maxLen))
                    .filter(Boolean)
                    .slice(-maxItems);
            },
            normalizeTurnList(value) {
                return (Array.isArray(value) ? value : []).map(turn => ({
                    role: turn && turn.role === 'model' ? 'model' : 'player',
                    time: Math.round(Number(turn && turn.time) || 0),
                    ages: this.cleanLine(turn && turn.ages, 80),
                    text: this.cleanLine(turn && turn.text, 180),
                    action: this.cleanLine(turn && turn.action, 80),
                    reason: this.cleanLine(turn && turn.reason, 90)
                })).filter(turn => turn.text).slice(-this.maxRecentTurns);
            },
            normalizeActionList(value) {
                return (Array.isArray(value) ? value : []).map(action => ({
                    time: Math.round(Number(action && action.time) || 0),
                    tool: this.cleanLine(action && action.tool, 40) || 'none',
                    applied: !!(action && action.applied),
                    reason: this.cleanLine(action && action.reason, 90),
                    say: this.cleanLine(action && action.say, 120)
                })).slice(-this.maxActions);
            },
            start(diffKey) {
                this.data = this.freshData(diffKey);
                this.data.matchId = `m${Date.now()}_${Math.floor(Math.random() * 10000)}`;
                this.data.summary = `${(DIFFICULTY_SETTINGS[diffKey] || {}).name || diffKey} match opened in Stone Age. Current doctrine balanced until Gemma chooses a new battle doctrine. Track current ages from snapshot.`;
                this.save();
                this.updateInputSuggestion();
            },
            clearAll() {
                this.data = this.freshData(currentDifficulty);
                this.data.matchId = `m${Date.now()}_${Math.floor(Math.random() * 10000)}`;
                this.data.summary = 'Player cleared Gemma turn memory for this match.';
                this.data.doctrine = 'balanced';
                this.save();
                this.updateInputSuggestion();
            },
            save() {
                try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) { }
            },
            cleanLine(value, maxLen = 180) {
                return String(value || '').replace(/\s+/g, ' ').trim().slice(0, maxLen);
            },
            ageLine() {
                if (!gameState || !gameState.player || !gameState.enemy) return '';

            recordSystem(text) {

            recordModel(turn, outcome) {

                let action = outcome || {};
                let tool = action.requestedTool || ((turn && turn.action && turn.action.tool) || 'none');

                this.data.turnCount = (this.data.turnCount || 0) + 1;
                this.data.openLoops = this.data.openLoops.filter(loop => !String(loop).startsWith('Answer player:'));

                    role: 'model',

                    time: Math.round(globalTime),

                    reason,

                });
                this.data.actionLedger = this.data.actionLedger.slice(-this.maxActions);
                this.recordEvent(`Gemma doctrine ${doctrine}, action ${action.applied ? 'applied' : 'blocked'} ${token || tool}${reason ? ` because ${reason}` : ''}`);
                if (summary) this.data.summary = this.cleanLine(summary, 900);

            compactSummary(snapshot, reason, latestPlayerMessage = '') {
                if (!this.data) this.init();
                return this.cleanLine(this.data.summary || 'No previous summary yet.', 900);
            },
            applyMemoryPatch(patch) {
                if (!patch || typeof patch !== 'object') return false;
                let changed = false;
                let setLine = (key, maxLen) => {
                    if (typeof patch[key] !== 'string') return;
                    let clean = this.cleanLine(patch[key], maxLen);
                    if (clean && clean !== this.data[key]) {
                        this.data[key] = clean;
                        changed = true;
                    }
                };
                setLine('summary', 900);
                if (Array.isArray(patch.openLoops)) {
                    this.data.openLoops = this.normalizeList(patch.openLoops, 5, 120);
                    changed = true;
                }
                return changed;
            },
            updateLocalDigest(reason) {
                let pressure = (DirectorMemory.data.agreements || {}).pressure || 'balanced';
                let doctrine = this.data.doctrine || 'balanced';
                let playerTurns = this.data.recentTurns.filter(t => t.role === 'player').slice(-2).map(t => t.text);
                let actionLine = this.data.actionLedger.slice(-5).map(a => `${a.tool}:${a.applied ? 'applied' : 'blocked'}`).join(', ');
                let highSignal = this.data.eventLog
                    .filter(line => !/^Fallback action spawn_unit/i.test(line))
                    .slice(-5)
                    .join(' ');
                let parts = [
                    `${this.data.difficulty || currentDifficulty} match at ${this.ageLine() || 'unknown ages'}.`,
                    `Pressure plan: ${pressure}.`,
                    `Gemma doctrine: ${doctrine}.`,
                    playerTurns.length ? `Recent player: ${playerTurns.join(' / ')}.` : '',
                    actionLine ? `Recent Gemma tools: ${actionLine}.` : '',
                    highSignal
                ].filter(Boolean);
                this.data.summary = this.cleanLine(parts.join(' '), 900);
                if (typeof NativeGemma !== 'undefined') {
                    NativeGemma.log('memory.local_digest', {
                        reason,
                        matchId: this.data.matchId,
                        summaryChars: this.data.summary.length
                    });
                }
            },
            updateInputSuggestion() {
                let input = document.getElementById('director-input');
                if (!input) return;
                input.placeholder = '...';
            }
        };

        function normalizeGemmaRecentUserMessage(value, maxLen = 120) {
            return String(value || '').replace(/\s+/g, ' ').trim().slice(0, maxLen);

        function captureGemmaContextImage(snapshot = null) {
            if (!LOCAL_GEMMA_IMAGE_INPUT_ENABLED) return null;
            if (!canvas || !gameState || !gameState.running) return null;
            try {
                let shot = document.createElement('canvas');
                shot.width = 896;
                shot.height = 504;
                let g = shot.getContext('2d', { alpha: false });
                if (!g) return null;
                drawGemmaContextImage(g, shot.width, shot.height, snapshot || AIDirector.snapshot());
                return shot.toDataURL('image/jpeg', 0.82);
            } catch (e) {
                NativeGemma.log('context_image.capture_failed', { message: String(e && e.message ? e.message : e) });
                return null;
            }

        function drawGemmaContextBase(g, x, y, w, h, color, title, age, hpText, state) {

        function drawGemmaContextLegend(g, x, y, w, h, playerColor, enemyColor, ink, muted) {
            drawGemmaContextRoundRect(g, x, y, w, h, 8, '#ffffff', '#d1d5db', 1);
            g.fillStyle = ink;

        function collectGemmaContextUnitMarkers() {
            let units = [];
            if (!gameState.units || !gameState.units.pool) return units;
            for (let i = 0; i < gameState.units.pool.length; i++) {
                let u = gameState.units.pool[i];
                if (!u.active || u.hp <= 0 || u.drawProgress < 0.5) continue;
                units.push({
                    team: u.team,
                    type: u.type || 'melee',
                    typeIndex: Number.isFinite(Number(u.uType)) ? Number(u.uType) : 0,
                    name: u.name || u.type || 'unit',
                    x: Math.max(0, Math.min(CANVAS_WIDTH, u.x)),
                    hpRatio: u.maxHp ? Math.max(0, Math.min(1, u.hp / u.maxHp)) : 1,
                    count: 1
                });
            }
            if (units.length <= 28) return units.sort((a, b) => a.x - b.x);

            let groups = new Map();
            units.forEach(unit => {
                let bin = Math.round(unit.x / 95);
                let key = `${unit.team}|${unit.type}|${unit.typeIndex}|${bin}`;
                let group = groups.get(key);
                if (!group) {
                    group = Object.assign({}, unit, { count: 0, hpTotal: 0, xTotal: 0 });
                    groups.set(key, group);
                }
                group.count++;
                group.hpTotal += unit.hpRatio;
                group.xTotal += unit.x;
            });
            let grouped = Array.from(groups.values()).map(group => {
                group.x = group.xTotal / group.count;
                group.hpRatio = group.hpTotal / group.count;
                delete group.hpTotal;
                delete group.xTotal;
                return group;
            }).sort((a, b) => a.x - b.x);

            if (grouped.length <= 36) return grouped;
            let sampled = [];
            let step = grouped.length / 36;
            for (let i = 0; i < 36; i++) {
                sampled.push(grouped[Math.min(grouped.length - 1, Math.floor(i * step))]);
            }
            return sampled;
        }

        function drawGemmaContextUnitMarker(g, x, y, marker, color) {
            drawGemmaContextShape(g, x, y, marker.type, color);
            g.strokeStyle = '#111827';
            g.lineWidth = 2;
            g.beginPath();
            g.arc(x, y, 15, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * marker.hpRatio);
            g.stroke();
            let side = marker.team === 1 ? 'P' : 'G';
            let label = `${side}${marker.typeIndex} ${marker.type}${marker.count > 1 ? ` x${marker.count}` : ''}`;
            drawGemmaContextLabel(g, label, x, y + (marker.team === 1 ? -24 : 30), {
                fill: '#ffffff',
                color,
                align: 'center',
                font: '800 10px system-ui, Arial, sans-serif'
            });
        }

        function drawGemmaContextShape(g, x, y, type, color) {
            g.fillStyle = color;
            g.strokeStyle = '#111827';
            g.lineWidth = 2;
            g.beginPath();
            if (type === 'ranged') {
                g.moveTo(x, y - 12);
                g.lineTo(x + 12, y + 10);
                g.lineTo(x - 12, y + 10);
                g.closePath();
            } else if (type === 'heavy') {
                g.moveTo(x, y - 14);
                g.lineTo(x + 14, y);
                g.lineTo(x, y + 14);
                g.lineTo(x - 14, y);
                g.closePath();
            } else {
                g.arc(x, y, 12, 0, Math.PI * 2);
            }
            g.fill();
            g.stroke();
        }

        function drawGemmaContextTurrets(g, x, y, state, color, label) {
            let count = state.turrets.filter(t => t !== null).length;
            drawGemmaContextLabel(g, `${label}: ${count}/${state.unlockedSlots}`, x, y, {
                fill: '#ffffff',
                color,
                align: 'center',
                font: '700 12px system-ui, Arial, sans-serif'
            });
        }

        function drawGemmaContextArrow(g, x1, y1, x2, y2, color, label) {
            g.strokeStyle = color;
            g.fillStyle = color;
            g.lineWidth = 3;
            g.beginPath();
            g.moveTo(x1, y1);
            g.lineTo(x2, y2);
            g.stroke();
            let angle = Math.atan2(y2 - y1, x2 - x1);
            g.beginPath();
            g.moveTo(x2, y2);
            g.lineTo(x2 - Math.cos(angle - 0.45) * 14, y2 - Math.sin(angle - 0.45) * 14);
            g.lineTo(x2 - Math.cos(angle + 0.45) * 14, y2 - Math.sin(angle + 0.45) * 14);
            g.closePath();
            g.fill();
            drawGemmaContextLabel(g, label, (x1 + x2) / 2, y1 - 10, {
                fill: '#ffffff',
                color,
                align: 'center',
                font: '800 11px system-ui, Arial, sans-serif'
            });
        }

        function drawGemmaContextVertical(g, x, y1, y2, color, label, side, dashed = false) {
            g.save();
            g.strokeStyle = color;
            g.lineWidth = dashed ? 3 : 2;
            if (dashed) g.setLineDash([8, 5]);
            g.beginPath();
            g.moveTo(x, y1);
            g.lineTo(x, y2);
            g.stroke();
            g.restore();
            drawGemmaContextLabel(g, label, x + (side === 'left' ? -4 : 4), y1 - 8, {
                fill: '#ffffff',
                color,
                align: side === 'left' ? 'right' : 'left',
                font: '800 10px system-ui, Arial, sans-serif'
            });
        }

        function drawGemmaContextLabel(g, text, x, y, opts = {}) {
            let font = opts.font || '700 11px system-ui, Arial, sans-serif';
            let align = opts.align || 'center';
            g.save();
            g.font = font;
            g.textAlign = align;
            g.textBaseline = 'middle';
            let metrics = g.measureText(text);
            let w = metrics.width + 10;
            let h = 18;
            let bx = align === 'center' ? x - w / 2 : (align === 'right' ? x - w : x);
            drawGemmaContextRoundRect(g, bx, y - h / 2, w, h, 4, opts.fill || '#ffffff', opts.stroke || 'rgba(17, 24, 39, 0.12)', 1);
            g.fillStyle = opts.color || '#111827';
            g.fillText(text, x, y);
            g.restore();
        }

        function drawGemmaContextRoundRect(g, x, y, w, h, r, fill, stroke, lineWidth = 1) {
            g.beginPath();
            g.moveTo(x + r, y);
            g.lineTo(x + w - r, y);
            g.quadraticCurveTo(x + w, y, x + w, y + r);
            g.lineTo(x + w, y + h - r);
            g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            g.lineTo(x + r, y + h);
            g.quadraticCurveTo(x, y + h, x, y + h - r);
            g.lineTo(x, y + r);
            g.quadraticCurveTo(x, y, x + r, y);
            g.closePath();
            if (fill) {
                g.fillStyle = fill;
                g.fill();
            }
            if (stroke) {
                g.strokeStyle = stroke;
                g.lineWidth = lineWidth;
                g.stroke();
            }
        }

        function gemmaPromptLine(value, maxLen = 180) {
            return String(value || '').replace(/\s+/g, ' ').trim().slice(0, maxLen);
        }

        function buildGemmaActionChoices(ctx) {
            let choices = [];
            (ctx.affordableUnits || []).forEach(unit => {
                choices.push({
                    token: `unit${unit.typeIndex}`,
                    tool: 'spawn_unit',
                    typeIndex: unit.typeIndex,
                    label: `spawn ${unit.name} (${unit.type}, ${unit.cost} gold)`,
                    reason: `spawn ${unit.name}`
                });
            });
            (ctx.affordableUpgrades || []).forEach(type => {
                choices.push({
                    token: type,
                    tool: 'buy_upgrade',
                    upgrade: type,
                    label: `buy ${type} upgrade`,
                    reason: `upgrade ${type}`
                });
            });
            if ((ctx.affordableTurrets || []).length || ctx.canBuyTurretSlot) {
                choices.push({
                    token: 'turret',
                    tool: 'build_turret',
                    label: ctx.openTurretSlots > 0 ? 'build best affordable turret' : 'unlock next turret slot',
                    reason: ctx.openTurretSlots > 0 ? 'base defense turret' : 'open turret slot'
                });
            }
            if (ctx.specialReady) {
                choices.push({
                    token: 'special',
                    tool: 'use_special',
                    label: 'use age special',
                    reason: 'special timing'
                });
            }
            choices.push({
                token: 'none',
                tool: 'none',
                label: 'take no model-directed action',
                reason: 'hold position'
            });
            let seen = Object.create(null);
            return choices.filter(choice => {
                if (!choice.token || seen[choice.token]) return false;
                seen[choice.token] = true;
                return true;
            });
        }

        function buildGemmaDoctrineChoices() {
            return [
                { token: 'balanced', label: 'mixed spending and normal lane control' },
                { token: 'rush', label: 'constant unit pressure and faster attacks' },
                { token: 'tech', label: 'prefer economy, upgrades, and age progress when safe' },
                { token: 'turtle', label: 'defend base, turrets, hp, and stabilizing units' },
                { token: 'counter', label: 'answer the player army type and punish overextension' },
                { token: 'bait', label: 'spend lightly, draw player forward, then punish danger zone' },
                { token: 'allin', label: 'aggressive push now, accept weaker economy' },
                { token: 'stall', label: 'delay, survive, and buy time for income or age timing' }
            ];
        }

        function buildGemmaRoleplayPrompts(ctx) {
            let snapshot = ctx.snapshot;
            let enemyAgeData = AGES[gameState.enemy.age];
            let playerAgeData = AGES[gameState.player.age];
            let compactSummary = GemmaMemory.compactSummary(snapshot, ctx.reason, ctx.relayComment ? ctx.relayComment.text : ctx.cleanExtraMessage);
            let previousSummary = gemmaPromptLine((GemmaMemory.data && GemmaMemory.data.summary) || 'No previous summary.', 900);
            let latestPlayer = gemmaPromptLine(ctx.relayComment ? ctx.relayComment.text : ctx.cleanExtraMessage, 160);
            let optionTokens = ctx.actionChoices.map(choice => choice.token).join(', ');
            let optionLines = ctx.actionChoices.map(choice => `${choice.token} = ${choice.label}`).join('\n');
            let doctrineTokens = ctx.doctrineChoices.map(choice => choice.token).join(', ');
            let doctrineLines = ctx.doctrineChoices.map(choice => `${choice.token} = ${choice.label}`).join('\n');
            let currentDoctrine = (GemmaMemory.data && GemmaMemory.data.doctrine) || 'balanced';
            let battlefieldPrompt = [
                'Gemma, I am giving you the current self-labeled battlefield image.',
                'You are Gemma, the red enemy general on the right side. I am the blue player on the left side.',
                'The image itself explains sides, attack directions, bases, hit lines, front lines, danger zone, unit markers, HP, gold, unit counts, and pressure. Read its labels first.',
                `Current ages for orientation: you are red Gemma in ${enemyAgeData.name}; the blue player is in ${playerAgeData.name}.`,
                `Current Gemma battle doctrine before your next choice: ${currentDoctrine}.`,
                `Current pacts and notes: ${DirectorMemory.tags().join(', ')}.`,
                'Act as war general for your side. Describe from your perspective the most detailed current war status you can, based on the image labels. Do not choose an action yet. Do not use JSON.'
            ].join('\n\n');
            let opinionPrompt = [
                '--- COMPACT SUMMARY OF PREVIOUS CHAT ---',
                compactSummary,
                '--- END OF COMPACT SUMMARY ---',
                latestPlayer ? `Latest player message to answer: "${latestPlayer}"` : 'The player did not send a new message this turn.',
                'Please tell your opinion of this to me as your opponent. This is the visible chat reply. Keep it to one or two strong sentences, in character, and do not use JSON.'
            ].join('\n');
            let doctrinePrompt = [
                'Choose your persistent battle doctrine for the next stretch of this match.',
                'This doctrine will steer my fast deterministic army spending between Gemma turns, so choose the strategic plan, not just the immediate click.',
                `Reply with only one word from these exact options: ${doctrineTokens}.`,
                'Doctrine meanings:',
                doctrineLines,
                'Respect player pacts. If the player asked for mercy, do not choose allin or rush unless your base is seriously threatened. No sentence, no JSON.'
            ].join('\n');
            let actionPrompt = [
                'Your turn please. Based on the state of the game you just described from your perspective, what is your play against me in this situation?',
                'Use the battle status and the doctrine you just chose, but answer with an action option word, not a doctrine word or tool name.',
                `Reply with only one word from these exact action options: ${optionTokens}.`,
                'Option meanings:',
                optionLines,
                'Pick only legal and affordable choices. If your intended move is not listed, reply none. No sentence, no JSON.'
            ].join('\n');
            let summaryPrompt = [
                'Write the compact summary text for the next turn. This exact text will be the only model memory I keep.',
                'Blend the previous compact summary with this current chat turn and the battlefield status you just described.',
                'Keep stable facts about who the player/user is, their preferences, important pacts, and the running battle story.',
                'Replace stale tactical details with the current battle state, current player request, your visible reply, the doctrine word you chose, and the action option word you chose.',
                'If your action answer was not one of the listed action option words, remember the action as none.',
                `Previous compact summary to blend from: ${previousSummary}`,
                latestPlayer ? `Current player chat/request: ${latestPlayer}` : 'Current player chat/request: none this turn.',
                'Return only the summary text under 80 words. Do not add labels, JSON, markdown, or bullets.'
            ].join('\n');
            return {
                sessionId: (GemmaMemory.data && GemmaMemory.data.matchId) || `m${Date.now()}`,
                resetChat: false,
                battlefieldPrompt,
                opinionPrompt,
                doctrinePrompt,
                actionPrompt,
                summaryPrompt
            };
        }

        function parseGemmaRoleplayResult(rawText) {
            try {
                let parsed = JSON.parse(String(rawText || '').trim());
                if (parsed && parsed.mode === 'roleplay') return parsed;
            } catch (e) { }
            return null;
        }

        function selectGemmaActionChoice(actionWord, choices) {
            let raw = String(actionWord || '').toLowerCase().replace(/[^a-z0-9_ -]/g, ' ').trim();
            let compact = raw.split(/\s+/)[0] || 'none';
            let available = Array.isArray(choices) ? choices : [];
            let exact = available.find(choice => String(choice.token || '').toLowerCase() === compact);
            if (exact) return exact;
            return available.find(choice => raw.includes(String(choice.token || '').toLowerCase())) ||
                available.find(choice => choice.token === 'none') ||
                { token: 'none', tool: 'none', label: 'fallback none', reason: 'unmatched model action' };
        }

        function selectGemmaDoctrineChoice(doctrineWord, choices) {
            let raw = String(doctrineWord || '').toLowerCase().replace(/[^a-z0-9_ -]/g, ' ').trim();
            let compact = raw.split(/\s+/)[0] || 'balanced';
            if (compact === 'all-in') compact = 'allin';
            let available = Array.isArray(choices) ? choices : [];
            let exact = available.find(choice => String(choice.token || '').toLowerCase() === compact);
            if (exact) return exact;
            return available.find(choice => raw.includes(String(choice.token || '').toLowerCase())) ||
                available.find(choice => choice.token === 'balanced') ||
                { token: 'balanced', label: 'fallback balanced doctrine' };
        }

        // --- LOCAL GEMMA BRIDGE ---
        const NativeGemma = {
            available: false,
            status: { state: 'browser', modelName: 'Local fallback', progress: 0, totalRamGb: 0 },
            pending: {},
            queuedUserComment: null,
            lastRequestAt: -999,
            init() {
                this.available = !!window.LocalGemmaAndroid;
                this.refresh();
                if (this.available) setInterval(() => this.refresh(), 4000);
            },
            refresh() {
                if (!this.available) {
                    this.updateStatus({ state: 'unavailable', modelName: 'Android Gemma', progress: 0 });
                    return;
                }
                try {
                    this.updateStatus(JSON.parse(window.LocalGemmaAndroid.getStatus()));
                } catch (e) {
                    this.updateStatus({ state: 'error', modelName: 'Android Gemma', message: 'Bridge unavailable' });
                }
            },
            log(event, details = {}) {
                if (!this.available || !window.LocalGemmaAndroid || typeof window.LocalGemmaAndroid.logDirectorEvent !== 'function') return;
                try {
                    window.LocalGemmaAndroid.logDirectorEvent(String(event || 'event'), JSON.stringify(details || {}));
                } catch (e) { }
            },
            ownsVisibleChat() {
                let state = this.status && this.status.state ? this.status.state : '';
                return this.available && (this.status.busy || ['ready', 'installed', 'loading', 'downloading'].includes(state));
            },
            updateStatus(next) {
                this.status = Object.assign({}, this.status, next || {});
                let label = '';
                let action = 'Get';
                let disabled = false;
                let visible = false;
                let state = this.status.state || 'unknown';
                let ram = this.status.totalRamGb ? ` (${this.status.totalRamGb}GB)` : '';

                if (state === 'ready') {
                    label = '';
                    disabled = true;
                } else if (state === 'loading') {
                    label = 'Gemma loading';
                    action = '';
                    disabled = true;
                    visible = true;
                } else if (state === 'downloading') {
                    let pct = Math.max(0, Math.min(100, Math.floor(this.status.progress || 0)));
                    label = `Gemma download ${pct}%`;
                    action = '';
                    disabled = true;
                    visible = true;
                } else if (state === 'installed') {
                    label = 'Gemma is stored';
                    action = 'load';
                    visible = true;
                } else if (state === 'unavailable') {
                    label = '';
                    disabled = true;
                } else if (state === 'error') {
                    label = this.status.message || 'Gemma retry needed';
                    action = 'retry';
                    visible = true;
                } else {
                    label = `offline Gemma${ram}`;
                    action = 'get';
                    visible = this.available;
                }

                let card = document.getElementById('gemma-card');
                let statusEl = document.getElementById('gemma-status');
                let button = document.getElementById('btn-gemma-install');
                if (card) card.classList.toggle('hidden', !visible);
                if (statusEl) statusEl.innerText = label;
                if (button) {
                    button.innerText = action;
                    button.disabled = disabled;
                    button.classList.toggle('hidden', !action);
                }
            },
            install() {
                if (!this.available) {
                    DirectorPanel.addSystem('Packaged Android build needed for local Gemma.');
                    return;
                }
                let model = this.status.modelName || 'Gemma 4 E2B';
                let size = this.status.recommendedSizeGb || 2.58;
                let ok = confirm(`${model} will download about ${size} GB to this device and then run offline. Continue?`);
                if (!ok) return;
                try {
                    let response = JSON.parse(window.LocalGemmaAndroid.requestInstall('auto'));
                    this.updateStatus(response);
                    DirectorPanel.addSystem('Gemma download started. Local fallback stays active.');
                } catch (e) {
                    DirectorPanel.addSystem('Android could not start the Gemma download.');
                }
            },
            queueRecentUserComment(lineId, message) {
                let clean = normalizeGemmaRecentUserMessage(message, 120);
                if (!clean) return;
                this.queuedUserComment = {
                    lineId: String(lineId || ''),
                    text: clean,
                    queuedAt: Date.now()
                };
            },
            requestTurn(reason, extraMessage = '', options = {}) {
                if (!this.available || !gameState.running || gameState.paused) return false;
                if (!['ready', 'installed'].includes(this.status.state)) return false;
                if (this.status.state === 'installed') {
                    try { window.LocalGemmaAndroid.loadModel(); } catch (e) { }
                    this.updateStatus(Object.assign({}, this.status, { state: 'loading' }));
                    return false;
                }
                let minGap = reason === 'player_chat' ? 4 : 18;
                if (this.status.busy || globalTime - this.lastRequestAt < minGap) return false;

                let snapshot = AIDirector.snapshot();
                let enemyAgeData = AGES[gameState.enemy.age];
                let agreements = DirectorMemory.data.agreements || {};
                let nextUpgradeCosts = {};
                ['dmg', 'hp', 'econ'].forEach(type => {
                    let level = Math.max(0, Math.min(9, gameState.enemy.upgrades[type] || 0));
                    nextUpgradeCosts[type] = gameState.enemy.upgrades[type] >= 10 ? null : UPGRADE_COSTS[level];
                });
                let enemyGold = Math.floor(gameState.enemy.gold);
                let affordableUnits = enemyAgeData.units
                    .map((unit, idx) => ({ typeIndex: idx, name: unit.name, type: unit.type, cost: unit.cost }))
                    .filter(unit => enemyGold >= unit.cost && !(agreements.meleeOnly && unit.type === 'ranged'));
                let affordableUpgrades = ['dmg', 'hp', 'econ'].filter(type => gameState.enemy.upgrades[type] < 10 && enemyGold >= nextUpgradeCosts[type]);
                let openTurretSlots = gameState.enemy.turrets.filter((slot, idx) => slot === null && idx < gameState.enemy.unlockedSlots).length;
                let affordableTurrets = (!agreements.noTurrets && openTurretSlots > 0)
                    ? enemyAgeData.turrets.map((turret, idx) => ({ typeIndex: idx, cost: turret.cost })).filter(turret => enemyGold >= turret.cost)
                    : [];
                let canBuyTurretSlot = !agreements.noTurrets && gameState.enemy.unlockedSlots < 4 && enemyGold >= gameState.enemy.unlockedSlots * 500;
